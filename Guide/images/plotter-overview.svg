<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">CE-515P へのデータの流れ</title>
  <desc id="d">BASIC の命令を ROM が ASCII のコマンドに変え、COM: のドライバから 15 ピンのシリアルポートへ送る流れ。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">CE-515P へのデータの流れ</text>
  <text x="24" y="55" class="sub">ROM はプロッタのコマンドを文字列にして COM: へ送るだけで、返答のデータは読まない</text>
  <rect x="40" y="78" width="154" height="62" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="117.0" y="103" class="b" text-anchor="middle">BASIC の命令</text>
  <text x="117.0" y="124" class="s" text-anchor="middle">LLINE、CIRCLE など</text>
  <rect x="218" y="78" width="154" height="62" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="295.0" y="103" class="b" text-anchor="middle">命令の処理</text>
  <text x="295.0" y="124" class="s" text-anchor="middle">E6681h〜</text>
  <polyline points="202,109 216,109" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="211,105 216,109 211,113" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="396" y="78" width="154" height="62" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="473.0" y="103" class="b" text-anchor="middle">COM: ドライバ</text>
  <text x="473.0" y="124" class="s" text-anchor="middle">1 バイトずつ送信</text>
  <polyline points="380,109 394,109" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="389,105 394,109 389,113" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="574" y="78" width="154" height="62" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="651.0" y="103" class="b" text-anchor="middle">15 ピン</text>
  <text x="651.0" y="124" class="s" text-anchor="middle">CE-516L ケーブル</text>
  <polyline points="558,109 572,109" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="567,105 572,109 567,113" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="752" y="78" width="154" height="62" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="829.0" y="103" class="b" text-anchor="middle">CE-515P</text>
  <text x="829.0" y="124" class="s" text-anchor="middle">ペンで描く</text>
  <polyline points="736,109 750,109" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="745,105 750,109 745,113" fill="none" stroke="#9AA5B1" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="40" y="176" class="b">例：LLINE (1,2)-(3,4),2,3,B の送信バイト</text>
  <rect x="40" y="190" width="80" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="80.0" y="212.0" class="ms" text-anchor="middle">M1,2</text>
  <rect x="120" y="190" width="66" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="153.0" y="212.0" class="ms" text-anchor="middle">CR NUL</text>
  <rect x="186" y="190" width="56" height="34" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="214.0" y="212.0" class="ms" text-anchor="middle">L2</text>
  <rect x="242" y="190" width="66" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="275.0" y="212.0" class="ms" text-anchor="middle">CR NUL</text>
  <rect x="308" y="190" width="66" height="34" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1.1"/>
  <text x="341.0" y="212.0" class="ms" text-anchor="middle">ESC 3</text>
  <rect x="374" y="190" width="66" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="407.0" y="212.0" class="ms" text-anchor="middle">CR NUL</text>
  <rect x="440" y="190" width="186" height="34" rx="0" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.1"/>
  <text x="533.0" y="212.0" class="ms" text-anchor="middle">D3,2,3,4,1,4,1,2</text>
  <rect x="626" y="190" width="66" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="659.0" y="212.0" class="ms" text-anchor="middle">CR NUL</text>
  <rect x="692" y="190" width="80" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="732.0" y="212.0" class="ms" text-anchor="middle">M3,4</text>
  <rect x="772" y="190" width="66" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="805.0" y="212.0" class="ms" text-anchor="middle">CR NUL</text>
  <text x="40" y="244" class="s">始点へ移動</text>
  <text x="186" y="244" class="s">線の種類</text>
  <text x="308" y="244" class="s">色</text>
  <text x="440" y="244" class="s">四角形の 4 辺</text>
  <text x="692" y="244" class="s">終点へ移動</text>
  <polyline points="24,266 956,266" fill="none" stroke="#D9E0E8" stroke-width="1" stroke-linejoin="round"/>
  <text x="40" y="294" class="b">コマンドは 2 種類ある</text>
  <rect x="40" y="308" width="440" height="136" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="56" y="332" class="b">ESC と 1 バイト（区切りなし）</text>
  <text x="56" y="356" class="m">ESC a  テキストモード（LTEXT）</text>
  <text x="56" y="378" class="m">ESC b  グラフィックモード（GRAPH）</text>
  <text x="56" y="400" class="m">ESC 0〜3  色（COLOR）</text>
  <text x="56" y="422" class="m">ESC ? c  文字サイズ（CSIZE）</text>
  <rect x="500" y="308" width="440" height="136" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="516" y="332" class="b">ASCII の 1 行（CR NUL で終わる）</text>
  <text x="516" y="356" class="m">M x,y  移動    D x,y,...  線</text>
  <text x="516" y="378" class="m">R x,y  相対移動 J x,y,...  相対の線</text>
  <text x="516" y="400" class="m">L n  線の種類  Q n  文字の向き</text>
  <text x="516" y="422" class="m">I  原点の設定</text>
</svg>
