<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="t d">
  <title id="t">CALL 文と機械語の戻り方</title>
  <desc id="d">BASIC の CALL が X を退避して戻り番地を積み、ユーザの機械語が RETF で戻るまでの順序と、戻るときのキャリーの扱い。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a2F6DB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="a2F855A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="519" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">CALL 文の動き</text>
  <text x="24" y="55" class="sub">BASIC の CALL で機械語を呼ぶ。戻るときは RET ではなく RETF</text>
  <rect x="80" y="74" width="220" height="50" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="190.0" y="95.0" class="b" text-anchor="middle">BASIC（ROM）</text>
  <text x="190.0" y="113.0" class="s" text-anchor="middle">CALL の処理 F9F34h</text>
  <rect x="410" y="74" width="220" height="50" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="520.0" y="95.0" class="b" text-anchor="middle">ユーザの機械語</text>
  <text x="520.0" y="113.0" class="s" text-anchor="middle">例: BEC00h</text>
  <line x1="190" y1="124" x2="190" y2="490" stroke="#9AA5B1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="520" y1="124" x2="520" y2="490" stroke="#9AA5B1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="50" y="150" width="280" height="44" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="190.0" y="168.0" class="m" xml:space="preserve" text-anchor="middle">CALL &amp;HBEC00</text>
  <text x="190.0" y="186.0" class="s" text-anchor="middle">番地を 20 ビットで評価し Y に入れる</text>
  <rect x="50" y="204" width="280" height="44" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="190.0" y="222.0" class="s" text-anchor="middle">X を U スタックへ退避</text>
  <text x="190.0" y="240.0" class="s" text-anchor="middle">戻り番地 F9F4Eh を S へ 3 バイト積む</text>
  <polyline points="190,280 520,280" fill="none" stroke="#2F6DB5" stroke-width="1.8" marker-end="url(#a2F6DB5)"/>
  <text x="355.0" y="272" class="lbl" text-anchor="middle">JP Y</text>
  <rect x="410" y="296" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="520.0" y="313.0" class="s" text-anchor="middle">処理の本体</text>
  <text x="520.0" y="329.0" class="s" text-anchor="middle">X / A / BA / I などは壊してよい</text>
  <text x="520.0" y="345.0" class="s" text-anchor="middle">U / S の積み降ろしは対にする</text>
  <polyline points="520,380 190,380" fill="none" stroke="#2F855A" stroke-width="1.8" marker-end="url(#a2F855A)"/>
  <text x="355.0" y="372" class="lbl" text-anchor="middle">RETF（3 バイト取り出す）</text>
  <rect x="50" y="396" width="280" height="44" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="190.0" y="414.0" class="s" text-anchor="middle">F9F4Eh: X を復元</text>
  <text x="190.0" y="432.0" class="s" text-anchor="middle">RETF で BASIC の処理へ戻る</text>
  <rect x="50" y="454" width="280" height="36" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="190.0" y="477.0" class="b" text-anchor="middle">次の BASIC 文へ</text>
  <text x="690" y="88" class="b">戻るときのチェック</text>
  <rect x="690" y="100" width="266" height="84" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="823.0" y="127.0" class="b" text-anchor="middle">C=0 で RETF</text>
  <text x="823.0" y="147.0" text-anchor="middle">正常終了</text>
  <text x="823.0" y="167.0" class="s" text-anchor="middle">戻る直前に RC を置くと安全</text>
  <rect x="690" y="200" width="266" height="104" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="823.0" y="227.0" class="b" text-anchor="middle">C=1 で RETF</text>
  <text x="823.0" y="247.0" text-anchor="middle">A がエラー番号として扱われる</text>
  <text x="823.0" y="267.0" class="s" text-anchor="middle">A=2Ch なら Bad line number</text>
  <text x="823.0" y="287.0" class="s" text-anchor="middle">IOCS のエラーをそのまま返せる</text>
  <rect x="690" y="320" width="266" height="100" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="823.0" y="345.0" class="b" text-anchor="middle">RET で戻る</text>
  <text x="823.0" y="365.0" text-anchor="middle">S が 1 バイトずれて暴走し</text>
  <text x="823.0" y="385.0" text-anchor="middle">メインメニューに落ちる</text>
  <text x="823.0" y="405.0" class="s" text-anchor="middle">RET は 2 バイトしか取り出さない</text>
  <text x="690" y="442" class="s">CALL に引数は渡せない。データは決まった</text>
  <text x="690" y="460" class="s">番地を POKE / PEEK して受け渡す。</text>
</svg>
