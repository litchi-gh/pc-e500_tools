  <text x="24" y="440" class="s">同じ改訂なら BASIC の修正内容は共通（例: 改訂 6 の修正は 6.2・6.3・6.4 にすべて入る）。7.2 と 7.5 は版番号を除いてコードが同一。</text>
  <text x="24" y="458" class="s">改訂 4 は手元にない。PC-1480U の ROM は実体 128 KB。機種名はファイル名に基づく。</text>
