<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">MEM$="B" と AMC</title>
  <desc id="d">内蔵 RAM とカードを、AMC で続いた番地に見せる。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">MEM$="B" と AMC</text>
  <text x="24" y="55" class="sub">内蔵 RAM 32 KB、カード 64 KB の例。S1: の先頭は C0000h − 96 KB = A8000h</text>
  <text x="120" y="92" class="b" text-anchor="middle">ソフトから見る番地</text>
  <text x="490" y="92" class="b" text-anchor="middle">実際の場所</text>
  <rect x="40" y="110" width="160" height="150" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="120.0" y="181.0" class="b" text-anchor="middle">カードの内容</text>
  <text x="120.0" y="199.0" class="ms" xml:space="preserve" text-anchor="middle">A8000h〜B7FFFh</text>
  <rect x="40" y="260" width="160" height="80" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="120.0" y="296.0" class="b" text-anchor="middle">内蔵 RAM</text>
  <text x="120.0" y="314.0" class="ms" xml:space="preserve" text-anchor="middle">B8000h〜BFFFFh</text>
  <text x="32" y="116" class="s"></text>
  <rect x="390" y="110" width="200" height="150" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="490.0" y="181.0" class="b" text-anchor="middle">RAM カード（CE1）</text>
  <text x="490.0" y="199.0" class="ms" xml:space="preserve" text-anchor="middle">40000h〜4FFFFh</text>
  <rect x="390" y="280" width="200" height="80" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="490.0" y="316.0" class="b" text-anchor="middle">内蔵 RAM（CE0）</text>
  <text x="490.0" y="334.0" class="ms" xml:space="preserve" text-anchor="middle">B8000h〜BFFFFh</text>
  <polyline points="200,185 390,185" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <text x="295" y="177" class="lbl" text-anchor="middle">AMC で CE1 へ</text>
  <polyline points="200,300 390,320" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <text x="295" y="298" class="lbl" text-anchor="middle">そのまま</text>
  <rect x="650" y="110" width="290" height="130" rx="8" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="795.0" y="144.0" class="b" text-anchor="middle">EFh（AMC）= 8Fh</text>
  <text x="795.0" y="162.0" class="s" text-anchor="middle">ビット 7: 有効</text>
  <text x="795.0" y="180.0" class="s" text-anchor="middle">ビット 5〜0: CE0 の容量</text>
  <text x="795.0" y="198.0" class="s" text-anchor="middle">000000 2 KB、000111 16 KB、001111 32 KB</text>
  <text x="795.0" y="216.0" class="s" text-anchor="middle">011111 64 KB、111111 128 KB</text>
  <rect x="650" y="260" width="290" height="100" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="795.0" y="288.0" class="b" text-anchor="middle">ROM が見分ける印</text>
  <text x="795.0" y="306.0" class="s" text-anchor="middle">カードの +05 を 02h にする</text>
  <text x="795.0" y="324.0" class="s" text-anchor="middle">内蔵 RAM の先頭 10 12 を 00 00 にする</text>
  <text x="795.0" y="342.0" class="s" text-anchor="middle">抜くと S1:NEW CARD になる</text>
  <rect x="40" y="384" width="900" height="60" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="490.0" y="419.0" text-anchor="middle">ソフトからは連続した 1 つの S1: に見える。カード側の番地は公式の図に基づく推定で、実機では確かめていない</text>
</svg>
