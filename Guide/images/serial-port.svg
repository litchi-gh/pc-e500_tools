<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="t d">
  <title id="t">シリアルポートの信号と 1 文字</title>
  <desc id="d">15 ピンの信号線の向きと、1 文字のビットの並び、OPEN の設定が入るレジスタを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <rect x="0.5" y="0.5" width="979" height="599" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">シリアルポート（COM:）</text>
  <text x="24" y="55" class="sub">信号は VC と SG の間の CMOS レベル。範囲を超える電圧をかけると壊れるので、RS-232C にはレベル変換器を介してつなぐ</text>
  <rect x="50" y="76" width="200" height="282" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="150" y="100" class="b" text-anchor="middle">PC-E500</text>
  <rect x="730" y="76" width="200" height="282" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="830" y="100" class="b" text-anchor="middle">相手の機器</text>
  <text x="66" y="129" class="m">2</text>
  <text x="94" y="129" class="b">SD（TXD）</text>
  <text x="490" y="118" class="s" text-anchor="middle">送信データ</text>
  <polyline points="256,124 720,124" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="712,120 720,124 712,128" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="66" y="161" class="m">3</text>
  <text x="94" y="161" class="b">RD（RXD）</text>
  <text x="490" y="150" class="s" text-anchor="middle">受信データ</text>
  <polyline points="724,156 260,156" fill="none" stroke="#2F855A" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="268,152 260,156 268,160" fill="none" stroke="#2F855A" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="66" y="193" class="m">4</text>
  <text x="94" y="193" class="b">RS（RTS）</text>
  <text x="490" y="182" class="s" text-anchor="middle">送信の間 High</text>
  <polyline points="256,188 720,188" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="712,184 720,188 712,192" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="66" y="225" class="m">5</text>
  <text x="94" y="225" class="b">CS（CTS）</text>
  <text x="490" y="214" class="s" text-anchor="middle">High のときだけ送信する（既定で監視する）</text>
  <polyline points="724,220 260,220" fill="none" stroke="#2F855A" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="268,216 260,220 268,224" fill="none" stroke="#2F855A" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="66" y="257" class="m">8</text>
  <text x="94" y="257" class="b">CD</text>
  <text x="490" y="246" class="s" text-anchor="middle">High のときだけ受信する（既定で監視する）</text>
  <polyline points="724,252 260,252" fill="none" stroke="#2F855A" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="268,248 260,252 268,256" fill="none" stroke="#2F855A" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="66" y="289" class="m">11</text>
  <text x="94" y="289" class="b">RR</text>
  <text x="490" y="278" class="s" text-anchor="middle">受信できるとき High、バッファが満杯に近いと Low</text>
  <polyline points="256,284 720,284" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="712,280 720,284 712,288" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="66" y="321" class="m">14</text>
  <text x="94" y="321" class="b">ER（DTR）</text>
  <text x="490" y="310" class="s" text-anchor="middle">OPEN の間 High</text>
  <polyline points="256,316 720,316" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="712,312 720,316 712,320" fill="none" stroke="#2F6DB5" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="66" y="352" class="s">7 SG  1 FG  10,13 VC</text>
  <text x="490" y="352" class="s" text-anchor="middle">SG は相手と共通にする。VC は電源</text>
  <polyline points="24,376 956,376" fill="none" stroke="#D9E0E8" stroke-width="1" stroke-linejoin="round"/>
  <text x="48" y="404" class="b">1 文字のビットの並び（例：F0h、奇数パリティ、ストップ 1）。データは下位ビットから送る</text>
  <rect x="60" y="418" width="66" height="30" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="93.0" y="438.0" class="s" text-anchor="middle">開始</text>
  <rect x="126" y="418" width="66" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="159.0" y="438.0" class="m" text-anchor="middle">0</text>
  <rect x="192" y="418" width="66" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="225.0" y="438.0" class="m" text-anchor="middle">0</text>
  <rect x="258" y="418" width="66" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="291.0" y="438.0" class="m" text-anchor="middle">0</text>
  <rect x="324" y="418" width="66" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="357.0" y="438.0" class="m" text-anchor="middle">0</text>
  <rect x="390" y="418" width="66" height="30" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="423.0" y="438.0" class="m" text-anchor="middle">1</text>
  <rect x="456" y="418" width="66" height="30" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="489.0" y="438.0" class="m" text-anchor="middle">1</text>
  <rect x="522" y="418" width="66" height="30" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="555.0" y="438.0" class="m" text-anchor="middle">1</text>
  <rect x="588" y="418" width="66" height="30" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="621.0" y="438.0" class="m" text-anchor="middle">1</text>
  <rect x="654" y="418" width="66" height="30" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1.1"/>
  <text x="687.0" y="438.0" class="m" text-anchor="middle">P</text>
  <rect x="720" y="418" width="66" height="30" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="753.0" y="438.0" class="s" text-anchor="middle">停止</text>
  <text x="48" y="490" class="b">OPEN の設定が入る UCR（F7h）</text>
  <rect x="280" y="472" width="60" height="28" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="310.0" y="491.0" class="s" text-anchor="middle">7: 0</text>
  <rect x="340" y="472" width="220" height="28" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="450.0" y="491.0" class="s" text-anchor="middle">6-4 ボーレート</text>
  <rect x="560" y="472" width="150" height="28" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="635.0" y="491.0" class="s" text-anchor="middle">3-2 パリティ</text>
  <rect x="710" y="472" width="80" height="28" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="750.0" y="491.0" class="s" text-anchor="middle">1 語長</text>
  <rect x="790" y="472" width="80" height="28" rx="0" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.1"/>
  <text x="830.0" y="491.0" class="s" text-anchor="middle">0 停止</text>
  <text x="48" y="528" class="s">ボーレート 001=300 010=600 011=1200 100=2400 101=4800 110=9600 / パリティ 00=偶数 01=奇数 1x=なし / 語長 0=8 1=7 / 停止 0=1 1=2</text>
  <text x="48" y="552" class="s">例：1200,N,8,1 は 38h。CLOSE でビット 6〜4 を 0 にして止める</text>
  <text x="48" y="576" class="s">線の High、Low とビットの対応は実機で測っていない</text>
</svg>
