  <text x="574.0" y="186" class="s" text-anchor="middle">12</text>
  <rect x="596" y="192" width="44" height="42" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="618.0" y="218.0" class="m" xml:space="preserve" text-anchor="middle">FF</text>
  <text x="618.0" y="186" class="s" text-anchor="middle">13</text>
  <rect x="640" y="192" width="44" height="42" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="662.0" y="218.0" class="m" xml:space="preserve" text-anchor="middle">00</text>
  <text x="662.0" y="186" class="s" text-anchor="middle">14</text>
  <rect x="684" y="192" width="44" height="42" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="706.0" y="218.0" class="m" xml:space="preserve" text-anchor="middle">0F</text>
  <text x="706.0" y="186" class="s" text-anchor="middle">15</text>
  <rect x="734" y="192" width="222" height="42" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="845.0" y="218.0" class="m" xml:space="preserve" text-anchor="middle">30 CC D6 ...</text>
  <text x="845.0" y="186" class="s" text-anchor="middle">16〜（本体）</text>
  <path d="M27,240 v8 H241 v-8" fill="none" stroke="#7B8794" stroke-width="1.5"/>
  <text x="134.0" y="266" class="b" text-anchor="middle">固定</text>
  <text x="134.0" y="284" class="s" text-anchor="middle">種別を表す</text>
  <text x="134.0" y="300" class="s" text-anchor="middle">（FF 00 06 01 10）</text>
  <path d="M247,240 v8 H373 v-8" fill="none" stroke="#B7791F" stroke-width="1.5"/>
  <text x="310.0" y="266" class="b" text-anchor="middle">データ長</text>
  <text x="310.0" y="284" class="s" text-anchor="middle">下位から並ぶ</text>
  <text x="310.0" y="300" class="s" text-anchor="middle">→ 00002Eh = 46 バイト</text>
  <path d="M379,240 v8 H505 v-8" fill="none" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="442.0" y="266" class="b" text-anchor="middle">開始アドレス</text>
  <text x="442.0" y="284" class="s" text-anchor="middle">下位から並ぶ</text>
  <text x="442.0" y="300" class="s" text-anchor="middle">→ 0BEC00h</text>
  <path d="M511,240 v8 H725 v-8" fill="none" stroke="#7B8794" stroke-width="1.5"/>
  <text x="618.0" y="266" class="b" text-anchor="middle">固定</text>
  <text x="618.0" y="284" class="s" text-anchor="middle">FF FF FF 00 0F</text>
  <text x="24" y="372" class="b">ASCII ファイル（LOAD / SAVE ,A）  ヘッダなしのテキスト</text>
  <rect x="24" y="388" width="40" height="28" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
