  <text x="644.0" y="407.0" class="m" xml:space="preserve" text-anchor="middle">22</text>
  <text x="644" y="432" class="s" text-anchor="middle">"</text>
  <rect x="664" y="388" width="40" height="28" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="684.0" y="407.0" class="m" xml:space="preserve" text-anchor="middle">0D</text>
  <text x="684" y="432" class="s" text-anchor="middle">CR</text>
  <rect x="704" y="388" width="40" height="28" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="724.0" y="407.0" class="m" xml:space="preserve" text-anchor="middle">0A</text>
  <text x="724" y="432" class="s" text-anchor="middle">LF</text>
  <text x="770" y="396" class="s">行区切りは CR+LF</text>
  <text x="770" y="413" class="s">EOF の 1Ah は付けない</text>
  <text x="770" y="430" class="s">エミュレータが送るので</text>
  <text x="770" y="447" class="s">付けると I/O エラーになる</text>
  <text x="24" y="476" class="sub">ce140conv info &lt;ファイル&gt; で、種別・長さ・開始アドレス・EOF の有無を確認できる。</text>
