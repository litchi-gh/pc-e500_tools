<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" role="img" aria-labelledby="t d">
  <title id="t">PC-E500 につなげる周辺機器</title>
  <desc id="d">本体の 11 ピン、15 ピン、カードスロットと、それぞれにつながる周辺機器を示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <rect x="0.5" y="0.5" width="979" height="569" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">PC-E500 につなげる周辺機器</text>
  <text x="24" y="55" class="sub">本体の接続口は 11 ピン、15 ピン（シリアル）、カードスロットの 3 つ</text>
  <rect x="40" y="200" width="200" height="190" rx="10" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.8"/>
  <text x="140" y="226" class="b" text-anchor="middle">PC-E500</text>
  <text x="140" y="246" class="s" text-anchor="middle">シリーズ</text>
  <rect x="70" y="261" width="140" height="30" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="140.0" y="281.0" class="s" text-anchor="middle">11 ピン</text>
  <rect x="70" y="303" width="140" height="30" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="140.0" y="323.0" class="s" text-anchor="middle">15 ピン</text>
  <rect x="70" y="345" width="140" height="30" rx="4" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.1"/>
  <text x="140.0" y="365.0" class="s" text-anchor="middle">カードスロット</text>
  <polyline points="210,276 300,276 300,100 420,100" fill="none" stroke="#2F6DB5" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="79" width="510" height="42" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="436" y="97" class="b">CE-126P 感熱プリンタ</text>
  <text x="436" y="114" class="s">24 桁。カセットインターフェース内蔵。単 3 形 4 本</text>
  <polyline points="210,276 300,276 300,150 420,150" fill="none" stroke="#2F6DB5" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="129" width="510" height="42" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="436" y="147" class="b">CE-124 カセットインターフェース</text>
  <text x="436" y="164" class="s">レコーダの MIC と EAR につなぐ</text>
  <polyline points="210,276 300,276 300,200 420,200" fill="none" stroke="#2F6DB5" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="179" width="510" height="42" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="436" y="197" class="b">CE-140F ポケットディスクドライブ</text>
  <text x="436" y="214" class="s">2.5 インチ、片面 64 KB。CE-126P を同時につなげる</text>
  <polyline points="210,318 300,318 300,256 420,256" fill="none" stroke="#B7791F" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="235" width="510" height="42" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="436" y="253" class="b">CE-515P カラープロッタ（CE-516L ケーブル）</text>
  <text x="436" y="270" class="s">4 色ペン、0.2 mm ステップ。1200 bps</text>
  <polyline points="210,318 300,318 300,306 420,306" fill="none" stroke="#B7791F" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="285" width="510" height="42" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="436" y="303" class="b">CE-130T / CE-140T / CE-135T レベルコンバータ</text>
  <text x="436" y="320" class="s">パソコンとの接続。CE-140T は外部電源が不要</text>
  <polyline points="210,318 300,318 300,356 420,356" fill="none" stroke="#B7791F" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="335" width="510" height="42" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="436" y="353" class="b">パソコン接続ケーブル（他社の USB、D-Sub 9）</text>
  <text x="436" y="370" class="s">15 ピンと USB または D-Sub 9</text>
  <polyline points="210,360 300,360 300,412 420,412" fill="none" stroke="#6B46C1" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="391" width="510" height="42" rx="6" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.1"/>
  <text x="436" y="409" class="b">純正 RAM カード CE-212M / 2H16M / 2H32M / 2H64M</text>
  <text x="436" y="426" class="s">8〜64 KB。40000h から。電池 CR1616</text>
  <polyline points="210,360 300,360 300,462 420,462" fill="none" stroke="#6B46C1" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="441" width="510" height="42" rx="6" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.1"/>
  <text x="436" y="459" class="b">他社の RAM、FRAM カード</text>
  <text x="436" y="476" class="s">128 KB、256 KB、256 KB×2（切替）</text>
  <polyline points="210,360 300,360 300,512 420,512" fill="none" stroke="#6B46C1" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="420" y="491" width="510" height="42" rx="6" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.1"/>
  <text x="436" y="509" class="b">ROM カード（CE-2S01 など）</text>
  <text x="436" y="526" class="s">10000h〜1FFFFh の領域。仕様は未確認</text>
</svg>
