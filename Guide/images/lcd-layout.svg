<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="t d">
  <title id="t">LCD の構成</title>
  <desc id="d">240 × 32 ドットの画面を 2 つのコントローラが担当する配置と、右半分で Y アドレスが逆になること、1 バイトが縦 8 ドットであること。</desc>
