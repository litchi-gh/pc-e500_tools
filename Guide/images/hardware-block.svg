<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d">
  <title id="t">PC-E500 のハードウェア構成</title>
  <desc id="d">CPU SC62015 にキーボード、コネクタ、外部バス上の LCD コントローラ、RAM、ROM、カードスロットがつながる構成。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="399" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">ハードウェアの全体構成</text>
  <text x="24" y="55" class="sub">対象は PC-E500 / PC-1480U（『ポケコン活用研究』第 10 章より）</text>
  <rect x="24" y="110" width="170" height="74" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="109.0" y="134.0" class="b" text-anchor="middle">11 ピン</text>
  <text x="109.0" y="152.0" class="b" text-anchor="middle">オプションコネクタ</text>
  <text x="109.0" y="170.0" class="s" text-anchor="middle">カセット・FDD・プリンタ</text>
  <rect x="24" y="220" width="170" height="74" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="109.0" y="244.0" class="b" text-anchor="middle">15 ピン</text>
  <text x="109.0" y="262.0" class="b" text-anchor="middle">シリアルポート</text>
  <text x="109.0" y="280.0" class="s" text-anchor="middle">CMOS レベル</text>
  <rect x="300" y="100" width="230" height="200" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="2.4"/>
  <text x="415.0" y="142.0" class="b" text-anchor="middle">CPU  SC62015</text>
  <text x="415.0" y="160.0" text-anchor="middle">2.304 MHz</text>
  <text x="415.0" y="178.0" text-anchor="middle">1 サイクル = 1.30 µs</text>
  <text x="415.0" y="196.0" text-anchor="middle"></text>
  <text x="415.0" y="214.0" class="s" text-anchor="middle">内部 RAM 256 バイト</text>
  <text x="415.0" y="232.0" class="s" text-anchor="middle">E-PORT F3h–F6h</text>
  <text x="415.0" y="250.0" class="s" text-anchor="middle">UART F7h–FAh</text>
  <text x="415.0" y="268.0" class="s" text-anchor="middle">KO F0h–F1h / KI F2h</text>
  <polyline points="300,147 194,147" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
  <text x="247" y="139" class="lbl" text-anchor="middle">CI, CO, E</text>
  <polyline points="300,257 194,257" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
  <text x="247" y="249" class="lbl" text-anchor="middle">E, RTD, XTD</text>
  <rect x="300" y="330" width="230" height="50" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="415.0" y="360.0" class="b" text-anchor="middle">キーボード</text>
  <polyline points="415,300 415,330" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
  <text x="428" y="321" class="lbl">KO / KI で直結</text>
  <rect x="600" y="80" width="10" height="300" rx="4" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="590" y="72" class="s">アドレスバス + データバス（外部メモリ空間 1 MB）</text>
  <polyline points="530,200 600,200" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
  <rect x="660" y="86" width="296" height="62" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="808.0" y="113.0" class="b" text-anchor="middle">LCD コントローラ × 2</text>
  <text x="808.0" y="131.0" class="s" text-anchor="middle">2000h–200Bh に書く</text>
  <polyline points="610,117 660,117" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
  <rect x="660" y="160" width="296" height="62" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="808.0" y="187.0" class="b" text-anchor="middle">RAM</text>
  <text x="808.0" y="205.0" class="s" text-anchor="middle">プログラムと作業領域</text>
  <polyline points="610,191 660,191" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
  <rect x="660" y="234" width="296" height="62" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="808.0" y="261.0" class="b" text-anchor="middle">ROM</text>
  <text x="808.0" y="279.0" class="s" text-anchor="middle">BASIC・IOCS など</text>
  <polyline points="610,265 660,265" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
  <rect x="660" y="308" width="296" height="62" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="808.0" y="335.0" class="b" text-anchor="middle">カードスロット</text>
  <text x="808.0" y="353.0" class="s" text-anchor="middle">ROM / RAM カード</text>
  <polyline points="610,339 660,339" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)" marker-start="url(#a52606D)"/>
</svg>
