<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d">
  <title id="t">スロットとメモリブロック</title>
  <desc id="d">スロットの中にメモリブロックが並び、RAMFILE ブロックの中が FAT12 のディスクになっている図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <rect x="0.5" y="0.5" width="979" height="559" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">スロットとメモリブロック</text>
  <text x="24" y="55" class="sub">内蔵 RAM、RAM カード、ROM の G: 領域は同じ構造。ROM 3.2、32 KB の実データ</text>
  <text x="40" y="88" class="b">スロット S1:（B8000h〜）</text>
  <rect x="40" y="100" width="70" height="56" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="75.0" y="124" class="s" text-anchor="middle">ヘッダ</text>
  <text x="75.0" y="144" class="s" text-anchor="middle">18h</text>
  <rect x="110" y="100" width="120" height="56" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="170.0" y="124" class="b" text-anchor="middle">RAMFILE</text>
  <text x="170.0" y="144" class="s" text-anchor="middle">INIT で作る</text>
  <rect x="230" y="100" width="280" height="56" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="370.0" y="124" class="b" text-anchor="middle">DATA.BAS</text>
  <text x="370.0" y="144" class="s" text-anchor="middle">変数 + 空き</text>
  <rect x="510" y="100" width="130" height="56" rx="0" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.1"/>
  <text x="575.0" y="124" class="b" text-anchor="middle">TEXT.BAS</text>
  <text x="575.0" y="144" class="s" text-anchor="middle">プログラム</text>
  <rect x="640" y="100" width="90" height="56" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="685.0" y="124" class="b" text-anchor="middle">FUNCKEY</text>
  <rect x="730" y="100" width="70" height="56" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="765.0" y="124" class="s" text-anchor="middle">AER</text>
  <rect x="800" y="100" width="60" height="56" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1.1"/>
  <text x="830.0" y="124" class="s" text-anchor="middle">FF</text>
  <text x="830.0" y="144" class="s" text-anchor="middle">終わり</text>
  <polyline points="24,176 956,176" fill="none" stroke="#D9E0E8" stroke-width="1" stroke-linejoin="round"/>
  <text x="40" y="204" class="b">メモリブロックの先頭（22h バイト）</text>
  <rect x="40" y="216" width="26" height="34" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1.1"/>
  <text x="53.0" y="238.0" class="s" text-anchor="middle">FB</text>
  <rect x="66" y="216" width="208" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="170.0" y="238.0" class="s" text-anchor="middle">名前 8</text>
  <rect x="274" y="216" width="78" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="313.0" y="238.0" class="s" text-anchor="middle">拡張子 3</text>
  <rect x="352" y="216" width="26" height="34" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="365.0" y="238.0" class="s" text-anchor="middle">属性</text>
  <rect x="378" y="216" width="52" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="404.0" y="238.0" class="s" text-anchor="middle">時刻</text>
  <rect x="430" y="216" width="52" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="456.0" y="238.0" class="s" text-anchor="middle">日付</text>
  <rect x="482" y="216" width="78" height="34" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="521.0" y="238.0" class="s" text-anchor="middle">長さ 3</text>
  <rect x="560" y="216" width="52" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="586.0" y="238.0" class="s" text-anchor="middle">00</text>
  <rect x="612" y="216" width="78" height="34" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="651.0" y="238.0" class="s" text-anchor="middle">ファイル長 3</text>
  <rect x="690" y="216" width="234" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="807.0" y="238.0" class="s" text-anchor="middle">空き</text>
  <text x="40" y="272" class="s">長さは次のブロックまで（空きを含む）。ファイル長はヘッダを含む中身の長さ</text>
  <polyline points="24,288 956,288" fill="none" stroke="#D9E0E8" stroke-width="1" stroke-linejoin="round"/>
  <text x="40" y="316" class="b">RAMFILE の中（E:16K の例）。1 セクタ 256 バイトの FAT12</text>
  <rect x="40" y="328" width="150" height="56" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="115.0" y="352" class="b" text-anchor="middle">セクタ 0</text>
  <text x="115.0" y="372" class="s" text-anchor="middle">ヘッダ + 情報</text>
  <rect x="190" y="328" width="110" height="56" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="245.0" y="352" class="b" text-anchor="middle">セクタ 1</text>
  <text x="245.0" y="372" class="s" text-anchor="middle">FAT</text>
  <rect x="300" y="328" width="220" height="56" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="410.0" y="352" class="b" text-anchor="middle">セクタ 2〜5</text>
  <text x="410.0" y="372" class="s" text-anchor="middle">ディレクトリ 32 個</text>
  <rect x="520" y="328" width="400" height="56" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="720.0" y="352" class="b" text-anchor="middle">セクタ 6〜</text>
  <text x="720.0" y="372" class="s" text-anchor="middle">データ（クラスタ 2〜3Bh）</text>
  <text x="40" y="416" class="b">ディレクトリの 1 エントリ（32 バイト。MS-DOS と同じ並び）</text>
  <rect x="40" y="428" width="208" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="144.0" y="450.0" class="s" text-anchor="middle">名前 8</text>
  <rect x="248" y="428" width="78" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.1"/>
  <text x="287.0" y="450.0" class="s" text-anchor="middle">拡張子 3</text>
  <rect x="326" y="428" width="52" height="34" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.1"/>
  <text x="352.0" y="450.0" class="s" text-anchor="middle">属性</text>
  <rect x="378" y="428" width="234" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="495.0" y="450.0" class="s" text-anchor="middle">予約 10</text>
  <rect x="612" y="428" width="52" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="638.0" y="450.0" class="s" text-anchor="middle">時刻</text>
  <rect x="664" y="428" width="52" height="34" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.1"/>
  <text x="690.0" y="450.0" class="s" text-anchor="middle">日付</text>
  <rect x="716" y="428" width="78" height="34" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="755.0" y="450.0" class="s" text-anchor="middle">クラスタ</text>
  <rect x="794" y="428" width="104" height="34" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.1"/>
  <text x="846.0" y="450.0" class="s" text-anchor="middle">長さ 4</text>
  <text x="40" y="490" class="m">FAT は 12 ビット。例：F4 00 00 03 40 00 F0 0F 00 は、クラスタ 2 → 3 → 4 → 終わり（FF0h）</text>
  <text x="40" y="516" class="s">削除したファイルは名前の先頭が E5h。書込み禁止の属性は 21h</text>
</svg>
