<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="t d">
  <title id="t">機械語エリアの確保</title>
  <desc id="d">POKE と CALL で作業領域を下へずらし、BEC00h から BFBFFh を機械語エリアにする前後の RAM の配置。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="499" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">機械語エリアの確保</text>
  <text x="24" y="55" class="sub">確保しないで B0000h 付近へ置くと BASIC と衝突する（比率は実際と異なる）</text>
  <text x="140" y="88" class="b" text-anchor="middle">確保前</text>
  <rect x="70" y="98" width="150" height="70" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="145.0" y="129.5" class="b" text-anchor="middle">BASIC</text>
  <text x="145.0" y="146.5" class="s" text-anchor="middle">プログラム・変数</text>
  <text x="64" y="110" class="ms" xml:space="preserve" text-anchor="end">B0000h</text>
  <rect x="70" y="168" width="150" height="120" rx="0" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2"/>
  <text x="145.0" y="233.0" class="s" text-anchor="middle">空き</text>
  <rect x="70" y="288" width="150" height="70" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="145.0" y="319.5" class="b" text-anchor="middle">作業領域</text>
  <text x="145.0" y="336.5" class="s" text-anchor="middle">スタックなど</text>
  <rect x="70" y="358" width="150" height="50" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="145.0" y="388.0" class="b" text-anchor="middle">システム領域</text>
  <text x="64" y="370" class="ms" xml:space="preserve" text-anchor="end">BFC00h</text>
  <text x="70" y="428" class="ms" xml:space="preserve">[BFD1Ah] = 0BFC00h</text>
  <text x="70" y="446" class="s">機械語エリアの大きさは 0</text>
  <text x="810" y="88" class="b" text-anchor="middle">確保後（1000h バイト）</text>
  <rect x="740" y="98" width="150" height="70" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="815.0" y="129.5" class="b" text-anchor="middle">BASIC</text>
  <text x="815.0" y="146.5" class="s" text-anchor="middle">プログラム・変数</text>
  <text x="734" y="110" class="ms" xml:space="preserve" text-anchor="end">B0000h</text>
  <rect x="740" y="168" width="150" height="40" rx="0" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2"/>
  <text x="815.0" y="193.0" class="s" text-anchor="middle">空き（狭くなる）</text>
  <rect x="740" y="208" width="150" height="70" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="815.0" y="239.5" class="b" text-anchor="middle">作業領域</text>
  <text x="815.0" y="256.5" class="s" text-anchor="middle">低い番地側へ移動</text>
  <rect x="740" y="278" width="150" height="80" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="815.0" y="314.5" class="b" text-anchor="middle">機械語エリア</text>
  <text x="815.0" y="331.5" class="s" text-anchor="middle">BEC00h–BFBFFh</text>
  <text x="734" y="290" class="ms" xml:space="preserve" text-anchor="end">BEC00h</text>
  <rect x="740" y="358" width="150" height="50" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="815.0" y="388.0" class="b" text-anchor="middle">システム領域</text>
  <text x="734" y="370" class="ms" xml:space="preserve" text-anchor="end">BFC00h</text>
  <text x="740" y="428" class="ms" xml:space="preserve">[BFD1Ah] = 0BEC00h</text>
  <text x="740" y="446" class="s">大きさは 1000h（4 KB）</text>
  <rect x="240" y="98" width="420" height="158" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="450.0" y="129.5" class="b" text-anchor="middle">BASIC から 1 行で確保する</text>
  <text x="450.0" y="150.5" class="ms" xml:space="preserve" text-anchor="middle">POKE &amp;HBFE03,&amp;H1A,&amp;HFD,&amp;H0B,&amp;H00,&amp;H10,&amp;H00:CALL &amp;HFFFD8</text>
  <text x="450.0" y="171.5" text-anchor="middle"></text>
  <text x="450.0" y="192.5" class="m" xml:space="preserve" text-anchor="middle">1A FD 0B  → 0BFD1Ah 機械語エリアのポインタ</text>
  <text x="450.0" y="213.5" class="m" xml:space="preserve" text-anchor="middle">00 10 00  → 001000h 大きさ（4096 バイト）</text>
  <text x="450.0" y="234.5" class="m" xml:space="preserve" text-anchor="middle">FFFD8h   → IOCS device 8 / cmd 42h を実行</text>
  <polyline points="660,180 736,180" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <text x="696" y="172" class="lbl" text-anchor="middle">実行</text>
  <rect x="240" y="276" width="420" height="92" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="450.0" y="297.0" class="b" text-anchor="middle">実行後</text>
  <text x="450.0" y="317.0" text-anchor="middle">メインメニューに戻るので BASIC キーで戻る</text>
  <text x="450.0" y="337.0" class="m" xml:space="preserve" text-anchor="middle">PRINT PEEK &amp;HBFD1A,PEEK &amp;HBFD1B,PEEK &amp;HBFD1C</text>
  <text x="450.0" y="357.0" class="m" xml:space="preserve" text-anchor="middle">→ 0 236 11 = 0BEC00h</text>
  <rect x="240" y="388" width="420" height="74" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="450.0" y="410.0" class="b" text-anchor="middle">確保の持続</text>
  <text x="450.0" y="430.0" text-anchor="middle">RAM が保持される限り残る</text>
  <text x="450.0" y="450.0" text-anchor="middle">オールリセットで消える。重要なプログラムは先に保存</text>
  <text x="24" y="482" class="sub">全 11 本の ROM をエミュレータで確認。実機では PC-E650 で使われている手順。</text>
</svg>
