<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="t d">
  <title id="t">機械語の開発フロー</title>
  <desc id="d">ASM から LOAD M 用のファイルを作って実機で動かす往路と、SAVE M したファイルを逆アセンブルする復路。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="419" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">機械語の流れ</text>
  <text x="24" y="55" class="sub">往路はそのまま実機で動かすまで、復路は実機の機械語を読むまで</text>
  <text x="24" y="88" class="b">往路 — PC で書いて実機で動かす</text>
  <rect x="20" y="100" width="170" height="112" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="105.0" y="143.0" class="b" xml:space="preserve" text-anchor="middle">hello.asm</text>
  <text x="105.0" y="161.0" class="s" xml:space="preserve" text-anchor="middle">ORG に置くアドレスを書く</text>
  <text x="105.0" y="179.0" class="s" xml:space="preserve" text-anchor="middle">VS Code で診断</text>
  <rect x="215" y="100" width="170" height="112" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="300.0" y="134.0" class="b" xml:space="preserve" text-anchor="middle">BIN を作成（VS Code）</text>
  <text x="300.0" y="152.0" class="m" xml:space="preserve" text-anchor="middle">e500 bin</text>
  <text x="300.0" y="170.0" class="m" xml:space="preserve" text-anchor="middle">e500asm -f ce140f</text>
  <text x="300.0" y="188.0" class="s" xml:space="preserve" text-anchor="middle">どれでも同じファイル</text>
  <polyline points="190,156.0 215,156.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <rect x="410" y="100" width="170" height="112" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="495.0" y="143.0" class="b" xml:space="preserve" text-anchor="middle">HELLO.BIN</text>
  <text x="495.0" y="161.0" class="s" xml:space="preserve" text-anchor="middle">16 バイトのヘッダー</text>
  <text x="495.0" y="179.0" class="s" xml:space="preserve" text-anchor="middle">＋ 機械語 46 バイト</text>
  <polyline points="385,156.0 410,156.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <rect x="605" y="100" width="170" height="112" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="690.0" y="152.0" class="b" xml:space="preserve" text-anchor="middle">CE-140F の X:</text>
  <text x="690.0" y="170.0" class="s" xml:space="preserve" text-anchor="middle">互換機の SD カード</text>
  <polyline points="580,156.0 605,156.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <rect x="800" y="100" width="160" height="112" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="880.0" y="143.0" class="b" xml:space="preserve" text-anchor="middle">実機</text>
  <text x="880.0" y="161.0" class="ms" xml:space="preserve" text-anchor="middle">LOAD M "X:HELLO.BIN"</text>
  <text x="880.0" y="179.0" class="ms" xml:space="preserve" text-anchor="middle">CALL &amp;HBEC00</text>
  <polyline points="775,156.0 800,156.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <text x="24" y="250" class="b">復路 — 実機の機械語を読む</text>
  <rect x="20" y="262" width="170" height="112" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="105.0" y="305.0" class="b" xml:space="preserve" text-anchor="middle">実機</text>
  <text x="105.0" y="323.0" class="ms" xml:space="preserve" text-anchor="middle">SAVE M "X:CODE.BIN",</text>
  <text x="105.0" y="341.0" class="ms" xml:space="preserve" text-anchor="middle">  &amp;HBEC00,&amp;HBEC2D</text>
  <rect x="215" y="262" width="170" height="112" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="300.0" y="314.0" class="b" xml:space="preserve" text-anchor="middle">CODE.BIN</text>
  <text x="300.0" y="332.0" class="s" xml:space="preserve" text-anchor="middle">PC へコピー</text>
  <polyline points="190,318.0 215,318.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <rect x="410" y="262" width="170" height="112" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="495.0" y="305.0" class="b" xml:space="preserve" text-anchor="middle">e500dasm -f ce140f</text>
  <text x="495.0" y="323.0" class="m" xml:space="preserve" text-anchor="middle">e500 dis</text>
  <text x="495.0" y="341.0" class="s" xml:space="preserve" text-anchor="middle">アドレスはヘッダーから</text>
  <polyline points="385,318.0 410,318.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <rect x="605" y="262" width="170" height="112" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="690.0" y="314.0" class="b" xml:space="preserve" text-anchor="middle">code.asm</text>
  <text x="690.0" y="332.0" class="s" xml:space="preserve" text-anchor="middle">読んで直せるソース</text>
  <polyline points="580,318.0 605,318.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <rect x="800" y="262" width="160" height="112" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="880.0" y="305.0" class="b" xml:space="preserve" text-anchor="middle">e500asm</text>
  <text x="880.0" y="323.0" class="m" xml:space="preserve" text-anchor="middle">-f ce140f</text>
  <text x="880.0" y="341.0" class="s" xml:space="preserve" text-anchor="middle">元と同じファイルに戻る</text>
  <polyline points="775,318.0 800,318.0" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <rect x="24" y="390" width="14" height="14" rx="3" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="44" y="401" class="s">ツール</text>
  <rect x="120" y="390" width="14" height="14" rx="3" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="140" y="401" class="s">ファイル</text>
  <rect x="230" y="390" width="14" height="14" rx="3" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="250" y="401" class="s">実機</text>
</svg>
