  <text x="441" y="113" class="m" xml:space="preserve" text-anchor="middle">1D</text>
  <rect x="462" y="92" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="483" y="113" class="m" xml:space="preserve" text-anchor="middle">00</text>
  <rect x="504" y="92" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="525" y="113" class="m" xml:space="preserve" text-anchor="middle">00</text>
  <rect x="546" y="92" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
