  <rect x="462" y="154" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="483" y="175" class="m" xml:space="preserve" text-anchor="middle">2B</text>
  <rect x="504" y="154" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="525" y="175" class="m" xml:space="preserve" text-anchor="middle">49</text>
  <rect x="546" y="154" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="567" y="175" class="m" xml:space="preserve" text-anchor="middle">0D</text>
  <text x="24" y="238" class="m" xml:space="preserve">40 NEXT I</text>
  <text x="130" y="238" class="m" xml:space="preserve">BF174h</text>
  <rect x="210" y="216" width="42" height="32" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="231" y="237" class="m" xml:space="preserve" text-anchor="middle">00</text>
  <rect x="252" y="216" width="42" height="32" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="273" y="237" class="m" xml:space="preserve" text-anchor="middle">28</text>
  <rect x="294" y="216" width="42" height="32" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="315" y="237" class="m" xml:space="preserve" text-anchor="middle">04</text>
  <rect x="336" y="216" width="42" height="32" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="357" y="237" class="m" xml:space="preserve" text-anchor="middle">FE</text>
  <rect x="378" y="216" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="399" y="237" class="m" xml:space="preserve" text-anchor="middle">5B</text>
  <rect x="420" y="216" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="441" y="237" class="m" xml:space="preserve" text-anchor="middle">49</text>
  <rect x="462" y="216" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="1"/>
  <text x="483" y="237" class="m" xml:space="preserve" text-anchor="middle">0D</text>
  <text x="252" y="84" class="s" text-anchor="middle">行番号</text>
  <text x="315" y="84" class="s" text-anchor="middle">長さ</text>
  <text x="380" y="84" class="s">最初の中間コード（ウォッチ）</text>
  <text x="24" y="290" class="m" xml:space="preserve">監視するアドレス（first）= 行の先頭 + 3 → BF145h、BF16Eh、BF177h</text>
  <rect x="24" y="306" width="290" height="72" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="169" y="329" class="b" text-anchor="middle">1. RUN の最初の行で学ぶ</text>
  <text x="169" y="347" class="s" text-anchor="middle">BF145h が読まれた直後の P</text>
  <text x="169" y="365" class="s" text-anchor="middle">= F5EDAh（ROM 7.2 の例）</text>
  <rect x="344" y="306" width="290" height="72" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="489" y="329" class="b" text-anchor="middle">2. 以後は after = F5EDAh</text>
  <text x="489" y="347" class="s" text-anchor="middle">命令の後の P がそこになる</text>
  <text x="489" y="365" class="s" text-anchor="middle">読み出しだけで止まる</text>
  <rect x="664" y="306" width="292" height="72" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="810" y="329" class="b" text-anchor="middle">3. READ、LIST は素通り</text>
  <text x="810" y="347" class="s" text-anchor="middle">同じバイトを読んでも、</text>
  <text x="810" y="365" class="s" text-anchor="middle">読んだ後の P が違う</text>
  <path d="M314 342L344 342" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M634 342L664 342" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="24" y="402" class="s">バイト列とアドレスは、ROM 7.2（内蔵 RAM 32 KB）に 5 行のプログラムを LOAD したときの実際の値。</text>
