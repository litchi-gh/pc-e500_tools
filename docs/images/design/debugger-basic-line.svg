  <text x="777" y="113" class="m" xml:space="preserve" text-anchor="middle">0D</text>
  <text x="24" y="176" class="m" xml:space="preserve">30 A=A+I</text>
  <text x="130" y="176" class="m" xml:space="preserve">BF16Bh</text>
  <rect x="210" y="154" width="42" height="32" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="231" y="175" class="m" xml:space="preserve" text-anchor="middle">00</text>
  <rect x="252" y="154" width="42" height="32" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="273" y="175" class="m" xml:space="preserve" text-anchor="middle">1E</text>
  <rect x="294" y="154" width="42" height="32" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="315" y="175" class="m" xml:space="preserve" text-anchor="middle">06</text>
  <rect x="336" y="154" width="42" height="32" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
