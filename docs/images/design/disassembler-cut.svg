  <text x="789" y="92" class="ms" xml:space="preserve" text-anchor="middle">10</text>
  <text x="835" y="92" class="ms" xml:space="preserve" text-anchor="middle">11</text>
  <text x="881" y="92" class="ms" xml:space="preserve" text-anchor="middle">12</text>
