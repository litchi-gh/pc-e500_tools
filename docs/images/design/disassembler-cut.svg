  <path d="M352 134L352 250" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="352" y="264" class="m" xml:space="preserve" text-anchor="middle">DB $FD,$01</text>
  <text x="352" y="281" class="s" text-anchor="middle">同じ形に戻らない</text>
  <rect x="398" y="98" width="46" height="34" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
