  <text x="421" y="172" class="m" xml:space="preserve" text-anchor="middle">DB $20</text>
  <text x="421" y="189" class="s" text-anchor="middle">予約</text>
  <rect x="444" y="98" width="46" height="34" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="467" y="120" class="m" xml:space="preserve" text-anchor="middle">32</text>
  <path d="M467 134L467 204" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="467" y="218" class="m" xml:space="preserve" text-anchor="middle">PRE $32</text>
  <text x="467" y="235" class="s" text-anchor="middle">単独</text>
  <rect x="490" y="98" width="46" height="34" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="513" y="120" class="m" xml:space="preserve" text-anchor="middle">00</text>
  <path d="M513 134L513 250" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="513" y="264" class="m" xml:space="preserve" text-anchor="middle">NOP</text>
  <rect x="536" y="98" width="46" height="34" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="559" y="120" class="m" xml:space="preserve" text-anchor="middle">34</text>
  <path d="M559 134L559 158" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="559" y="172" class="m" xml:space="preserve" text-anchor="middle">PRE $34</text>
  <text x="559" y="189" class="s" text-anchor="middle">単独</text>
  <rect x="582" y="98" width="46" height="34" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="605" y="120" class="m" xml:space="preserve" text-anchor="middle">08</text>
  <rect x="628" y="98" width="46" height="34" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="651" y="120" class="m" xml:space="preserve" text-anchor="middle">80</text>
  <path d="M628 134L628 204" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="628" y="218" class="m" xml:space="preserve" text-anchor="middle">MV A,$80</text>
  <rect x="674" y="98" width="46" height="34" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="697" y="120" class="m" xml:space="preserve" text-anchor="middle">05</text>
  <rect x="720" y="98" width="46" height="34" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="743" y="120" class="m" xml:space="preserve" text-anchor="middle">90</text>
  <rect x="766" y="98" width="46" height="34" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="789" y="120" class="m" xml:space="preserve" text-anchor="middle">84</text>
  <rect x="812" y="98" width="46" height="34" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="835" y="120" class="m" xml:space="preserve" text-anchor="middle">02</text>
  <path d="M766 134L766 250" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="766" y="264" class="m" xml:space="preserve" text-anchor="middle">CALLF $28490</text>
  <text x="766" y="281" class="s" text-anchor="middle">遠い呼び出し</text>
  <rect x="858" y="98" width="46" height="34" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="881" y="120" class="m" xml:space="preserve" text-anchor="middle">03</text>
  <rect x="904" y="98" width="46" height="34" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="927" y="120" class="m" xml:space="preserve" text-anchor="middle">12</text>
  <path d="M904 134L904 158" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="950" y="172" class="m" xml:space="preserve" text-anchor="end">DB $03,$12</text>
  <text x="950" y="189" class="s" text-anchor="end">途切れ</text>
  <text x="30" y="306" class="s">緑: 命令として出した行。紫: 命令とまとめられない PRE。</text>
  <text x="30" y="325" class="s">黄: 意味は読めるが、アセンブラが同じバイトを作らないので DB。赤: 命令ではないもの。</text>
