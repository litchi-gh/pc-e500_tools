  <text x="283" y="120" class="m" xml:space="preserve" text-anchor="middle">03</text>
  <path d="M260 134L260 204" fill="none" stroke="#B8C2CC" stroke-width="1"/>
  <text x="260" y="218" class="m" xml:space="preserve" text-anchor="middle">JRZ LB8009</text>
  <text x="260" y="235" class="s" text-anchor="middle">分岐</text>
  <rect x="306" y="98" width="46" height="34" rx="2" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
