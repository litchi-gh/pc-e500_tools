<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 412" width="980" height="412" role="img" aria-labelledby="t d">
  <title id="t">パスごとの配置（例）</title>
  <desc id="d">p.asm を 4 回のパスでアセンブルしたときのアドレスとシンボルの値</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="411" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">パスごとの配置（例）</text>
  <text x="24" y="55" class="sub">後ろで決まる ORG と DS。アドレスが前のパスと同じになるまで繰り返す</text>
  <rect x="24" y="74" width="220" height="46" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="134" y="102" class="b" text-anchor="middle">ソース</text>
  <rect x="252" y="74" width="170" height="46" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="337" y="93.5" class="b" text-anchor="middle">パス 1（緩い）</text>
  <text x="337" y="110.5" class="s" text-anchor="middle">未定義は 0</text>
  <rect x="430" y="74" width="170" height="46" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="515" y="93.5" class="b" text-anchor="middle">パス 2（緩い）</text>
  <text x="515" y="110.5" class="s" text-anchor="middle">値が入った</text>
  <rect x="608" y="74" width="170" height="46" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="693" y="93.5" class="b" text-anchor="middle">パス 3（緩い）</text>
  <text x="693" y="110.5" class="s" text-anchor="middle">2 と同じ = 収束</text>
  <rect x="786" y="74" width="170" height="46" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="871" y="93.5" class="b" text-anchor="middle">パス 4（厳密）</text>
  <text x="871" y="110.5" class="s" text-anchor="middle">エラーを確定</text>
  <rect x="24" y="128" width="932" height="28" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="0.5"/>
  <text x="34" y="147" class="m" xml:space="preserve">        ORG   base</text>
  <text x="337" y="147" class="m" xml:space="preserve" text-anchor="middle" style="fill:#C0392B">00000</text>
  <text x="515" y="147" class="m" xml:space="preserve" text-anchor="middle">BE000</text>
  <text x="693" y="147" class="m" xml:space="preserve" text-anchor="middle">BE000</text>
  <text x="871" y="147" class="m" xml:space="preserve" text-anchor="middle">BE000</text>
  <rect x="24" y="158" width="932" height="28" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="0.5"/>
  <text x="34" y="177" class="m" xml:space="preserve">start:  JR    next</text>
  <text x="337" y="177" class="m" xml:space="preserve" text-anchor="middle" style="fill:#C0392B">00000</text>
  <text x="515" y="177" class="m" xml:space="preserve" text-anchor="middle">BE000</text>
  <text x="693" y="177" class="m" xml:space="preserve" text-anchor="middle">BE000</text>
  <text x="871" y="177" class="m" xml:space="preserve" text-anchor="middle">BE000</text>
  <rect x="24" y="188" width="932" height="28" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="0.5"/>
  <text x="34" y="207" class="m" xml:space="preserve">        DS    size</text>
  <text x="337" y="207" class="m" xml:space="preserve" text-anchor="middle" style="fill:#C0392B">00002</text>
  <text x="515" y="207" class="m" xml:space="preserve" text-anchor="middle">BE002</text>
  <text x="693" y="207" class="m" xml:space="preserve" text-anchor="middle">BE002</text>
  <text x="871" y="207" class="m" xml:space="preserve" text-anchor="middle">BE002</text>
  <rect x="24" y="218" width="932" height="28" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="0.5"/>
  <text x="34" y="237" class="m" xml:space="preserve">next:   RETF</text>
  <text x="337" y="237" class="m" xml:space="preserve" text-anchor="middle" style="fill:#C0392B">00002</text>
  <text x="515" y="237" class="m" xml:space="preserve" text-anchor="middle">BE003</text>
  <text x="693" y="237" class="m" xml:space="preserve" text-anchor="middle">BE003</text>
  <text x="871" y="237" class="m" xml:space="preserve" text-anchor="middle">BE003</text>
  <rect x="24" y="248" width="932" height="28" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="0.5"/>
  <text x="34" y="267" class="m" xml:space="preserve">tail:</text>
  <text x="337" y="267" class="m" xml:space="preserve" text-anchor="middle" style="fill:#C0392B">00003</text>
  <text x="515" y="267" class="m" xml:space="preserve" text-anchor="middle">BE004</text>
  <text x="693" y="267" class="m" xml:space="preserve" text-anchor="middle">BE004</text>
  <text x="871" y="267" class="m" xml:space="preserve" text-anchor="middle">BE004</text>
  <rect x="24" y="278" width="932" height="28" rx="2" fill="#FFFFFF" stroke="#7B8794" stroke-width="0.5"/>
  <text x="34" y="297" class="m" xml:space="preserve">size    EQU   tail-next</text>
  <text x="337" y="297" class="m" xml:space="preserve" text-anchor="middle">= 1</text>
  <text x="515" y="297" class="m" xml:space="preserve" text-anchor="middle">= 1</text>
  <text x="693" y="297" class="m" xml:space="preserve" text-anchor="middle">= 1</text>
  <text x="871" y="297" class="m" xml:space="preserve" text-anchor="middle">= 1</text>
  <rect x="24" y="308" width="932" height="28" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="0.5"/>
  <text x="34" y="327" class="m" xml:space="preserve">base    EQU   $BE000</text>
  <text x="337" y="327" class="m" xml:space="preserve" text-anchor="middle">= BE000h</text>
  <text x="515" y="327" class="m" xml:space="preserve" text-anchor="middle">= BE000h</text>
  <text x="693" y="327" class="m" xml:space="preserve" text-anchor="middle">= BE000h</text>
  <text x="871" y="327" class="m" xml:space="preserve" text-anchor="middle">= BE000h</text>
  <text x="24" y="364" class="s">パス 1 では base も size も未定義なので、ORG 0、DS 0 として進みます。終わりに base = BE000h、size = 3 − 2 = 1 が分かり、パス 2 で使われます。</text>
  <text x="24" y="386" class="s">パス 3 の配置とシンボルはパス 2 と同じなので収束です。パス 4 で、未定義、範囲、ASSERT、64 KB の境界を調べ、出力を確定します。</text>
</svg>
