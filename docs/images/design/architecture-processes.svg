<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">プロセスと、信頼の境目</title>
  <desc id="d">VS Code の拡張ホスト、ウェブビュー、e500dbg、e500asm、エミュレータのコアと ROM、開いたフォルダの関係</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">プロセスと、信頼の境目</text>
  <text x="24" y="55" class="sub">何がどのプロセスで動き、何を読むか。破線の枠は、利用者が用意するもの</text>
  <rect x="24" y="76" width="566" height="240" rx="10" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="40" y="98" class="b">VS Code</text>
  <rect x="44" y="112" width="220" height="92" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="154" y="145" class="b" text-anchor="middle">拡張（Node.js）</text>
  <text x="154" y="163" class="s" text-anchor="middle">診断、候補、アセンブル</text>
  <text x="154" y="181" class="s" text-anchor="middle">デバッグアダプター、テスト</text>
  <rect x="370" y="112" width="200" height="92" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="470" y="145" class="b" text-anchor="middle">ウェブビュー</text>
  <text x="470" y="163" class="s" text-anchor="middle">パネル、デバッグ画面、</text>
  <text x="470" y="181" class="s" text-anchor="middle">ドットエディタ、環境の確認</text>
  <path d="M264 158L370 158" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="317" y="148" class="ms" xml:space="preserve" text-anchor="middle">postMessage</text>
  <rect x="272" y="228" width="302" height="76" rx="6" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="284" y="250" class="s">CSP: default-src 'none'、nonce 付きだけ</text>
  <text x="284" y="271" class="s">localResourceRoots は media/ だけ</text>
  <text x="284" y="292" class="s">ページはほかのファイルを読めない</text>
  <path d="M470 204L470 228" fill="none" stroke="#52606D" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="680" y="96" width="276" height="92" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="818" y="129" class="b" text-anchor="middle">e500dbg.exe（別のプロセス）</text>
  <text x="818" y="147" class="s" text-anchor="middle">標準入出力で 1 行 1 JSON</text>
  <text x="818" y="165" class="s" text-anchor="middle">逆アセンブラの Core を含む</text>
  <path d="M154 112L154 84L640 84L640 142L680 142" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="680" y="236" width="130" height="72" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="745" y="268" class="b" text-anchor="middle">e500core.dll</text>
  <text x="745" y="286" class="s" text-anchor="middle">エミュレータ</text>
  <rect x="826" y="236" width="130" height="72" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="891" y="268" class="b" text-anchor="middle">ROM</text>
  <text x="891" y="286" class="s" text-anchor="middle">状態ファイル</text>
  <path d="M745 188L745 236" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M891 188L891 236" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="818" y="217" class="lbl" text-anchor="middle">実行時に読み込む</text>
  <rect x="24" y="366" width="240" height="78" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="144" y="392" class="b" text-anchor="middle">開いたフォルダ</text>
  <text x="144" y="410" class="s" text-anchor="middle">.asm .inc .bas .lcd .spr</text>
  <text x="144" y="428" class="s" text-anchor="middle">*.e500test.json</text>
  <path d="M84 366L84 204" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="92" y="348" class="lbl">読み書きするだけ。中の実行ファイルは自動で使わない</text>
  <rect x="330" y="366" width="250" height="78" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="455" y="392" class="b" text-anchor="middle">e500asm（別のプロセス）</text>
  <text x="455" y="410" class="s" text-anchor="middle">「e500asm でアセンブル」の</text>
  <text x="455" y="428" class="s" text-anchor="middle">ときだけ起動</text>
  <path d="M220 204L220 326L455 326L455 366" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="680" y="366" width="276" height="78" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="818" y="392" class="b" text-anchor="middle">実機、CE-140F の X:</text>
  <text x="818" y="410" class="s" text-anchor="middle">名前.BIN、名前.BAS</text>
  <text x="818" y="428" class="s" text-anchor="middle">e500 bin も同じ形を作る</text>
  <path d="M580 405L680 405" fill="none" stroke="#52606D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
