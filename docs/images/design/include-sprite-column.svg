  <text x="650" y="100" class="s"></text>
  <text x="760" y="170" class="b">上の行 = [Y]</text>
  <text x="760" y="192" class="m" xml:space="preserve">FFh → 2Fh</text>
  <text x="760" y="324" class="b">下の行 = [Y+240]</text>
  <text x="760" y="346" class="m" xml:space="preserve">0Fh → 0Dh</text>
  <text x="760" y="226" class="ms" xml:space="preserve">OR A,マスク</text>
  <text x="760" y="244" class="ms" xml:space="preserve">XOR A,マスク → そこが 0</text>
  <text x="760" y="262" class="ms" xml:space="preserve">OR A,絵</text>
  <rect x="200" y="280" width="170" height="96" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="285" y="303" class="b" text-anchor="middle">エントリ = shift7 + 2×(7−n)</text>
  <text x="285" y="323" class="s" text-anchor="middle">先頭から飛び込むと 7 回</text>
  <text x="285" y="343" class="s" text-anchor="middle">n = 3 なら</text>
  <text x="285" y="363" class="s" text-anchor="middle">8 バイト先 → 3 回</text>
  <path d="M285 280L285 230" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="24" y="446" class="s">例: y = 3（y AND 7 = 3）、画面の前の値は FFh と 0Fh。マスクが 1 の所だけが、絵の値に置き換わる。</text>
