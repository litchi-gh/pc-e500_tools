  <rect x="140.5" y="272" width="58.25" height="44" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="0.8"/>
  <text x="169.625" y="299" class="m" xml:space="preserve" text-anchor="middle">A2</text>
  <rect x="198.75" y="272" width="58.25" height="44" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="0.8"/>
  <text x="227.875" y="299" class="m" xml:space="preserve" text-anchor="middle">A3</text>
  <rect x="257" y="272" width="58.25" height="44" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="0.8"/>
  <text x="286.125" y="299" class="m" xml:space="preserve" text-anchor="middle">A4</text>
  <rect x="315.25" y="272" width="58.25" height="44" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="0.8"/>
  <text x="344.375" y="299" class="m" xml:space="preserve" text-anchor="middle">A5</text>
  <rect x="373.5" y="272" width="58.25" height="44" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="0.8"/>
  <text x="402.625" y="299" class="m" xml:space="preserve" text-anchor="middle">A6</text>
  <rect x="431.75" y="272" width="58.25" height="44" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="0.8"/>
  <text x="460.875" y="299" class="m" xml:space="preserve" text-anchor="middle">A7</text>
  <rect x="490" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="519.125" y="299" class="m" xml:space="preserve" text-anchor="middle">B0</text>
  <rect x="548.25" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="577.375" y="299" class="m" xml:space="preserve" text-anchor="middle">B1</text>
  <rect x="606.5" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="635.625" y="299" class="m" xml:space="preserve" text-anchor="middle">B2</text>
  <rect x="664.75" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="693.875" y="299" class="m" xml:space="preserve" text-anchor="middle">B3</text>
  <rect x="723" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="752.125" y="299" class="m" xml:space="preserve" text-anchor="middle">B4</text>
  <rect x="781.25" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="810.375" y="299" class="m" xml:space="preserve" text-anchor="middle">B5</text>
  <rect x="839.5" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="868.625" y="299" class="m" xml:space="preserve" text-anchor="middle">B6</text>
  <rect x="897.75" y="272" width="58.25" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.8"/>
  <text x="926.875" y="299" class="m" xml:space="preserve" text-anchor="middle">B7</text>
  <text x="24" y="332" class="ms" xml:space="preserve" text-anchor="start">+000h</text>
  <text x="257" y="332" class="ms" xml:space="preserve" text-anchor="middle">+100h</text>
  <text x="490" y="332" class="ms" xml:space="preserve" text-anchor="middle">+200h</text>
  <text x="723" y="332" class="ms" xml:space="preserve" text-anchor="middle">+300h</text>
  <text x="956" y="332" class="ms" xml:space="preserve" text-anchor="end">+400h</text>
  <text x="24" y="356" class="s">コントローラ A（0 番）のページ 0–7 が先、B（1 番）が後。1 つの枠が 1 ページ = 64 桁 = 64 バイト。A で画面の点になるのは桁 0–55 だけ。</text>
  <text x="24" y="390" class="b">点</text>
  <text x="70" y="390" class="b">(x, y)</text>
  <text x="190" y="390" class="b">コントローラ</text>
  <text x="310" y="390" class="b">ページ</text>
  <text x="390" y="390" class="b">桁</text>
  <text x="460" y="390" class="b">ビット</text>
  <text x="540" y="390" class="b">オフセット</text>
  <text x="660" y="390" class="b">計算</text>
  <text x="24" y="414">①</text>
  <text x="70" y="414" class="m" xml:space="preserve">(70, 10)</text>
  <text x="190" y="414" class="m" xml:space="preserve">A</text>
  <text x="310" y="414" class="m" xml:space="preserve">1</text>
  <text x="390" y="414" class="m" xml:space="preserve">6</text>
  <text x="460" y="414" class="m" xml:space="preserve">2</text>
  <text x="540" y="414" class="m" xml:space="preserve">+046h</text>
  <text x="660" y="414" class="m" xml:space="preserve">1 × 64 + 6 = 70</text>
  <text x="24" y="436">②</text>
  <text x="70" y="436" class="m" xml:space="preserve">(130, 20)</text>
  <text x="190" y="436" class="m" xml:space="preserve">A</text>
  <text x="310" y="436" class="m" xml:space="preserve">6</text>
  <text x="390" y="436" class="m" xml:space="preserve">45</text>
  <text x="460" y="436" class="m" xml:space="preserve">4</text>
  <text x="540" y="436" class="m" xml:space="preserve">+1ADh</text>
  <text x="660" y="436" class="m" xml:space="preserve">6 × 64 + 45 = 429</text>
  <text x="24" y="458">③</text>
  <text x="70" y="458" class="m" xml:space="preserve">(200, 9)</text>
  <text x="190" y="458" class="m" xml:space="preserve">B</text>
  <text x="310" y="458" class="m" xml:space="preserve">5</text>
  <text x="390" y="458" class="m" xml:space="preserve">39</text>
  <text x="460" y="458" class="m" xml:space="preserve">1</text>
  <text x="540" y="458" class="m" xml:space="preserve">+367h</text>
  <text x="660" y="458" class="m" xml:space="preserve">512 + 5 × 64 + 39 = 871</text>
</svg>
