  <text x="485" y="62" class="s" text-anchor="middle" xml:space="preserve">10</text>
  <rect x="508" y="70" width="42" height="40" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="529" y="95" class="m" text-anchor="middle" xml:space="preserve">FF</text>
  <text x="529" y="62" class="s" text-anchor="middle" xml:space="preserve">11</text>
  <rect x="552" y="70" width="42" height="40" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="573" y="95" class="m" text-anchor="middle" xml:space="preserve">FF</text>
  <text x="573" y="62" class="s" text-anchor="middle" xml:space="preserve">12</text>
  <rect x="596" y="70" width="42" height="40" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="617" y="95" class="m" text-anchor="middle" xml:space="preserve">FF</text>
  <text x="617" y="62" class="s" text-anchor="middle" xml:space="preserve">13</text>
  <rect x="640" y="70" width="42" height="40" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="661" y="95" class="m" text-anchor="middle" xml:space="preserve">00</text>
  <text x="661" y="62" class="s" text-anchor="middle" xml:space="preserve">14</text>
  <rect x="684" y="70" width="42" height="40" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="705" y="95" class="m" text-anchor="middle" xml:space="preserve">0F</text>
  <text x="705" y="62" class="s" text-anchor="middle" xml:space="preserve">15</text>
  <rect x="728" y="70" width="224" height="40" rx="4" fill="#E6F6EC" stroke="#2F855A"/>
  <text x="840" y="95" class="m" text-anchor="middle" xml:space="preserve">30 CC D6 00 …</text>
  <path d="M24,118 L24,126 L242,126 L242,118" fill="none" stroke="#7B8794" stroke-width="1.6"/>
  <text x="133.0" y="146" class="" text-anchor="middle" xml:space="preserve">固定</text>
  <text x="133.0" y="166" class="s" text-anchor="middle" xml:space="preserve">機械語のしるし</text>
  <path d="M244,118 L244,126 L374,126 L374,118" fill="none" stroke="#7B8794" stroke-width="1.6"/>
  <text x="309.0" y="146" class="" text-anchor="middle" xml:space="preserve">長さ（下位から）</text>
  <text x="309.0" y="166" class="s" text-anchor="middle" xml:space="preserve">00002Eh = 46 バイト</text>
  <path d="M376,118 L376,126 L506,126 L506,118" fill="none" stroke="#7B8794" stroke-width="1.6"/>
  <text x="441.0" y="146" class="" text-anchor="middle" xml:space="preserve">アドレス（下位から）</text>
  <text x="441.0" y="166" class="s" text-anchor="middle" xml:space="preserve">0BEC00h</text>
  <path d="M508,118 L508,126 L726,126 L726,118" fill="none" stroke="#7B8794" stroke-width="1.6"/>
  <text x="617.0" y="146" class="" text-anchor="middle" xml:space="preserve">固定</text>
  <text x="617.0" y="166" class="s" text-anchor="middle" xml:space="preserve"></text>
  <text x="840" y="146" class="" text-anchor="middle" xml:space="preserve">機械語 46 バイト</text>
  <text x="840" y="166" class="s" text-anchor="middle" xml:space="preserve">ソースの ORG から</text>
  <rect x="24" y="186" width="928" height="44" rx="6" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="40" y="213" class="" text-anchor="start" xml:space="preserve">LOAD M "X:HELLO.BIN" は、ヘッダーを読んで、機械語だけを BEC00h から順に書き込みます。CALL &amp;HBEC00 で始まります。</text>
</svg>
