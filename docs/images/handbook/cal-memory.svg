<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">メモリ計算</title>
  <desc id="d">X→M、M+、RM のキーと、STO、RCL の 26 個のメモリの関係。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .xs { font-size: 11px; fill: #52606D; }
    .r { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #B7791F; font-weight: 700; }
    .j { font-size: 10px; fill: #B7791F; font-weight: 700; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lcd { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 700; fill: #24351D; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B8794"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">メモリ計算</text>
  <rect x="24" y="60" width="300" height="390" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="174" y="88" class="b" text-anchor="middle">独立メモリ M（1 個）</text>
  <text x="174" y="108" class="s" text-anchor="middle">M が点灯</text>
  <rect x="656" y="60" width="300" height="390" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="806" y="88" class="b" text-anchor="middle">A〜Z（26 個）</text>
  <text x="806" y="108" class="s" text-anchor="middle">BASIC の変数 A〜Z と共通</text>
  <rect x="360" y="60" width="260" height="390" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="490" y="88" class="b" text-anchor="middle">表示している数</text>
  <rect x="390" y="104" width="200" height="30" rx="4" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="580" y="124" class="lcd" xml:space="preserve" text-anchor="end">12.5</text>
  <rect x="220" y="170" width="74" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="257.0" y="188.0" class="m" xml:space="preserve" text-anchor="middle">X→M</text>
  <text x="40" y="164" class="s">書き込む（前の値は消える）</text>
  <line x1="356" y1="184" x2="298" y2="184" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="220" y="240" width="74" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="257.0" y="258.0" class="m" xml:space="preserve" text-anchor="middle">M+</text>
  <text x="40" y="234" class="s">加算</text>
  <line x1="356" y1="254" x2="298" y2="254" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="220" y="310" width="74" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="257.0" y="328.0" class="m" xml:space="preserve" text-anchor="middle">RM</text>
  <text x="40" y="304" class="s">呼び出す</text>
  <line x1="298" y1="324" x2="356" y2="324" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="40" y="374" class="s">0 を書き込むと空になる（C·CE → X→M）</text>
  <text x="40" y="398" class="s">減算は +/− → M+</text>
  <text x="40" y="422" class="s">電源を切っても保持</text>
  <rect x="690" y="190" width="74" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="727.0" y="208.0" class="m" xml:space="preserve" text-anchor="middle">STO A</text>
  <text x="690" y="184" class="s">保存</text>
  <line x1="624" y1="204" x2="684" y2="204" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="690" y="280" width="74" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="727.0" y="298.0" class="m" xml:space="preserve" text-anchor="middle">RCL A</text>
  <text x="690" y="274" class="s">呼び出す</text>
  <line x1="684" y1="294" x2="624" y2="294" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="672" y="346" class="s">RUN モードの A ⏎ と同じ値</text>
  <text x="672" y="370" class="s">変数 M と独立メモリ M は</text>
  <text x="672" y="390" class="s">別のもの</text>
  <text x="672" y="414" class="s">電源を切っても保持</text>
</svg>
