  <rect x="82" y="260" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="97.0" y="278.0" class="m" xml:space="preserve" text-anchor="middle">π</text>
