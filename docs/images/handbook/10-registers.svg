<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">行列の種類</title>
  <desc id="d">行列 X、Y、M、MA から MZ と、それらを動かすキーの図</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606D"/></marker></defs>

  <rect width="980" height="330" fill="#FFFFFF"/>
  <rect x="390.0" y="100.0" width="200.0" height="90.0" rx="4" fill="#E6F6EC" stroke="#2F855A"/>
  <text x="490.0" y="138.0" class="h" text-anchor="middle" xml:space="preserve">X</text>
  <text x="490.0" y="166.0" class="s" text-anchor="middle" xml:space="preserve">計算する行列。答えもここ</text>
  <rect x="90.0" y="100.0" width="200.0" height="90.0" rx="4" fill="#E8F1FC" stroke="#2F6DB5"/>
  <text x="190.0" y="138.0" class="h" text-anchor="middle" xml:space="preserve">Y</text>
  <text x="190.0" y="166.0" class="s" text-anchor="middle" xml:space="preserve">相手の行列</text>
  <rect x="690.0" y="30.0" width="200.0" height="90.0" rx="4" fill="#F1ECFB" stroke="#6B4FBB"/>
  <text x="790.0" y="68.0" class="h" text-anchor="middle" xml:space="preserve">M</text>
  <text x="790.0" y="96.0" class="s" text-anchor="middle" xml:space="preserve">メモリ</text>
  <rect x="690.0" y="190.0" width="200.0" height="90.0" rx="4" fill="#F1ECFB" stroke="#6B4FBB"/>
  <text x="790.0" y="228.0" class="h" text-anchor="middle" xml:space="preserve">MA〜MZ</text>
  <text x="790.0" y="256.0" class="s" text-anchor="middle" xml:space="preserve">26 個の保存用の行列</text>
  <line x1="290.0" y1="130.0" x2="386.0" y2="130.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="338.0" y="120.0" class="s" text-anchor="middle" xml:space="preserve">+ − × ÷</text>
  <line x1="386.0" y1="162.0" x2="294.0" y2="162.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="294.0" y1="162.0" x2="386.0" y2="162.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="338.0" y="182.0" class="s" text-anchor="middle" xml:space="preserve">↕ 入れ替え</text>
  <line x1="590.0" y1="115.0" x2="686.0" y2="60.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="590.0" y="72.0" class="s" text-anchor="start" xml:space="preserve">X→M、M+</text>
  <line x1="686.0" y1="100.0" x2="594.0" y2="140.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="654.0" y="138.0" class="s" text-anchor="start" xml:space="preserve">RM</text>
  <line x1="590.0" y1="160.0" x2="686.0" y2="215.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="640.0" y="178.0" class="s" text-anchor="start" xml:space="preserve">STO A</text>
  <line x1="686.0" y1="255.0" x2="590.0" y2="184.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="586.0" y="240.0" class="s" text-anchor="start" xml:space="preserve">RCL A</text>
  <rect x="400.0" y="230.0" width="180.0" height="60.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="490.0" y="256.0" class="m" text-anchor="middle" xml:space="preserve">X⁻¹ Xᵗ X² k∗X</text>
  <text x="490.0" y="278.0" class="s" text-anchor="middle" xml:space="preserve">X だけの計算</text>
  <line x1="460.0" y1="228.0" x2="460.0" y2="194.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="520.0" y1="194.0" x2="520.0" y2="228.0" stroke="#52606D" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="30.0" y="318.0" class="s" text-anchor="start" xml:space="preserve">どの行列も、BASIC の同じ名前の配列と同じもの: 画面の X(1,2) は BASIC の X(0,1)。</text>
</svg>
