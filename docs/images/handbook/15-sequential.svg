<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" width="980" height="270" role="img" aria-labelledby="t d">
  <title id="t">シーケンシャルファイルの中身</title>
  <desc id="d">PRINT # で書いた 3 件のデータが文字として一列に並び、INPUT # が読む位置が先頭から順に進む図。</desc>
