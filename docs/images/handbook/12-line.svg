<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="980" height="230" role="img" aria-labelledby="t d">
  <title id="t">プログラムの 1 行</title>
  <desc id="d">行番号、ラベル、命令、式、区切りのコロンを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="229" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">プログラムの 1 行</text>
  <text x="24" y="55" class="sub" xml:space="preserve">100 *AREA:INPUT "R=";R:PRINT R^2*PI  の部品</text>
  <rect x="40" y="90" width="71" height="44" rx="5" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="75.5" y="118" class="mb" text-anchor="middle" xml:space="preserve">100</text>
  <text x="75.5" y="158" class="s" text-anchor="middle" xml:space="preserve">行番号</text>
  <text x="75.5" y="176" class="s" text-anchor="middle" xml:space="preserve">1〜65279</text>
  <rect x="121" y="90" width="101" height="44" rx="5" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="171.5" y="118" class="mb" text-anchor="middle" xml:space="preserve">*AREA</text>
  <text x="171.5" y="158" class="s" text-anchor="middle" xml:space="preserve">ラベル</text>
  <text x="171.5" y="176" class="s" text-anchor="middle" xml:space="preserve">行の呼び名</text>
  <rect x="232" y="90" width="41" height="44" rx="5" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="252.5" y="118" class="mb" text-anchor="middle" xml:space="preserve">:</text>
  <text x="252.5" y="158" class="s" text-anchor="middle" xml:space="preserve">区切り</text>
  <text x="252.5" y="176" class="s" text-anchor="middle" xml:space="preserve"></text>
  <rect x="299" y="90" width="101" height="44" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="349.5" y="118" class="mb" text-anchor="middle" xml:space="preserve">INPUT</text>
  <text x="349.5" y="158" class="s" text-anchor="middle" xml:space="preserve">命令</text>
  <text x="349.5" y="176" class="s" text-anchor="middle" xml:space="preserve"></text>
  <rect x="410" y="90" width="131" height="44" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="475.5" y="118" class="mb" text-anchor="middle" xml:space="preserve"> "R=";R</text>
  <text x="475.5" y="158" class="s" text-anchor="middle" xml:space="preserve">命令に渡すもの</text>
  <text x="475.5" y="176" class="s" text-anchor="middle" xml:space="preserve">文字列と変数</text>
  <rect x="551" y="90" width="41" height="44" rx="5" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="571.5" y="118" class="mb" text-anchor="middle" xml:space="preserve">:</text>
  <text x="571.5" y="158" class="s" text-anchor="middle" xml:space="preserve">区切り</text>
  <text x="571.5" y="176" class="s" text-anchor="middle" xml:space="preserve"></text>
  <rect x="618" y="90" width="101" height="44" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="668.5" y="118" class="mb" text-anchor="middle" xml:space="preserve">PRINT</text>
  <text x="668.5" y="158" class="s" text-anchor="middle" xml:space="preserve">命令</text>
  <text x="668.5" y="176" class="s" text-anchor="middle" xml:space="preserve"></text>
  <rect x="729" y="90" width="131" height="44" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="794.5" y="118" class="mb" text-anchor="middle" xml:space="preserve"> R^2*PI</text>
  <text x="794.5" y="158" class="s" text-anchor="middle" xml:space="preserve">命令に渡すもの</text>
  <text x="794.5" y="176" class="s" text-anchor="middle" xml:space="preserve">式</text>
  <text x="40" y="212" class="s" xml:space="preserve">行番号と最初の文の間には、ENTER を押したときに本体が : を表示する。1 行は ENTER を含めて 254 文字まで</text>
</svg>
