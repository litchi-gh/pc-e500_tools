<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">カードの 3 つの使い方</title>
  <desc id="d">MEM$ が S1、S2、B のときに、プログラムと変数、F: がどこに置かれるか。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .xs { font-size: 11px; fill: #52606D; }
    .r { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #B7791F; font-weight: 700; }
    .j { font-size: 10px; fill: #B7791F; font-weight: 700; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lcd { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 700; fill: #24351D; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B8794"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">カードの 3 つの使い方</text>
  <text x="24" y="56" class="sub">MEM$ の設定で、プログラムと変数の置き場所が変わる</text>
  <rect x="24" y="70" width="300" height="236" rx="6" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="174" y="96" class="m" xml:space="preserve" text-anchor="middle">MEM$="S1"</text>
  <rect x="40" y="112" width="268" height="84" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="50" y="132" class="s">本体（S1）</text>
  <text x="174" y="158" class="b" text-anchor="middle">プログラム、変数</text>
  <text x="174" y="180" class="s" text-anchor="middle">E:、AER</text>
  <rect x="40" y="208" width="268" height="84" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="50" y="228" class="s">カード（S2）</text>
  <text x="174" y="254" class="b" text-anchor="middle">F:（ディスクとして）</text>
  <text x="174" y="276" class="s" text-anchor="middle"></text>
  <rect x="340" y="70" width="300" height="236" rx="6" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="490" y="96" class="m" xml:space="preserve" text-anchor="middle">MEM$="S2"</text>
  <rect x="356" y="112" width="268" height="84" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="366" y="132" class="s">本体（S1）</text>
  <text x="490" y="158" class="b" text-anchor="middle">E:、AER、PF キー</text>
  <text x="490" y="180" class="s" text-anchor="middle">（本体のプログラムは保持）</text>
  <rect x="356" y="208" width="268" height="84" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="366" y="228" class="s">カード（S2）</text>
  <text x="490" y="254" class="b" text-anchor="middle">プログラム、変数</text>
  <text x="490" y="276" class="s" text-anchor="middle">F:</text>
  <rect x="656" y="70" width="300" height="236" rx="6" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="806" y="96" class="m" xml:space="preserve" text-anchor="middle">MEM$="B"</text>
  <rect x="672" y="112" width="268" height="84" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="682" y="132" class="s">本体（S1）</text>
  <text x="806" y="158" class="b" text-anchor="middle">プログラム、変数</text>
  <text x="806" y="180" class="s" text-anchor="middle">E:、AER</text>
  <rect x="672" y="208" width="268" height="84" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="682" y="228" class="s">カード（S2）</text>
  <text x="806" y="254" class="b" text-anchor="middle">メモリの拡張分</text>
  <text x="806" y="276" class="s" text-anchor="middle">F: は使えない</text>
</svg>
