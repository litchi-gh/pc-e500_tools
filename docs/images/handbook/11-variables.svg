<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">変数の種類</title>
  <desc id="d">数値と文字列、固定変数、単純変数、配列の関係を表した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">変数の種類</text>
  <text x="24" y="55" class="sub" xml:space="preserve">名前の形で変数の種類が決まる</text>
  <rect x="16" y="72" width="640" height="240" rx="10" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="30" y="94" class="b" xml:space="preserve">数値</text>
  <rect x="668" y="72" width="296" height="240" rx="10" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="682" y="94" class="b" xml:space="preserve">文字列</text>
  <rect x="30" y="108" width="190" height="190" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="44" y="134" class="b" xml:space="preserve">固定変数</text>
  <text x="44" y="158" class="m" xml:space="preserve">A  B  C  …  Z</text>
  <text x="44" y="182" class="s" xml:space="preserve">26 個。常に確保されている</text>
  <text x="44" y="201" class="s" xml:space="preserve">1 個 12 バイトの専用領域</text>
  <text x="44" y="220" class="s" xml:space="preserve">単精度（10 桁）</text>
  <text x="44" y="239" class="s" xml:space="preserve">RUN では消えない</text>
  <text x="44" y="258" class="s" xml:space="preserve">CLEAR で 0 になる</text>
  <rect x="232" y="108" width="200" height="190" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="246" y="134" class="b" xml:space="preserve">単純変数</text>
  <text x="246" y="158" class="m" xml:space="preserve">AB  C1  TOTAL2</text>
  <text x="246" y="182" class="s" xml:space="preserve">名前は 40 文字まで有効</text>
  <text x="246" y="201" class="s" xml:space="preserve">使ったときに作られる</text>
  <text x="246" y="220" class="s" xml:space="preserve"># を付けると倍精度（20 桁）</text>
  <text x="246" y="239" class="s" xml:space="preserve">A# も単純変数</text>
  <text x="246" y="258" class="s" xml:space="preserve">RUN で消える</text>
  <rect x="444" y="108" width="200" height="190" rx="8" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="458" y="134" class="b" xml:space="preserve">配列</text>
  <text x="458" y="158" class="m" xml:space="preserve">X(5)  Y#(2,3)</text>
  <text x="458" y="182" class="s" xml:space="preserve">DIM で先に宣言する</text>
  <text x="458" y="201" class="s" xml:space="preserve">番号は 0 から</text>
  <text x="458" y="220" class="s" xml:space="preserve">X と X(0) は別のもの</text>
  <text x="458" y="239" class="s" xml:space="preserve">RUN、ERASE で消える</text>
  <rect x="682" y="108" width="130" height="190" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="696" y="134" class="b" xml:space="preserve">単純変数</text>
  <text x="696" y="158" class="m" xml:space="preserve">A$  BB$  C2$</text>
  <text x="696" y="182" class="s" xml:space="preserve">254 文字まで</text>
  <text x="696" y="201" class="s" xml:space="preserve">使うたびに伸び縮み</text>
  <text x="696" y="220" class="s" xml:space="preserve">RUN で消える</text>
  <rect x="822" y="108" width="130" height="190" rx="8" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="836" y="134" class="b" xml:space="preserve">配列</text>
  <text x="836" y="158" class="m" xml:space="preserve">N$(9)</text>
  <text x="836" y="182" class="s" xml:space="preserve">DIM で宣言</text>
  <text x="836" y="201" class="s" xml:space="preserve">1 要素 254 文字</text>
  <text x="836" y="220" class="s" xml:space="preserve">まで</text>
</svg>
