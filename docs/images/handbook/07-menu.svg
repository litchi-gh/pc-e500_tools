<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d">
  <title id="t">エンジニアソフトのメニュー</title>
  <desc id="d">メインメニューの PF5 から入り、PF1 から PF5 で分野を選び、さらに項目を選ぶ。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; font-size: 15px; }
    .h { font-weight: 700; font-size: 18px; }
    .s { font-size: 12px; fill: #52606D; }
    .k { font-size: 13px; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
  </style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E8A7E"/><stop offset="1" stop-color="#6F6B60"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4E54"/><stop offset="1" stop-color="#2E3237"/></linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9BDC2"/><stop offset="1" stop-color="#8F949A"/></linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFEBDF"/><stop offset="1" stop-color="#D2CCBA"/></linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6D796"/><stop offset="1" stop-color="#AFC47A"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1F2933" flood-opacity="0.25"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="559" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>

  <text x="24" y="36" class="h" text-anchor="start" xml:space="preserve">エンジニアソフトのメニュー</text>
  <rect x="24" y="60" width="460" height="260" rx="10" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3" />
  <rect x="36" y="71" width="44" height="24" rx="4" fill="#2E3237" stroke="none" stroke-width="1" />
  <text x="58" y="88" text-anchor="middle" style="font-size:13px;fill:#FFFFFF">PF1</text>
  <text x="92" y="89" class="b" text-anchor="start" xml:space="preserve">ｽｳｶﾞｸ</text>
  <text x="154" y="89" class="s" text-anchor="start" xml:space="preserve">数学</text>
  <rect x="36" y="108" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="127" class="m" text-anchor="start" xml:space="preserve">ｾｲｽｳ</text>
  <text x="108" y="127" class="s" text-anchor="start" xml:space="preserve">整数</text>
  <text x="190" y="127" class="m" text-anchor="start" xml:space="preserve">ｿｲﾝｽｳ  GCMLCM</text>
  <rect x="36" y="142" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="161" class="m" text-anchor="start" xml:space="preserve">ﾎｳﾃｲｼｷ</text>
  <text x="108" y="161" class="s" text-anchor="start" xml:space="preserve">方程式</text>
  <text x="190" y="161" class="m" text-anchor="start" xml:space="preserve">3ｼﾞ  ｽｳﾁｶｲ1  ｽｳﾁｶｲ2</text>
  <rect x="36" y="176" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="195" class="m" text-anchor="start" xml:space="preserve">ﾋﾞｾｷ</text>
  <text x="108" y="195" class="s" text-anchor="start" xml:space="preserve">微分・積分</text>
  <text x="190" y="195" class="m" text-anchor="start" xml:space="preserve">ｾｷﾌﾞﾝ  ﾋﾞﾌﾞﾝ  ﾎｶﾝ</text>
  <rect x="36" y="210" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="229" class="m" text-anchor="start" xml:space="preserve">ｺｳｼｷ</text>
  <text x="108" y="229" class="s" text-anchor="start" xml:space="preserve">公式</text>
  <text x="190" y="229" class="m" text-anchor="start" xml:space="preserve">ｲﾝｽｳF  ｻﾝｶｸF  ｾｷﾌﾞﾝF  ｷﾞﾘｼｬ</text>
  <rect x="36" y="244" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="263" class="m" text-anchor="start" xml:space="preserve">ｸﾞﾗﾌ</text>
  <text x="108" y="263" class="s" text-anchor="start" xml:space="preserve">グラフ・図形</text>
  <text x="190" y="263" class="m" text-anchor="start" xml:space="preserve">ｸﾞﾗﾌF  ｸﾞﾗﾌD  ﾒﾝｾｷ</text>
  <rect x="36" y="278" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="297" class="m" text-anchor="start" xml:space="preserve">ﾄｸｼｭ</text>
  <text x="108" y="297" class="s" text-anchor="start" xml:space="preserve">特殊関数</text>
  <text x="190" y="297" class="m" text-anchor="start" xml:space="preserve">ｶﾞﾝﾏ</text>
  <rect x="500" y="60" width="456" height="192" rx="10" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3" />
  <rect x="512" y="71" width="44" height="24" rx="4" fill="#2E3237" stroke="none" stroke-width="1" />
  <text x="534" y="88" text-anchor="middle" style="font-size:13px;fill:#FFFFFF">PF2</text>
  <text x="568" y="89" class="b" text-anchor="start" xml:space="preserve">ｶｶﾞｸ</text>
  <text x="630" y="89" class="s" text-anchor="start" xml:space="preserve">科学</text>
  <rect x="512" y="108" width="432" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="522" y="127" class="m" text-anchor="start" xml:space="preserve">ﾌﾞﾂﾘ</text>
  <text x="584" y="127" class="s" text-anchor="start" xml:space="preserve">物理</text>
  <text x="666" y="127" class="m" text-anchor="start" xml:space="preserve">ｼﾞｮｳｽｳ  ﾀﾝｲ  ｳﾝﾄﾞｳF</text>
  <rect x="512" y="142" width="432" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="522" y="161" class="m" text-anchor="start" xml:space="preserve">ｶｶﾞｸ</text>
  <text x="584" y="161" class="s" text-anchor="start" xml:space="preserve">化学</text>
  <text x="666" y="161" class="m" text-anchor="start" xml:space="preserve">ｼｭｳｷ  ﾃﾞﾝｼ  ﾄﾞｳｲﾀｲ</text>
  <rect x="512" y="176" width="432" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="522" y="195" class="m" text-anchor="start" xml:space="preserve">ﾁｶﾞｸ</text>
  <text x="584" y="195" class="s" text-anchor="start" xml:space="preserve">地学</text>
  <text x="666" y="195" class="m" text-anchor="start" xml:space="preserve">ｷｼｮｳ  ﾜｸｾｲ</text>
  <rect x="512" y="210" width="432" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="522" y="229" class="m" text-anchor="start" xml:space="preserve">ｾｲﾌﾞﾂ</text>
  <text x="584" y="229" class="s" text-anchor="start" xml:space="preserve">生物</text>
  <text x="666" y="229" class="m" text-anchor="start" xml:space="preserve">ｱﾐﾉｻﾝ</text>
  <rect x="500" y="270" width="456" height="124" rx="10" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3" />
  <rect x="512" y="281" width="44" height="24" rx="4" fill="#2E3237" stroke="none" stroke-width="1" />
  <text x="534" y="298" text-anchor="middle" style="font-size:13px;fill:#FFFFFF">PF3</text>
  <text x="568" y="299" class="b" text-anchor="start" xml:space="preserve">ｺｳｶﾞｸ</text>
  <text x="630" y="299" class="s" text-anchor="start" xml:space="preserve">工学</text>
  <rect x="512" y="318" width="432" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="522" y="337" class="m" text-anchor="start" xml:space="preserve">ﾃﾞﾝｷ</text>
  <text x="584" y="337" class="s" text-anchor="start" xml:space="preserve">電気</text>
  <text x="666" y="337" class="m" text-anchor="start" xml:space="preserve">ﾌｸｿｽｳ  ﾃﾞﾝｷF  ﾃﾞﾝｼﾞF  ﾗﾌﾟﾗｽ</text>
  <rect x="512" y="352" width="432" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="522" y="371" class="m" text-anchor="start" xml:space="preserve">ｷｶｲ</text>
  <text x="584" y="371" class="s" text-anchor="start" xml:space="preserve">機械</text>
  <text x="666" y="371" class="m" text-anchor="start" xml:space="preserve">ｷｶｲF</text>
  <rect x="24" y="340" width="460" height="90" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.3" />
  <rect x="36" y="351" width="44" height="24" rx="4" fill="#2E3237" stroke="none" stroke-width="1" />
  <text x="58" y="368" text-anchor="middle" style="font-size:13px;fill:#FFFFFF">PF4</text>
  <text x="92" y="369" class="b" text-anchor="start" xml:space="preserve">ﾄｳｹｲ</text>
  <text x="154" y="369" class="s" text-anchor="start" xml:space="preserve">統計</text>
  <rect x="36" y="388" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="407" class="m" text-anchor="start" xml:space="preserve">ﾌﾞﾝﾌﾟ</text>
  <text x="108" y="407" class="s" text-anchor="start" xml:space="preserve">分布</text>
  <text x="190" y="407" class="m" text-anchor="start" xml:space="preserve">ｾｲｷﾌﾞ  Tﾌﾞ  ｶｲﾌﾞ  Fﾌﾞ</text>
  <rect x="24" y="448" width="460" height="90" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.3" />
  <rect x="36" y="459" width="44" height="24" rx="4" fill="#2E3237" stroke="none" stroke-width="1" />
  <text x="58" y="476" text-anchor="middle" style="font-size:13px;fill:#FFFFFF">PF5</text>
  <text x="92" y="477" class="b" text-anchor="start" xml:space="preserve">ﾍﾝｼｭｳ</text>
  <text x="154" y="477" class="s" text-anchor="start" xml:space="preserve">編集</text>
  <rect x="36" y="496" width="436" height="28" rx="5" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1" />
  <text x="46" y="515" class="m" text-anchor="start" xml:space="preserve">ｴﾃﾞｨﾀ  ﾃﾞﾓ</text>
  <rect x="500" y="410" width="456" height="122" rx="10" fill="#F7F9FB" stroke="#D9E0E8" stroke-width="1" />
  <text x="516" y="436" class="b" text-anchor="start" xml:space="preserve">入り方</text>
  <text x="516" y="462" class="" text-anchor="start" xml:space="preserve">1. MENU を押して、メインメニューを出す</text>
  <text x="516" y="486" class="" text-anchor="start" xml:space="preserve">2. PF5（ｴﾝｼﾞﾆｱ）を押す</text>
  <text x="516" y="510" class="" text-anchor="start" xml:space="preserve">3. 分野、項目、ソフトの順に PF キーで選ぶ</text>
</svg>
