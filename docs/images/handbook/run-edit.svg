<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-labelledby="t d">
  <title id="t">式の呼び出しと編集（PLAY BACK）</title>
  <desc id="d">計算した式を矢印のキーで呼び出し、上書き、挿入、削除で編集して再計算する手順。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .xs { font-size: 11px; fill: #52606D; }
    .r { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #B7791F; font-weight: 700; }
    .j { font-size: 10px; fill: #B7791F; font-weight: 700; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lcd { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 700; fill: #24351D; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B8794"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="639" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">式の呼び出しと編集（PLAY BACK）</text>
  <text x="24" y="56" class="sub">◀ は行末、▶ は行頭にカーソルを置いて呼び出す</text>
  <text x="24" y="94" class="b">1 計算</text>
  <rect x="114" y="76" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="129.0" y="94.0" class="m" xml:space="preserve" text-anchor="middle">1</text>
  <rect x="150" y="76" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="165.0" y="94.0" class="m" xml:space="preserve" text-anchor="middle">2</text>
  <rect x="186" y="76" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="201.0" y="94.0" class="m" xml:space="preserve" text-anchor="middle">×</text>
  <rect x="222" y="76" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="237.0" y="94.0" class="m" xml:space="preserve" text-anchor="middle">8</text>
  <rect x="258" y="76" width="30" height="26" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="273.0" y="94.0" class="m" xml:space="preserve" text-anchor="middle">⏎</text>
  <rect x="24" y="112" width="440" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="36" y="136" class="lcd" xml:space="preserve">12*8</text>
  <text x="452" y="158" class="lcd" xml:space="preserve" text-anchor="end">96</text>
  <text x="24" y="232" class="s">式は左、答えは右に表示</text>
  <text x="502" y="94" class="b">2 呼び出し</text>
  <rect x="592" y="76" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="607.0" y="94.0" class="m" xml:space="preserve" text-anchor="middle">◀</text>
  <rect x="502" y="112" width="440" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="514" y="136" class="lcd" xml:space="preserve">12*8</text>
  <text x="930" y="158" class="lcd" xml:space="preserve" text-anchor="end">96</text>
  <text x="514" y="180" class="lcd" xml:space="preserve">12*8_</text>
  <text x="502" y="232" class="s">行末に下線のカーソル</text>
  <text x="24" y="279" class="b">3 上書き</text>
  <rect x="114" y="261" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="129.0" y="279.0" class="m" xml:space="preserve" text-anchor="middle">◀</text>
  <rect x="150" y="261" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="165.0" y="279.0" class="m" xml:space="preserve" text-anchor="middle">5</text>
  <rect x="186" y="261" width="30" height="26" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="201.0" y="279.0" class="m" xml:space="preserve" text-anchor="middle">⏎</text>
  <rect x="24" y="297" width="440" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="36" y="321" class="lcd" xml:space="preserve">12*8</text>
  <text x="452" y="343" class="lcd" xml:space="preserve" text-anchor="end">96</text>
  <text x="36" y="365" class="lcd" xml:space="preserve">12*5</text>
  <text x="452" y="387" class="lcd" xml:space="preserve" text-anchor="end">60</text>
  <text x="24" y="417" class="s">8 の上で 5 を入力すると上書き</text>
  <text x="502" y="279" class="b">4 挿入</text>
  <rect x="592" y="261" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="607.0" y="279.0" class="m" xml:space="preserve" text-anchor="middle">▶</text>
  <rect x="628" y="261" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="643.0" y="279.0" class="m" xml:space="preserve" text-anchor="middle">▶</text>
  <rect x="664" y="261" width="36" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="682.0" y="279.0" class="m" xml:space="preserve" text-anchor="middle">INS</text>
  <rect x="706" y="261" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="721.0" y="279.0" class="m" xml:space="preserve" text-anchor="middle">0</text>
  <rect x="502" y="297" width="440" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="930" y="321" class="lcd" xml:space="preserve" text-anchor="end">96</text>
  <text x="514" y="343" class="lcd" xml:space="preserve">12*5</text>
  <text x="930" y="365" class="lcd" xml:space="preserve" text-anchor="end">60</text>
  <text x="514" y="387" class="lcd" xml:space="preserve">102*5</text>
  <text x="502" y="417" class="s">2 の前に 0 を挿入</text>
  <text x="24" y="464" class="b">5 続けて</text>
  <rect x="114" y="446" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="129.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">▶</text>
  <rect x="150" y="446" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="165.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">▶</text>
  <rect x="186" y="446" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="201.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">2</text>
  <rect x="222" y="446" width="30" height="26" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="237.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">⏎</text>
  <rect x="24" y="482" width="440" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="36" y="506" class="lcd" xml:space="preserve">12*5</text>
  <text x="452" y="528" class="lcd" xml:space="preserve" text-anchor="end">60</text>
  <text x="36" y="550" class="lcd" xml:space="preserve">102*25</text>
  <text x="452" y="572" class="lcd" xml:space="preserve" text-anchor="end">2550</text>
  <text x="24" y="602" class="s">5 の前に 2 を挿入して計算</text>
  <text x="502" y="464" class="b">6 削除</text>
  <rect x="592" y="446" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="607.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">▶</text>
  <rect x="628" y="446" width="36" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="646.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">DEL</text>
  <rect x="670" y="446" width="36" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="688.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">DEL</text>
  <rect x="712" y="446" width="30" height="26" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="727.0" y="464.0" class="m" xml:space="preserve" text-anchor="middle">⏎</text>
  <rect x="502" y="482" width="440" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="514" y="506" class="lcd" xml:space="preserve">102*25</text>
  <text x="930" y="528" class="lcd" xml:space="preserve" text-anchor="end">2550</text>
  <text x="514" y="550" class="lcd" xml:space="preserve">2*25</text>
  <text x="930" y="572" class="lcd" xml:space="preserve" text-anchor="end">50</text>
  <text x="502" y="602" class="s">1 と 0 を削除して計算</text>
</svg>
