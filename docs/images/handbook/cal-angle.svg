<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="t d">
  <title id="t">角度の 3 つの単位</title>
  <desc id="d">同じ角度を DEG、RAD、GRAD で表した図。直角は 90 度、π/2 ラジアン、100 グラード。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .xs { font-size: 11px; fill: #52606D; }
    .r { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #B7791F; font-weight: 700; }
    .j { font-size: 10px; fill: #B7791F; font-weight: 700; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lcd { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 700; fill: #24351D; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B8794"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="299" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">角度の 3 つの単位</text>
  <text x="24" y="56" class="sub">2nd F → DRG を押すたびに DEG → RAD → GRAD → DEG の順に切り替わる</text>
  <circle cx="170" cy="190" r="70" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <line x1="80" y1="190" x2="265" y2="190" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="170" y1="275" x2="170" y2="105" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="170" y="96" class="b" text-anchor="middle">DEG（度）</text>
  <text x="178" y="116" class="m" xml:space="preserve">90</text>
  <text x="78" y="182" class="m" xml:space="preserve">180</text>
  <text x="244" y="210" class="m" xml:space="preserve">360</text>
  <text x="244" y="182" class="m" xml:space="preserve">0</text>
  <circle cx="490" cy="190" r="70" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <line x1="400" y1="190" x2="585" y2="190" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="490" y1="275" x2="490" y2="105" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="490" y="96" class="b" text-anchor="middle">RAD（ラジアン）</text>
  <text x="498" y="116" class="m" xml:space="preserve">π/2</text>
  <text x="398" y="182" class="m" xml:space="preserve">π</text>
  <text x="564" y="210" class="m" xml:space="preserve">2π</text>
  <text x="564" y="182" class="m" xml:space="preserve">0</text>
  <circle cx="810" cy="190" r="70" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <line x1="720" y1="190" x2="905" y2="190" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="810" y1="275" x2="810" y2="105" stroke="#7B8794" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="810" y="96" class="b" text-anchor="middle">GRAD（グラード）</text>
  <text x="818" y="116" class="m" xml:space="preserve">100</text>
  <text x="718" y="182" class="m" xml:space="preserve">200</text>
  <text x="884" y="210" class="m" xml:space="preserve">400</text>
  <text x="884" y="182" class="m" xml:space="preserve">0</text>
</svg>
