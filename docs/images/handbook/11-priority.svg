<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">計算の順番</title>
  <desc id="d">BASIC の演算の優先順位を上から下への段で表した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">計算の順番</text>
  <text x="24" y="55" class="sub" xml:space="preserve">上の段ほど先に計算する。同じ段の中は、右の欄の向きの順</text>
  <rect x="24" y="74" width="700" height="36" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="40" y="97" class="b" xml:space="preserve">1</text>
  <text x="64" y="97" class="m" xml:space="preserve">( )</text>
  <text x="330" y="97" xml:space="preserve">かっこの中</text>
  <rect x="38" y="116" width="686" height="36" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="54" y="139" class="b" xml:space="preserve">2</text>
  <text x="78" y="139" class="m" xml:space="preserve">変数、PI</text>
  <text x="330" y="139" xml:space="preserve">値を取り出す</text>
  <rect x="52" y="158" width="672" height="36" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="68" y="181" class="b" xml:space="preserve">3</text>
  <text x="92" y="181" class="m" xml:space="preserve">SIN SQR LEN …  NOT</text>
  <text x="330" y="181" xml:space="preserve">関数と NOT。引数はすぐ次の値 1 つ</text>
  <text x="740" y="181" class="s" xml:space="preserve">右から左  SIN ACS 0.6</text>
  <rect x="66" y="200" width="658" height="36" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="82" y="223" class="b" xml:space="preserve">4</text>
  <text x="106" y="223" class="m" xml:space="preserve">^   ROT</text>
  <text x="330" y="223" xml:space="preserve">累乗、累乗根</text>
  <text x="740" y="223" class="s" xml:space="preserve">右から左  3^4^2 = 3^16</text>
  <rect x="80" y="242" width="644" height="36" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="96" y="265" class="b" xml:space="preserve">5</text>
  <text x="120" y="265" class="m" xml:space="preserve">+x  -x</text>
  <text x="330" y="265" xml:space="preserve">符号。-2^4 は -(2^4)</text>
  <rect x="94" y="284" width="630" height="36" rx="5" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="110" y="307" class="b" xml:space="preserve">6</text>
  <text x="134" y="307" class="m" xml:space="preserve">*   /</text>
  <text x="330" y="307" xml:space="preserve">掛け算、割り算</text>
  <text x="740" y="307" class="s" xml:space="preserve">左から右  12/3*2 = 8</text>
  <rect x="108" y="326" width="616" height="36" rx="5" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="124" y="349" class="b" xml:space="preserve">7</text>
  <text x="148" y="349" class="m" xml:space="preserve">+   -</text>
  <text x="330" y="349" xml:space="preserve">足し算、引き算、文字列の連結</text>
  <text x="740" y="349" class="s" xml:space="preserve">左から右  5-3-1 = 1</text>
  <rect x="122" y="368" width="602" height="36" rx="5" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="138" y="391" class="b" xml:space="preserve">8</text>
  <text x="162" y="391" class="m" xml:space="preserve">=  &lt;&gt;  &lt;  &gt;  &lt;=  &gt;=</text>
  <text x="330" y="391" xml:space="preserve">比較。真は -1、偽は 0</text>
  <text x="740" y="391" class="s" xml:space="preserve">左から右</text>
  <rect x="136" y="410" width="588" height="36" rx="5" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="152" y="433" class="b" xml:space="preserve">9</text>
  <text x="176" y="433" class="m" xml:space="preserve">AND   OR   XOR</text>
  <text x="330" y="433" xml:space="preserve">論理演算。3 つとも同じ段</text>
  <text x="740" y="433" class="s" xml:space="preserve">左から右  1 OR 1 AND 0 = 0</text>
  <path d="M16,78 L16,440" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
