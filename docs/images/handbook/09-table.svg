  <text x="185.0" y="62.0" class="m" text-anchor="middle" xml:space="preserve">d1</text>
  <rect x="90.0" y="70.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="185.0" y="91.0" class="m" text-anchor="middle" xml:space="preserve">MD(0,0)</text>
  <text x="385.0" y="62.0" class="m" text-anchor="middle" xml:space="preserve">d2</text>
  <rect x="290.0" y="70.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="385.0" y="91.0" class="m" text-anchor="middle" xml:space="preserve">MD(0,1)</text>
  <text x="585.0" y="62.0" class="m" text-anchor="middle" xml:space="preserve">d3</text>
  <rect x="490.0" y="70.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="585.0" y="91.0" class="m" text-anchor="middle" xml:space="preserve">MD(0,2)</text>
  <text x="785.0" y="62.0" class="m" text-anchor="middle" xml:space="preserve">dm</text>
  <rect x="690.0" y="70.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="785.0" y="91.0" class="m" text-anchor="middle" xml:space="preserve">MD(0,m-1)</text>
  <text x="80.0" y="91.0" class="m" text-anchor="end" xml:space="preserve">001</text>
  <rect x="90.0" y="108.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="185.0" y="129.0" class="m" text-anchor="middle" xml:space="preserve">MD(1,0)</text>
  <rect x="290.0" y="108.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="385.0" y="129.0" class="m" text-anchor="middle" xml:space="preserve">MD(1,1)</text>
  <rect x="490.0" y="108.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="585.0" y="129.0" class="m" text-anchor="middle" xml:space="preserve">MD(1,2)</text>
  <rect x="690.0" y="108.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="785.0" y="129.0" class="m" text-anchor="middle" xml:space="preserve">MD(1,m-1)</text>
  <text x="80.0" y="129.0" class="m" text-anchor="end" xml:space="preserve">002</text>
  <rect x="90.0" y="146.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="185.0" y="167.0" class="m" text-anchor="middle" xml:space="preserve">MD(2,0)</text>
  <rect x="290.0" y="146.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="385.0" y="167.0" class="m" text-anchor="middle" xml:space="preserve">MD(2,1)</text>
  <rect x="490.0" y="146.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="585.0" y="167.0" class="m" text-anchor="middle" xml:space="preserve">MD(2,2)</text>
  <rect x="690.0" y="146.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="785.0" y="167.0" class="m" text-anchor="middle" xml:space="preserve">MD(2,m-1)</text>
  <text x="80.0" y="167.0" class="m" text-anchor="end" xml:space="preserve">003</text>
  <rect x="90.0" y="184.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="185.0" y="205.0" class="m" text-anchor="middle" xml:space="preserve">MD(n,0)</text>
  <rect x="290.0" y="184.0" width="190.0" height="32.0" rx="4" fill="#FFF5DF" stroke="#B7791F"/>
  <text x="385.0" y="205.0" class="m" text-anchor="middle" xml:space="preserve">MD(n,1)</text>
  <rect x="490.0" y="184.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="585.0" y="205.0" class="m" text-anchor="middle" xml:space="preserve">MD(n,2)</text>
  <rect x="690.0" y="184.0" width="190.0" height="32.0" rx="4" fill="#F3F5F8" stroke="#7B8794"/>
  <text x="785.0" y="205.0" class="m" text-anchor="middle" xml:space="preserve">MD(n,m-1)</text>
  <text x="80.0" y="205.0" class="m" text-anchor="end" xml:space="preserve">n+1</text>
  <text x="30.0" y="240.0" class="s" text-anchor="start" xml:space="preserve">列は 1〜9、行は 256 まで。空のセル（? の表示）には -9.999999999E+99 が入る。</text>
