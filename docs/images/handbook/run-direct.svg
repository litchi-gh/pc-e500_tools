<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">関数キーの 3 つの動作</title>
  <desc id="d">RUN モードで関数のキーを押したとき、画面の状態によって、命令の文字が入る、すぐ計算する、式に加わる、の 3 通りになる。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .xs { font-size: 11px; fill: #52606D; }
    .r { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #B7791F; font-weight: 700; }
    .j { font-size: 10px; fill: #B7791F; font-weight: 700; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lcd { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 700; fill: #24351D; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B8794"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">関数キーの 3 つの動作</text>
  <rect x="24" y="60" width="300" height="250" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="174" y="86" class="b" text-anchor="middle">入力なし</text>
  <rect x="38" y="100" width="44" height="26" rx="5" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="60.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">C·CE</text>
  <rect x="88" y="100" width="36" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="106.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">sin</text>
  <rect x="130" y="100" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="145.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">3</text>
  <rect x="166" y="100" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="181.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">0</text>
  <rect x="202" y="100" width="30" height="26" rx="5" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="217.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">⏎</text>
  <rect x="38" y="150" width="272" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="50" y="174" class="lcd" xml:space="preserve">SIN30</text>
  <text x="298" y="196" class="lcd" xml:space="preserve" text-anchor="end">0.5</text>
  <text x="38" y="280" class="s">関数名 SIN が入力される。⏎ で計算</text>
  <rect x="340" y="60" width="300" height="250" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="490" y="86" class="b" text-anchor="middle">数値だけを表示</text>
  <rect x="354" y="100" width="44" height="26" rx="5" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="376.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">C·CE</text>
  <rect x="404" y="100" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="419.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">3</text>
  <rect x="440" y="100" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="455.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">0</text>
  <rect x="476" y="100" width="36" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="494.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">sin</text>
  <rect x="354" y="150" width="272" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="366" y="174" class="lcd" xml:space="preserve">SIN 30</text>
  <text x="614" y="196" class="lcd" xml:space="preserve" text-anchor="end">0.5</text>
  <text x="354" y="280" class="s">すぐに計算される（⏎ は不要）</text>
  <rect x="656" y="60" width="300" height="250" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="806" y="86" class="b" text-anchor="middle">式の入力中</text>
  <rect x="670" y="100" width="44" height="26" rx="5" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="692.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">C·CE</text>
  <rect x="720" y="100" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="735.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">5</text>
  <rect x="756" y="100" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="771.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">×</text>
  <rect x="792" y="100" width="30" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="807.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">4</text>
  <rect x="828" y="100" width="36" height="26" rx="5" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.2"/>
  <text x="846.0" y="118.0" class="m" xml:space="preserve" text-anchor="middle">log</text>
  <rect x="670" y="150" width="272" height="102" rx="6" fill="#BDD08B" stroke="#4A5A2A" stroke-width="1.2"/>
  <text x="682" y="174" class="lcd" xml:space="preserve">5*4LOG_</text>
  <text x="670" y="280" class="s">関数名が入力される。計算はされない</text>
</svg>
