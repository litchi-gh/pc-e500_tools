<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">ブザーの回路の違い</title>
  <desc id="d">PC-E500 はトランジスタ 1 個、PC-E500S はトランジスタと NAND で両側から動かす図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" text-anchor="start" xml:space="preserve">ブザーの回路の違い</text>
  <text x="24" y="56" class="s" text-anchor="start" xml:space="preserve">どちらも CO と MT2 が 100 kΩ ずつを通って同じトランジスタに入る</text>
  <text x="30" y="90" class="b" text-anchor="start" xml:space="preserve">PC-E500</text>
  <rect x="30" y="110" width="90" height="36" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="75.0" y="133.0" class="b" text-anchor="middle" xml:space="preserve">CO</text>
  <rect x="30" y="170" width="90" height="36" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="75.0" y="193.0" class="b" text-anchor="middle" xml:space="preserve">MT2</text>
  <rect x="150" y="110" width="80" height="36" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="190.0" y="133.0" class="s" text-anchor="middle" xml:space="preserve">100 kΩ</text>
  <rect x="150" y="170" width="80" height="36" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="190.0" y="193.0" class="s" text-anchor="middle" xml:space="preserve">100 kΩ</text>
  <line x1="120" y1="128" x2="150" y2="128" stroke="#52606D" stroke-width="1.6"/>
  <line x1="120" y1="188" x2="150" y2="188" stroke="#52606D" stroke-width="1.6"/>
  <line x1="230" y1="128" x2="270" y2="150" stroke="#52606D" stroke-width="1.6"/>
  <line x1="230" y1="188" x2="270" y2="166" stroke="#52606D" stroke-width="1.6"/>
  <rect x="270" y="130" width="80" height="56" rx="8" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.3"/>
  <text x="310.0" y="163.0" class="b" text-anchor="middle" xml:space="preserve">Q2</text>
  <text x="510" y="90" class="b" text-anchor="start" xml:space="preserve">PC-E500S、PC-E650、PC-U6000</text>
  <rect x="510" y="110" width="90" height="36" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="555.0" y="133.0" class="b" text-anchor="middle" xml:space="preserve">CO</text>
  <rect x="510" y="170" width="90" height="36" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="555.0" y="193.0" class="b" text-anchor="middle" xml:space="preserve">MT2</text>
  <rect x="630" y="110" width="80" height="36" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="670.0" y="133.0" class="s" text-anchor="middle" xml:space="preserve">100 kΩ</text>
  <rect x="630" y="170" width="80" height="36" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="670.0" y="193.0" class="s" text-anchor="middle" xml:space="preserve">100 kΩ</text>
  <line x1="600" y1="128" x2="630" y2="128" stroke="#52606D" stroke-width="1.6"/>
  <line x1="600" y1="188" x2="630" y2="188" stroke="#52606D" stroke-width="1.6"/>
  <line x1="710" y1="128" x2="750" y2="150" stroke="#52606D" stroke-width="1.6"/>
  <line x1="710" y1="188" x2="750" y2="166" stroke="#52606D" stroke-width="1.6"/>
  <rect x="750" y="130" width="80" height="56" rx="8" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.3"/>
  <text x="790.0" y="163.0" class="b" text-anchor="middle" xml:space="preserve">Q2</text>
  <line x1="350" y1="158" x2="390" y2="158" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="390" y="130" width="80" height="56" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3"/>
  <text x="430.0" y="163.0" class="b" text-anchor="middle" xml:space="preserve">ブザー</text>
  <text x="390" y="212" class="s" text-anchor="start" xml:space="preserve">片側は VCC</text>
  <text x="390" y="230" class="s" text-anchor="start" xml:space="preserve">（4.7 kΩ と並列）</text>
  <line x1="830" y1="158" x2="860" y2="158" stroke="#52606D" stroke-width="1.6"/>
  <rect x="870" y="90" width="80" height="40" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3"/>
  <text x="910.0" y="115.0" class="b" text-anchor="middle" xml:space="preserve">ブザー</text>
  <line x1="860" y1="158" x2="860" y2="110" stroke="#52606D" stroke-width="1.6"/>
  <line x1="860" y1="110" x2="870" y2="110" stroke="#52606D" stroke-width="1.6"/>
  <line x1="860" y1="158" x2="860" y2="190" stroke="#52606D" stroke-width="1.6"/>
  <rect x="850" y="190" width="110" height="46" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="905.0" y="208.5" class="b" text-anchor="middle" xml:space="preserve">IC14 NAND</text>
  <text x="905.0" y="227.5" class="s" text-anchor="middle" xml:space="preserve">反対の信号</text>
  <line x1="950" y1="110" x2="965" y2="110" stroke="#52606D" stroke-width="1.6"/>
  <line x1="965" y1="110" x2="965" y2="213" stroke="#52606D" stroke-width="1.6"/>
  <line x1="965" y1="213" x2="960" y2="213" stroke="#52606D" stroke-width="1.6"/>
  <text x="510" y="270" class="s" text-anchor="start" xml:space="preserve">IC14 のもう 1 つの入力は表示の電源 VCC'（R24 100 kΩ で GND へ）。</text>
  <text x="510" y="290" class="s" text-anchor="start" xml:space="preserve">表示の電源が切れている間は、ブザーの片側が High のまま止まる。</text>
  <text x="30" y="270" class="s" text-anchor="start" xml:space="preserve">ブザーの片側だけを動かす。</text>
  <text x="30" y="290" class="s" text-anchor="start" xml:space="preserve">PC-E500S は両側を反対向きに動かすので、振れ幅が 2 倍になる。</text>
</svg>
