  <text x="404" y="84" class="ms" text-anchor="middle" xml:space="preserve">+4</text>
  <text x="456" y="84" class="ms" text-anchor="middle" xml:space="preserve">+5</text>
  <text x="508" y="84" class="ms" text-anchor="middle" xml:space="preserve">+6</text>
  <text x="560" y="84" class="ms" text-anchor="middle" xml:space="preserve">+7</text>
  <text x="612" y="84" class="ms" text-anchor="middle" xml:space="preserve">+8</text>
  <text x="664" y="84" class="ms" text-anchor="middle" xml:space="preserve">+9</text>
