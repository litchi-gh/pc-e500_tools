  <text x="872" y="84" class="ms" text-anchor="middle" xml:space="preserve">+13</text>
  <text x="924" y="84" class="ms" text-anchor="middle" xml:space="preserve">+14</text>
  <text x="24" y="118" class="b" xml:space="preserve">単精度</text>
  <rect x="170" y="94" width="52" height="38" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="196" y="118" text-anchor="middle" style="font-size:12px;" xml:space="preserve">符号</text>
  <rect x="222" y="94" width="52" height="38" rx="0" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="248" y="118" text-anchor="middle" style="font-size:12px;" xml:space="preserve">指数</text>
  <rect x="274" y="94" width="52" height="38" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="300" y="118" text-anchor="middle" style="font-size:12px;" xml:space="preserve">桁上がり</text>
  <rect x="326" y="94" width="260" height="38" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="456" y="118" text-anchor="middle" style="font-size:13px;" xml:space="preserve">仮数 5 バイト（10 桁）</text>
  <rect x="586" y="94" width="104" height="38" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="638" y="118" text-anchor="middle" style="font-size:12px;" xml:space="preserve">補正 2 バイト</text>
  <rect x="690" y="94" width="260" height="38" rx="0" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1"/>
  <text x="820" y="118" text-anchor="middle" style="font-size:13px;" xml:space="preserve">未使用</text>
  <text x="24" y="178" class="b" xml:space="preserve">倍精度</text>
  <rect x="170" y="154" width="52" height="38" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="196" y="178" text-anchor="middle" style="font-size:12px;" xml:space="preserve">符号</text>
  <rect x="222" y="154" width="52" height="38" rx="0" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="248" y="178" text-anchor="middle" style="font-size:12px;" xml:space="preserve">指数</text>
  <rect x="274" y="154" width="52" height="38" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="300" y="178" text-anchor="middle" style="font-size:12px;" xml:space="preserve">桁上がり</text>
  <rect x="326" y="154" width="520" height="38" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="586" y="178" text-anchor="middle" style="font-size:13px;" xml:space="preserve">仮数 10 バイト（20 桁）</text>
