  <text x="898" y="178" text-anchor="middle" style="font-size:12px;" xml:space="preserve">補正 2 バイト</text>
  <text x="24" y="238" class="b" xml:space="preserve">文字列</text>
  <rect x="170" y="214" width="52" height="38" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="196" y="238" text-anchor="middle" style="font-size:12px;" xml:space="preserve">80h</text>
  <rect x="222" y="214" width="156" height="38" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="300" y="238" text-anchor="middle" style="font-size:13px;" xml:space="preserve">アドレス（下位、上位、拡張）</text>
  <rect x="378" y="214" width="52" height="38" rx="0" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="404" y="238" text-anchor="middle" style="font-size:12px;" xml:space="preserve">長さ</text>
  <rect x="430" y="214" width="520" height="38" rx="0" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1"/>
  <text x="690" y="238" text-anchor="middle" style="font-size:13px;" xml:space="preserve">未使用</text>
  <text x="24" y="290" xml:space="preserve">桁上がりと補正は、計算の途中の桁あふれと丸めのための場所です。桁上がりは通常 0 です。</text>
</svg>
