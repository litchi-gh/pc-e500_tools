  <text x="724" y="390.32" class="s" text-anchor="middle">状態</text>
  <text x="24" y="390" class="s">機器が返す</text>
  <text x="24" y="453" class="b">LOAD 受ける</text>
  <rect x="150" y="430" width="56" height="36" rx="3" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="178" y="452.32" class="s" text-anchor="middle">00h</text>
