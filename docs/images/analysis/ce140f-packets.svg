  <text x="418" y="242.32" class="s" text-anchor="middle">2Dh</text>
  <text x="470" y="243" class="s">長さ 00012Ch = 300 バイト。和 = 2Ch + 01h + 00h = 2Dh</text>
  <text x="24" y="292" class="b">本体が 600 バイトのとき（256 + 256 + 88）</text>
  <text x="24" y="329" class="b">SAVE 送る</text>
