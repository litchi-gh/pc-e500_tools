  <text x="838" y="452.32" class="s" text-anchor="middle">00h</text>
  <text x="24" y="500" class="s">SAVE はブロックごとに状態が返る。LOAD（0Fh）は状態の 00h のあとに本体と和が続き、最後にもう一度 00h が来る。</text>
