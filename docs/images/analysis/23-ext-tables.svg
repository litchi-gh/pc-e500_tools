<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392" width="980" height="392" role="img" aria-labelledby="t d">
  <title id="t">拡張 ROM の 30600h〜30A49h に並ぶ表</title>
  <desc id="d">記号のドット、代替のドット、キーの対応表 6 組、キーの位置の表が隙間なく並ぶことを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="391" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">拡張 ROM の 30600h〜30A49h に並ぶ表</text>
  <text x="24" y="55" class="sub">8.3、8.4、8.5 で同じアドレス。改訂 7 までは本体 ROM の F27A5h〜、F3472h〜（7.5 のアドレス）にあった</text>
  <text x="40" y="76" class="s">先頭（8.5）</text>
  <text x="190" y="76" class="s">バイト</text>
  <rect x="24" y="84" width="932" height="32" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="40" y="105" class="m" xml:space="preserve">30600h</text>
  <text x="190" y="105" class="m" xml:space="preserve">192</text>
  <text x="270" y="105" class="b">記号のドット 32 字</text>
  <text x="680" y="105" class="s">曜日や箱などの絵文字</text>
  <rect x="24" y="120" width="932" height="32" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="40" y="141" class="m" xml:space="preserve">306C0h</text>
  <text x="190" y="141" class="m" xml:space="preserve">216</text>
  <text x="270" y="141" class="b">記号のドット 36 字</text>
  <text x="680" y="141" class="s">行エディタなどが BFC93h に入れて使う</text>
  <rect x="24" y="156" width="932" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="40" y="177" class="m" xml:space="preserve">30798h</text>
  <text x="190" y="177" class="m" xml:space="preserve">12</text>
  <text x="270" y="177" class="b">代替のドット 2 字</text>
  <text x="680" y="177" class="s">BFC84h が指す</text>
  <rect x="24" y="192" width="932" height="32" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="40" y="213" class="m" xml:space="preserve">307A4h  30806h</text>
  <text x="190" y="213" class="m" xml:space="preserve">98 × 2</text>
  <text x="270" y="213" class="b">キーの対応表 1（1 バイト目の表、2 バイト目の表）</text>
  <text x="680" y="213" class="s">F1985h が使う</text>
  <rect x="24" y="228" width="932" height="32" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="40" y="249" class="m" xml:space="preserve">30868h  308CAh</text>
  <text x="190" y="249" class="m" xml:space="preserve">98 × 2</text>
  <text x="270" y="249" class="b">キーの対応表 2</text>
  <text x="680" y="249" class="s">F19A5h が使う</text>
  <rect x="24" y="264" width="932" height="32" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="40" y="285" class="m" xml:space="preserve">3092Ch  3098Eh</text>
  <text x="190" y="285" class="m" xml:space="preserve">98 × 2</text>
  <text x="270" y="285" class="b">キーの対応表 3</text>
  <text x="680" y="285" class="s">F19B1h が使う</text>
  <rect x="24" y="300" width="932" height="32" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="40" y="321" class="m" xml:space="preserve">309F0h</text>
  <text x="190" y="321" class="m" xml:space="preserve">90</text>
  <text x="270" y="321" class="b">キーの位置の表（行 × 8 + ビット → キーの番号）</text>
  <text x="680" y="321" class="s">F1D1Ah のポインタが指す</text>
  <rect x="24" y="336" width="932" height="32" rx="4" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="40" y="357" class="m" xml:space="preserve">30A4Ah</text>
  <text x="190" y="357" class="m" xml:space="preserve">1007</text>
  <text x="270" y="357" class="b">BASIC のエラーメッセージ</text>
  <text x="680" y="357" class="s">30E38h まで</text>
</svg>
