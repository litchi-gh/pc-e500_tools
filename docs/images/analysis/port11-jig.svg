<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">検査の治具の 11 ピンのつなぎ方</title>
  <desc id="d">PC-E500S のサービスマニュアルの治具で、出力の線が反転されて入力の線に戻る様子の図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" text-anchor="start" xml:space="preserve">検査の治具の 11 ピンのつなぎ方</text>
  <text x="24" y="56" class="s" text-anchor="start" xml:space="preserve">PC-E500S の治具（サービスマニュアル p.10）を論理だけにしたもの。抵抗は省いた</text>
  <rect x="40" y="100" width="100" height="36" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="90.0" y="123.0" class="b" text-anchor="middle" xml:space="preserve">BUSY</text>
  <rect x="40" y="160" width="100" height="36" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="90.0" y="183.0" class="b" text-anchor="middle" xml:space="preserve">DOUT</text>
  <rect x="40" y="220" width="100" height="36" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="90.0" y="243.0" class="b" text-anchor="middle" xml:space="preserve">XOUT</text>
  <rect x="40" y="280" width="100" height="36" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="90.0" y="303.0" class="b" text-anchor="middle" xml:space="preserve">IO1</text>
  <rect x="820" y="130" width="110" height="36" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3"/>
  <text x="875.0" y="153.0" class="b" text-anchor="middle" xml:space="preserve">ACK</text>
  <rect x="820" y="190" width="110" height="36" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3"/>
  <text x="875.0" y="213.0" class="b" text-anchor="middle" xml:space="preserve">DIN</text>
  <rect x="820" y="235" width="110" height="36" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3"/>
  <text x="875.0" y="258.0" class="b" text-anchor="middle" xml:space="preserve">XIN</text>
  <rect x="820" y="325" width="110" height="36" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3"/>
  <text x="875.0" y="348.0" class="b" text-anchor="middle" xml:space="preserve">IO2</text>
  <line x1="140" y1="178" x2="300" y2="178" stroke="#52606D" stroke-width="1.6"/>
  <rect x="300" y="160" width="70" height="34" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="335.0" y="182.0" class="s" text-anchor="middle" xml:space="preserve">反転</text>
  <line x1="370" y1="178" x2="700" y2="178" stroke="#52606D" stroke-width="1.6"/>
  <line x1="700" y1="178" x2="818" y2="205" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="140" y1="238" x2="300" y2="238" stroke="#52606D" stroke-width="1.6"/>
  <rect x="300" y="221" width="70" height="34" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="335.0" y="243.0" class="s" text-anchor="middle" xml:space="preserve">反転</text>
  <line x1="370" y1="238" x2="818" y2="252" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="140" y1="298" x2="300" y2="298" stroke="#52606D" stroke-width="1.6"/>
  <rect x="300" y="281" width="70" height="34" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="335.0" y="303.0" class="s" text-anchor="middle" xml:space="preserve">反転</text>
  <line x1="370" y1="298" x2="480" y2="298" stroke="#52606D" stroke-width="1.6"/>
  <line x1="480" y1="298" x2="480" y2="343" stroke="#52606D" stroke-width="1.6"/>
  <line x1="480" y1="343" x2="818" y2="343" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="480" y1="298" x2="520" y2="298" stroke="#52606D" stroke-width="1.6"/>
  <rect x="520" y="281" width="70" height="34" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="555.0" y="303.0" class="s" text-anchor="middle" xml:space="preserve">反転</text>
  <line x1="590" y1="298" x2="640" y2="298" stroke="#52606D" stroke-width="1.6"/>
  <line x1="640" y1="298" x2="640" y2="130" stroke="#52606D" stroke-width="1.6"/>
  <rect x="640" y="100" width="90" height="50" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.3"/>
  <text x="685.0" y="120.5" class="b" text-anchor="middle" xml:space="preserve">または</text>
  <text x="685.0" y="139.5" class="s" text-anchor="middle" xml:space="preserve">（OR）</text>
  <line x1="140" y1="118" x2="638" y2="118" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="730" y1="125" x2="818" y2="145" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40" y="400" class="b" text-anchor="start" xml:space="preserve">DIN は DOUT の反転、XIN は XOUT の反転、IO2 は IO1 の反転、ACK は「BUSY または IO1」になる。</text>
  <text x="40" y="424" class="s" text-anchor="start" xml:space="preserve">例：全部 0 なら DIN = 1 だけが 1。ACK が 0 なので、IO2 の 1 は門に止められて読めない。値は 08h。</text>
  <text x="40" y="446" class="s" text-anchor="start" xml:space="preserve">例：IO1 だけ 1 なら ACK = 1、DIN = 1、IO1 = 1。1 1 0 0 1 で 19h。</text>
</svg>
