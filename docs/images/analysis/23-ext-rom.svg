<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d">
  <title id="t">拡張 ROM の中身（8.5 のアドレス）</title>
  <desc id="d">拡張 ROM の 30000h から 33A18h までを帯で表し、フォント、キーの表、エラーメッセージ、構造化構文、診断メニューの位置を示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="399" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">拡張 ROM の中身（8.5 のアドレス）</text>
  <text x="24" y="55" class="sub">20000h〜2FFFFh は全バイト FFh。データは 30000h から始まる</text>
  <rect x="40" y="90" width="92.947" height="56" rx="0" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="86.4735" y="124" class="s" text-anchor="middle">フォント</text>
  <rect x="132.947" y="90" width="55.1267" height="56" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="160.51" y="124" class="s" text-anchor="middle">表</text>
  <rect x="188.074" y="90" width="11.3158" height="56" rx="0" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="193.732" y="124" class="s" text-anchor="middle"></text>
  <rect x="199.389" y="90" width="86.5326" height="56" rx="0" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="242.656" y="124" class="s" text-anchor="middle">エラー文</text>
  <rect x="285.922" y="90" width="74.4302" height="56" rx="0" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="323.137" y="124" class="s" text-anchor="middle">構造化</text>
  <rect x="360.352" y="90" width="579.648" height="56" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="650.176" y="124" class="s" text-anchor="middle">診断メニューほか</text>
  <polyline points="40,146 40,164" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="144.565,146 144.565,186" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="157.636,146 157.636,208" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="158.362,146 158.362,230" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="199.389,146 199.389,252" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="285.922,146 285.922,274" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="358.779,146 358.779,296" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="360.352,146 360.352,164" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="371.729,146 371.729,186" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="747.389,146 747.389,164" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="890.017,146 890.017,186" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="939.939,146 939.939,208" fill="none" stroke="#7B8794" stroke-width="1" stroke-linejoin="round"/>
  <text x="44" y="168" class="lbl">30000h 文字 256 字</text>
  <text x="148.565" y="190" class="lbl">306C0h 記号のドット 36 字</text>
  <text x="161.636" y="212" class="lbl">30798h 代替のドット列（BFC84h が指す）</text>
  <text x="162.362" y="234" class="lbl">307A4h〜30A49h キーの対応表</text>
  <text x="203.389" y="256" class="lbl">30A4Ah エラーメッセージ</text>
  <text x="289.922" y="278" class="lbl">30FE0h ENDIF ほか 9 語の処理</text>
  <text x="362.779" y="300" class="lbl">31494h RESUME の続き</text>
  <text x="364.352" y="168" class="lbl">314AEh 診断メニューのエントリ</text>
  <text x="375.729" y="190" class="lbl">3156Ah メニューのキーの表</text>
  <text x="751.389" y="168" class="lbl">32DAAh 付近 機種名の文字列</text>
  <text x="886.017" y="190" class="lbl" text-anchor="end">336DFh 8 バイトずつの表</text>
  <text x="935.939" y="212" class="lbl" text-anchor="end">33A18h 終わり</text>
  <rect x="40" y="345" width="14" height="14" rx="3" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="60" y="356" class="s">文字の形</text>
  <rect x="132" y="345" width="14" height="14" rx="3" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="152" y="356" class="s">表</text>
  <rect x="188" y="345" width="14" height="14" rx="3" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="208" y="356" class="s">エラーメッセージ</text>
  <rect x="328" y="345" width="14" height="14" rx="3" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="348" y="356" class="s">BASIC の処理</text>
  <rect x="447.6" y="345" width="14" height="14" rx="3" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="467.6" y="356" class="s">診断メニュー、拡張の処理</text>
  <text x="40" y="384" class="s">8.3 と 8.5 は同じ長さ。8.4 は 339D9h で終わる。色の区切りはおおよそ</text>
</svg>
