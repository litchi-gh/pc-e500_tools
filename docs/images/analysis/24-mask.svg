<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 318" width="980" height="318" role="img" aria-labelledby="t d">
  <title id="t">アドレスを伏せて比べる</title>
  <desc id="d">左に 3.2、中央に 8.5、右にアドレスを伏せた結果を並べ、伏せれば同じ列になることを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="317" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">アドレスを伏せて比べる</text>
  <text x="24" y="55" class="sub">例: FFFD8h のジャンプ先の先頭 5 命令（3.2 と 8.5）。アドレスは違っても命令の列は同じ</text>
  <rect x="40" y="84" width="280" height="170" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="180" y="106" class="b" text-anchor="middle">3.2（F9D31h）</text>
  <text x="64" y="134" class="m" xml:space="preserve">CALL 9DEEh</text>
  <text x="64" y="160" class="m" xml:space="preserve">MV   X,[BFE03h]</text>
  <text x="64" y="186" class="m" xml:space="preserve">MV   Y,[BFE06h]</text>
  <text x="64" y="212" class="m" xml:space="preserve">CALL 9D57h</text>
  <text x="64" y="238" class="m" xml:space="preserve">JP   A24Eh</text>
  <rect x="350" y="84" width="280" height="170" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="490" y="106" class="b" text-anchor="middle">8.5（F96C8h）</text>
  <text x="374" y="134" class="m" xml:space="preserve">CALL 9785h</text>
  <text x="374" y="160" class="m" xml:space="preserve">MV   X,[BFE03h]</text>
  <text x="374" y="186" class="m" xml:space="preserve">MV   Y,[BFE06h]</text>
  <text x="374" y="212" class="m" xml:space="preserve">CALL 96EEh</text>
  <text x="374" y="238" class="m" xml:space="preserve">JP   9BE5h</text>
  <rect x="660" y="84" width="280" height="170" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="800" y="106" class="b" text-anchor="middle">アドレスを伏せた列</text>
  <text x="684" y="134" class="m" xml:space="preserve">CALL ＊</text>
  <text x="684" y="160" class="m" xml:space="preserve">MV   X,[BFE03h]</text>
  <text x="684" y="186" class="m" xml:space="preserve">MV   Y,[BFE06h]</text>
  <text x="684" y="212" class="m" xml:space="preserve">CALL ＊</text>
  <text x="684" y="238" class="m" xml:space="preserve">JP   ＊</text>
  <polyline points="322,170 346,170" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <polyline points="632,170 656,170" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="40" y="284" class="s">RAM のアドレス（BFE03h など）はバージョンが変わっても動かないので伏せない。ROM の中のジャンプ先だけを伏せる</text>
</svg>
