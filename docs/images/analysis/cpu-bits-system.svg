<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="t d">
  <title id="t">システムのレジスタのビット</title>
  <desc id="d">SCR、LCC、SSR、AMC のビットの割り当てを並べた図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C0392B"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="499" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">システムのレジスタのビット</text>
  <text x="24" y="55" class="sub" xml:space="preserve">上の数字がビット番号。灰色は使わないビット</text>
  <text x="24" y="120" class="b" xml:space="preserve">SCR</text>
  <text x="24" y="138" class="s" xml:space="preserve">FDh  読み書き</text>
  <rect x="156" y="100" width="100" height="44" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="206" y="95" class="ms" xml:space="preserve" text-anchor="middle">7</text>
  <text x="206" y="120" class="mb" xml:space="preserve" text-anchor="middle">ISE</text>
  <text x="206" y="137" class="s" xml:space="preserve" text-anchor="middle">IRQ で復帰</text>
  <rect x="256" y="100" width="300" height="44" rx="2" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="306" y="95" class="ms" xml:space="preserve" text-anchor="middle">6</text>
  <text x="406" y="95" class="ms" xml:space="preserve" text-anchor="middle">5</text>
  <text x="506" y="95" class="ms" xml:space="preserve" text-anchor="middle">4</text>
  <text x="406" y="120" class="mb" xml:space="preserve" text-anchor="middle">BZ2 BZ1 BZ0</text>
  <text x="406" y="137" class="s" xml:space="preserve" text-anchor="middle">CO と CI の働き</text>
  <rect x="556" y="100" width="100" height="44" rx="2" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="606" y="95" class="ms" xml:space="preserve" text-anchor="middle">3</text>
  <text x="606" y="120" class="mb" xml:space="preserve" text-anchor="middle">VDDC</text>
  <text x="606" y="137" class="s" xml:space="preserve" text-anchor="middle">VDD のピン</text>
  <rect x="656" y="100" width="100" height="44" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="706" y="95" class="ms" xml:space="preserve" text-anchor="middle">2</text>
  <text x="706" y="120" class="mb" xml:space="preserve" text-anchor="middle">STS</text>
  <text x="706" y="137" class="s" xml:space="preserve" text-anchor="middle">サブの周期</text>
  <rect x="756" y="100" width="100" height="44" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="806" y="95" class="ms" xml:space="preserve" text-anchor="middle">1</text>
  <text x="806" y="120" class="mb" xml:space="preserve" text-anchor="middle">MTS</text>
  <text x="806" y="137" class="s" xml:space="preserve" text-anchor="middle">主の周期</text>
  <rect x="856" y="100" width="100" height="44" rx="2" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="906" y="95" class="ms" xml:space="preserve" text-anchor="middle">0</text>
  <text x="906" y="120" class="mb" xml:space="preserve" text-anchor="middle">DISC</text>
  <text x="906" y="137" class="s" xml:space="preserve" text-anchor="middle">表示 ON/OFF</text>
  <text x="24" y="210" class="b" xml:space="preserve">LCC</text>
  <text x="24" y="228" class="s" xml:space="preserve">FEh  読み書き</text>
  <rect x="156" y="190" width="500" height="44" rx="2" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="206" y="185" class="ms" xml:space="preserve" text-anchor="middle">7</text>
  <text x="306" y="185" class="ms" xml:space="preserve" text-anchor="middle">6</text>
  <text x="406" y="185" class="ms" xml:space="preserve" text-anchor="middle">5</text>
  <text x="506" y="185" class="ms" xml:space="preserve" text-anchor="middle">4</text>
  <text x="606" y="185" class="ms" xml:space="preserve" text-anchor="middle">3</text>
  <text x="406" y="210" class="mb" xml:space="preserve" text-anchor="middle">LCC4 〜 LCC0</text>
  <text x="406" y="227" class="s" xml:space="preserve" text-anchor="middle">コントラスト 0〜31</text>
  <rect x="656" y="190" width="100" height="44" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="706" y="185" class="ms" xml:space="preserve" text-anchor="middle">2</text>
  <text x="706" y="210" class="mb" xml:space="preserve" text-anchor="middle">KSD</text>
  <text x="706" y="227" class="s" xml:space="preserve" text-anchor="middle">全 KO を Low</text>
  <rect x="756" y="190" width="100" height="44" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="806" y="185" class="ms" xml:space="preserve" text-anchor="middle">1</text>
  <text x="806" y="210" class="mb" xml:space="preserve" text-anchor="middle">STCL</text>
  <text x="806" y="227" class="s" xml:space="preserve" text-anchor="middle">TCL でサブ</text>
  <rect x="856" y="190" width="100" height="44" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="906" y="185" class="ms" xml:space="preserve" text-anchor="middle">0</text>
  <text x="906" y="210" class="mb" xml:space="preserve" text-anchor="middle">MTCL</text>
  <text x="906" y="227" class="s" xml:space="preserve" text-anchor="middle">TCL で主</text>
  <text x="24" y="300" class="b" xml:space="preserve">SSR</text>
  <text x="24" y="318" class="s" xml:space="preserve">FFh  読むだけ</text>
  <rect x="156" y="280" width="400" height="44" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="206" y="275" class="ms" xml:space="preserve" text-anchor="middle">7</text>
  <text x="306" y="275" class="ms" xml:space="preserve" text-anchor="middle">6</text>
  <text x="406" y="275" class="ms" xml:space="preserve" text-anchor="middle">5</text>
  <text x="506" y="275" class="ms" xml:space="preserve" text-anchor="middle">4</text>
  <text x="356" y="307" class="mb" xml:space="preserve" text-anchor="middle"></text>
  <rect x="556" y="280" width="100" height="44" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="606" y="275" class="ms" xml:space="preserve" text-anchor="middle">3</text>
  <text x="606" y="300" class="mb" xml:space="preserve" text-anchor="middle">ONK</text>
  <text x="606" y="317" class="s" xml:space="preserve" text-anchor="middle">ON ピン</text>
  <rect x="656" y="280" width="100" height="44" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="706" y="275" class="ms" xml:space="preserve" text-anchor="middle">2</text>
  <text x="706" y="300" class="mb" xml:space="preserve" text-anchor="middle">RSF</text>
  <text x="706" y="317" class="s" xml:space="preserve" text-anchor="middle">HALT、OFF 後</text>
  <rect x="756" y="280" width="100" height="44" rx="2" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="806" y="275" class="ms" xml:space="preserve" text-anchor="middle">1</text>
  <text x="806" y="300" class="mb" xml:space="preserve" text-anchor="middle">CI</text>
  <text x="806" y="317" class="s" xml:space="preserve" text-anchor="middle">CI ピン</text>
  <rect x="856" y="280" width="100" height="44" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="906" y="275" class="ms" xml:space="preserve" text-anchor="middle">0</text>
  <text x="906" y="300" class="mb" xml:space="preserve" text-anchor="middle">TEST</text>
  <text x="906" y="317" class="s" xml:space="preserve" text-anchor="middle">TEST ピン</text>
  <text x="24" y="390" class="b" xml:space="preserve">AMC</text>
  <text x="24" y="408" class="s" xml:space="preserve">EFh  読み書き</text>
  <rect x="156" y="370" width="100" height="44" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1.2"/>
  <text x="206" y="365" class="ms" xml:space="preserve" text-anchor="middle">7</text>
  <text x="206" y="390" class="mb" xml:space="preserve" text-anchor="middle">AME</text>
  <text x="206" y="407" class="s" xml:space="preserve" text-anchor="middle">有効</text>
  <rect x="256" y="370" width="100" height="44" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="306" y="365" class="ms" xml:space="preserve" text-anchor="middle">6</text>
  <text x="306" y="397" class="mb" xml:space="preserve" text-anchor="middle"></text>
  <rect x="356" y="370" width="600" height="44" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="406" y="365" class="ms" xml:space="preserve" text-anchor="middle">5</text>
  <text x="506" y="365" class="ms" xml:space="preserve" text-anchor="middle">4</text>
  <text x="606" y="365" class="ms" xml:space="preserve" text-anchor="middle">3</text>
  <text x="706" y="365" class="ms" xml:space="preserve" text-anchor="middle">2</text>
  <text x="806" y="365" class="ms" xml:space="preserve" text-anchor="middle">1</text>
  <text x="906" y="365" class="ms" xml:space="preserve" text-anchor="middle">0</text>
  <text x="656" y="390" class="mb" xml:space="preserve" text-anchor="middle">AM5 〜 AM0</text>
  <text x="656" y="407" class="s" xml:space="preserve" text-anchor="middle">CE0 側の容量（000000 = 2 KB 〜 111111 = 128 KB）</text>
  <text x="24" y="452" xml:space="preserve" style="fill:#1F2933">例: SCR = 02h なら 0 000 0 0 1 0 で、CO は Low、CI は入力しない、MTS = 1（長い方）、表示 OFF。</text>
  <text x="24" y="478" xml:space="preserve" style="fill:#1F2933">例: AMC = 8Fh なら 1 0 001111 で、有効、32 KB。</text>
</svg>
