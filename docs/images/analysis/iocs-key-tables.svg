<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="t d">
  <title id="t">1 つのキーから文字になるまで</title>
  <desc id="d">行列コードから、SHIFT と CTRL の状態によって 1 バイトの表と 2 バイトの表を引く流れの図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="299" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">1 つのキーから文字になるまで</text>
  <text x="24" y="55" class="sub">行列コードが 6 枚の表の添字になる。1 枚は 62h バイト</text>
  <rect x="40" y="100" width="180" height="60" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="130" y="126.04" class="b" text-anchor="middle">キー A を押す</text>
  <text x="130" y="144.18" class="m" xml:space="preserve" text-anchor="middle">行列コード 31h</text>
  <rect x="300" y="84" width="130" height="48" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="365" y="113.04" class="b" text-anchor="middle">そのまま</text>
  <polyline points="220,130 298,108" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="450" y="84" width="300" height="48" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="600" y="104.18" class="m" xml:space="preserve" text-anchor="middle">[BFC2Dh] + 31h → 41h（A）</text>
  <text x="600" y="121.32" class="s" text-anchor="middle">00h なら [BFC30h] + 31h</text>
  <polyline points="430,108 448,108" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="780" y="84" width="160" height="48" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="860" y="104.18" class="m" xml:space="preserve" text-anchor="middle">A = 41h（A）</text>
  <text x="860" y="121.32" class="s" text-anchor="middle">2 枚目なら A = 00h、B</text>
  <polyline points="750,108 778,108" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="300" y="148" width="130" height="48" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="365" y="177.04" class="b" text-anchor="middle">SHIFT と一緒</text>
  <polyline points="220,130 298,172" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="450" y="148" width="300" height="48" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="600" y="168.18" class="m" xml:space="preserve" text-anchor="middle">[BFC33h] + 31h → 5Bh（[）</text>
  <text x="600" y="185.32" class="s" text-anchor="middle">00h なら [BFC36h] + 31h</text>
  <polyline points="430,172 448,172" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="780" y="148" width="160" height="48" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="860" y="168.18" class="m" xml:space="preserve" text-anchor="middle">A = 5Bh（[）</text>
  <text x="860" y="185.32" class="s" text-anchor="middle">2 枚目なら A = 00h、B</text>
  <polyline points="750,172 778,172" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="300" y="212" width="130" height="48" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="365" y="241.04" class="b" text-anchor="middle">CTRL と一緒</text>
  <polyline points="220,130 298,236" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="450" y="212" width="300" height="48" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="600" y="232.18" class="m" xml:space="preserve" text-anchor="middle">[BFC39h] + 31h → 01h</text>
  <text x="600" y="249.32" class="s" text-anchor="middle">00h なら [BFC3Ch] + 31h</text>
  <polyline points="430,236 448,236" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
  <rect x="780" y="212" width="160" height="48" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="860" y="232.18" class="m" xml:space="preserve" text-anchor="middle">A = 01h</text>
  <text x="860" y="249.32" class="s" text-anchor="middle">2 枚目なら A = 00h、B</text>
  <polyline points="750,236 778,236" fill="none" stroke="#52606D" stroke-width="1.4" marker-end="url(#a52606D)"/>
</svg>
