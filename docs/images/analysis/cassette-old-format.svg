<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">CLOAD @ で読むテープの信号</title>
  <desc id="d">旧形式の 1 と 0 の波の数、4 ビットの単位、ヘッダと本体の並びの図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" text-anchor="start" xml:space="preserve">CLOAD @ で読むテープの信号</text>
  <text x="24" y="56" class="s" text-anchor="start" xml:space="preserve">1 ビットの時間はどれも約 2 ms。波の数の違いで 0 と 1 を表す</text>
  <text x="40" y="96" class="b" text-anchor="start" xml:space="preserve">1</text>
  <path d="M 70 102 V 78 H 86.2 V 102 H 102.5 V 78 H 118.8 V 102 H 135.0 V 78 H 151.2 V 102 H 167.5 V 78 H 183.8 V 102 H 200.0 V 78 H 216.2 V 102 H 232.5 V 78 H 248.8 V 102 H 265.0 V 78 H 281.2 V 102 H 297.5 V 78 H 313.8 V 102 H 330.0" fill="none" stroke="#2F6DB5" stroke-width="1.8"/>
  <text x="350" y="96" class="" text-anchor="start" xml:space="preserve">4 kHz の波 8 個</text>
  <text x="40" y="146" class="b" text-anchor="start" xml:space="preserve">0</text>
  <path d="M 70 152 V 128 H 102.5 V 152 H 135.0 V 128 H 167.5 V 152 H 200.0 V 128 H 232.5 V 152 H 265.0 V 128 H 297.5 V 152 H 330.0" fill="none" stroke="#2F6DB5" stroke-width="1.8"/>
  <text x="350" y="146" class="" text-anchor="start" xml:space="preserve">2 kHz の波 4 個</text>
  <text x="560" y="96" class="s" text-anchor="start" xml:space="preserve">読む側は 1 ビットの時間に</text>
  <text x="560" y="114" class="s" text-anchor="start" xml:space="preserve">立ち上がりを数え、6 以上なら 1</text>
  <text x="40" y="196" class="b" text-anchor="start" xml:space="preserve">4 ビットの単位</text>
  <rect x="40" y="206" width="80" height="38" rx="3" fill="#FDECEA" stroke="#C0392B" stroke-width="1.3"/>
  <text x="80.0" y="230.0" class="m" text-anchor="middle" xml:space="preserve">開始 0</text>
  <rect x="124" y="206" width="80" height="38" rx="3" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="164.0" y="230.0" class="m" text-anchor="middle" xml:space="preserve">b0</text>
  <rect x="208" y="206" width="80" height="38" rx="3" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="248.0" y="230.0" class="m" text-anchor="middle" xml:space="preserve">b1</text>
  <rect x="292" y="206" width="80" height="38" rx="3" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="332.0" y="230.0" class="m" text-anchor="middle" xml:space="preserve">b2</text>
  <rect x="376" y="206" width="80" height="38" rx="3" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="416.0" y="230.0" class="m" text-anchor="middle" xml:space="preserve">b3</text>
  <rect x="460" y="206" width="110" height="38" rx="3" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="515.0" y="230.0" class="m" text-anchor="middle" xml:space="preserve">1 を数個</text>
  <text x="584" y="230" class="s" text-anchor="start" xml:space="preserve">下位のビットから。1 バイトは 2 単位</text>
  <text x="40" y="288" class="b" text-anchor="start" xml:space="preserve">ファイル</text>
  <rect x="40" y="300" width="95" height="56" rx="3" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="87.5" y="323.5" class="b" text-anchor="middle" xml:space="preserve">1 の列</text>
  <text x="87.5" y="342.5" class="s" text-anchor="middle" xml:space="preserve">搬送音</text>
  <rect x="137" y="300" width="60" height="56" rx="3" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="167.0" y="323.5" class="b" text-anchor="middle" xml:space="preserve">7</text>
  <text x="167.0" y="342.5" class="s" text-anchor="middle" xml:space="preserve">単位 1 個</text>
  <rect x="199" y="300" width="60" height="56" rx="3" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="229.0" y="323.5" class="b" text-anchor="middle" xml:space="preserve">種別</text>
  <text x="229.0" y="342.5" class="s" text-anchor="middle" xml:space="preserve">0〜3</text>
  <rect x="261" y="300" width="165" height="56" rx="3" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="343.5" y="323.5" class="b" text-anchor="middle" xml:space="preserve">名前</text>
  <text x="343.5" y="342.5" class="s" text-anchor="middle" xml:space="preserve">F5h + 7 文字、逆順</text>
  <rect x="428" y="300" width="80" height="56" rx="3" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.3"/>
  <text x="468.0" y="323.5" class="b" text-anchor="middle" xml:space="preserve">検査値</text>
  <text x="468.0" y="342.5" class="s" text-anchor="middle" xml:space="preserve">1 バイト</text>
  <rect x="510" y="300" width="75" height="56" rx="3" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="547.5" y="333.0" class="b" text-anchor="middle" xml:space="preserve">1 の列</text>
  <rect x="587" y="300" width="200" height="56" rx="3" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="687.0" y="323.5" class="b" text-anchor="middle" xml:space="preserve">本体</text>
  <text x="687.0" y="342.5" class="s" text-anchor="middle" xml:space="preserve">120 バイトごとに検査値</text>
  <rect x="789" y="300" width="75" height="56" rx="3" fill="#FDECEA" stroke="#C0392B" stroke-width="1.3"/>
  <text x="826.5" y="323.5" class="b" text-anchor="middle" xml:space="preserve">FF FF</text>
  <text x="826.5" y="342.5" class="s" text-anchor="middle" xml:space="preserve">終わり</text>
  <rect x="866" y="300" width="75" height="56" rx="3" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.3"/>
  <text x="903.5" y="333.0" class="b" text-anchor="middle" xml:space="preserve">検査値</text>
  <text x="40" y="390" class="s" text-anchor="start" xml:space="preserve">種別 0、1 は 1 バイトの中間コード（C0h〜E6h など）、2、3 は FEh で始まる 2 バイトの中間コード。奇数の種別にはパスワード 8 バイトが付く。</text>
  <text x="40" y="412" class="s" text-anchor="start" xml:space="preserve">検査値は 4 ビットずつ足し合わせた 8 ビット。本体の検査値は、区切りのたびに 0 から数え直す。</text>
  <text x="40" y="434" class="s" text-anchor="start" xml:space="preserve">自分で作ったこの形のテープが、ROM 7.2 と 8.5 で読み込めた（実験）。</text>
</svg>
