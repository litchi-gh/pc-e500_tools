<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">改訂 8 で拡張 ROM へ移った表</title>
  <desc id="d">7.5 の本体 ROM にあった文字の形と記号、キーの対応表が、8.5 では拡張 ROM のアドレスへ移ったことを矢印で示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">改訂 8 で拡張 ROM へ移った表</text>
  <text x="24" y="55" class="sub">左が 7.5、右が 8.5。本体 ROM にあった文字の形、記号、キーの対応表の参照先が変わった</text>
  <rect x="40" y="76" width="300" height="30" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="190" y="96" class="b" text-anchor="middle">7.5　本体 ROM</text>
  <rect x="640" y="76" width="300" height="30" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="790" y="96" class="b" text-anchor="middle">8.5　拡張 ROM</text>
  <rect x="40" y="122" width="300" height="38" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="54" y="146" class="m" xml:space="preserve">F21A5h</text>
  <rect x="640" y="122" width="300" height="38" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="654" y="146" class="m" xml:space="preserve">30000h</text>
  <polyline points="342,141 638,141" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="490" y="134" class="lbl" text-anchor="middle">フォント 256 文字</text>
  <rect x="40" y="168" width="300" height="38" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="54" y="192" class="m" xml:space="preserve">F2865h</text>
  <rect x="640" y="168" width="300" height="38" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="654" y="192" class="m" xml:space="preserve">306C0h</text>
  <polyline points="342,187 638,187" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="490" y="180" class="lbl" text-anchor="middle">記号のドット 36 字（BFC93h を一時的に差し替えて使う）</text>
  <rect x="40" y="214" width="300" height="38" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="54" y="238" class="m" xml:space="preserve">F293Dh</text>
  <rect x="640" y="214" width="300" height="38" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="654" y="238" class="m" xml:space="preserve">30798h</text>
  <polyline points="342,233 638,233" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="490" y="226" class="lbl" text-anchor="middle">代替のドット列（BFC84h が指す）</text>
  <rect x="40" y="260" width="300" height="38" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="54" y="284" class="m" xml:space="preserve">F3472h〜F3717h</text>
  <rect x="640" y="260" width="300" height="38" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="654" y="284" class="m" xml:space="preserve">307A4h〜30A49h</text>
  <polyline points="342,279 638,279" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="490" y="272" class="lbl" text-anchor="middle">キーの対応表（98 バイト × 6）と位置の表（90 バイト）</text>
  <text x="40" y="318" class="s">字形は変わっていない。空いた分だけ、8.x の本体 ROM の F セグメントの末尾に使っていない領域がある（23 章 §23.8）</text>
</svg>
