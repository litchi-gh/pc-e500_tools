<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392" width="980" height="392" role="img" aria-labelledby="t d">
  <title id="t">4 つの公開エントリが行うこと</title>
  <desc id="d">FFFD8h、FFFDCh、FFFE4h、FFFE8h のエントリが、どの値を受け取り、どの処理へ進むかを 4 段で示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="391" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">4 つの公開エントリが行うこと</text>
  <text x="24" y="55" class="sub">FFFDCh と FFFD8h のジャンプ先は、アドレスのほかは 13 本とも同じ命令（ROM を逆アセンブルして確かめた）</text>
  <rect x="24" y="78" width="932" height="66" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="44" y="108" class="m" xml:space="preserve">FFFE8h</text>
  <text x="44" y="128" class="b">IOCS</text>
  <rect x="220" y="87" width="300" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="370" y="107.5" class="s" text-anchor="middle">(CX) = デバイス番号、IL = コマンド</text>
  <text x="370" y="124.5" class="s" text-anchor="middle">IOCS ヘッダの連結からデバイスを探す</text>
  <rect x="590" y="87" width="346" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="763" y="107.5" class="s" text-anchor="middle">デバイスの処理へ</text>
  <text x="763" y="124.5" class="s" text-anchor="middle">戻りは RETF、C = 1 は失敗</text>
  <polyline points="524,111 586,111" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="24" y="154" width="932" height="66" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="44" y="184" class="m" xml:space="preserve">FFFE4h</text>
  <text x="44" y="204" class="b">FCS</text>
  <rect x="220" y="163" width="300" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="370" y="183.5" class="s" text-anchor="middle">IL = ファンクション番号</text>
  <text x="370" y="200.5" class="s" text-anchor="middle">00h〜11h の 18 個の表を引く（2.1 は 17 個）</text>
  <rect x="590" y="163" width="346" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="763" y="192" class="s" text-anchor="middle">ファイルの処理へ</text>
  <polyline points="524,187 586,187" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="24" y="230" width="932" height="66" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="44" y="260" class="m" xml:space="preserve">FFFDCh</text>
  <text x="44" y="280" class="b">BASIC 用 IOCS</text>
  <rect x="220" y="239" width="300" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="370" y="259.5" class="s" text-anchor="middle">[BFE00h] 2 バイト → (CX)</text>
  <text x="370" y="276.5" class="s" text-anchor="middle">[BFE02h] → IL</text>
  <rect x="590" y="239" width="346" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="763" y="259.5" class="s" text-anchor="middle">FFFE8h（IOCS）を呼んで RETF</text>
  <text x="763" y="276.5" class="s" text-anchor="middle">BASIC の CALL から IOCS を使う口</text>
  <polyline points="524,263 586,263" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="24" y="306" width="932" height="66" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="44" y="336" class="m" xml:space="preserve">FFFD8h</text>
  <text x="44" y="356" class="b">作業域の再構成</text>
  <rect x="220" y="315" width="300" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="370" y="335.5" class="s" text-anchor="middle">[BFE03h] 3 バイト → X</text>
  <text x="370" y="352.5" class="s" text-anchor="middle">[BFE06h] 3 バイト → Y</text>
  <rect x="590" y="315" width="346" height="48" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="763" y="335.5" class="s" text-anchor="middle">ブロックの空きを詰め、SYSTM: 42h で作り直す</text>
  <text x="763" y="352.5" class="s" text-anchor="middle">リセット処理の途中へ飛ぶ（戻らない）</text>
  <polyline points="524,339 586,339" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
</svg>
