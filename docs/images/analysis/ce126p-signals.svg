<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">CE-126P との 5 本の線</title>
  <desc id="d">BUSY、DOUT、XOUT、ACK、DIN の 5 本の線の向きと、本体の内部 RAM のビット、11 ピンの番号。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a2F6DB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="a2F855A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">CE-126P との 5 本の線</text>
  <text x="24" y="55" class="sub">左が本体、右が CE-126P。番号は 11 ピンの番号（SharpManager の表）</text>
  <rect x="24" y="80" width="300" height="230" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="44" y="106" class="b">本体（内部 RAM のビット）</text>
  <rect x="690" y="80" width="266" height="230" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="710" y="106" class="b">CE-126P</text>
  <rect x="44" y="124" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="139" y="141.96" class="ms" xml:space="preserve" text-anchor="middle">F3h（EOL）bit6</text>
  <rect x="252" y="124" width="56" height="28" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="280" y="142.32" class="s" text-anchor="middle">4 番</text>
  <text x="507" y="136" class="b" text-anchor="middle">BUSY</text>
  <polyline points="330,142 684,142" fill="none" stroke="#2F6DB5" stroke-width="2" marker-end="url(#a2F6DB5)"/>
  <text x="710" y="143" class="s">本体の合図</text>
  <rect x="44" y="161" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="139" y="178.96" class="ms" xml:space="preserve" text-anchor="middle">F4h（EOH）bit2</text>
  <rect x="252" y="161" width="56" height="28" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="280" y="179.32" class="s" text-anchor="middle">5 番</text>
  <text x="507" y="173" class="b" text-anchor="middle">DOUT</text>
  <polyline points="330,179 684,179" fill="none" stroke="#2F6DB5" stroke-width="2" marker-end="url(#a2F6DB5)"/>
  <text x="710" y="180" class="s">ビットの値</text>
  <rect x="44" y="198" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="139" y="215.96" class="ms" xml:space="preserve" text-anchor="middle">FDh（SCR）bit4〜6</text>
  <rect x="252" y="198" width="56" height="28" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="280" y="216.32" class="s" text-anchor="middle">7 番</text>
  <text x="507" y="210" class="b" text-anchor="middle">XOUT</text>
  <polyline points="330,216 684,216" fill="none" stroke="#2F6DB5" stroke-width="2" marker-end="url(#a2F6DB5)"/>
  <text x="710" y="217" class="s">High ならデバイスコード</text>
  <rect x="44" y="235" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="139" y="252.96" class="ms" xml:space="preserve" text-anchor="middle">F5h（EIL）bit7</text>
  <rect x="252" y="235" width="56" height="28" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="280" y="253.32" class="s" text-anchor="middle">9 番</text>
  <text x="507" y="247" class="b" text-anchor="middle">ACK</text>
  <polyline points="684,253 330,253" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#a2F855A)"/>
  <text x="710" y="254" class="s">返事</text>
  <rect x="44" y="272" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="139" y="289.96" class="ms" xml:space="preserve" text-anchor="middle">F6h（EIH）bit7</text>
  <rect x="252" y="272" width="56" height="28" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="280" y="290.32" class="s" text-anchor="middle">8 番</text>
  <text x="507" y="284" class="b" text-anchor="middle">DIN</text>
  <polyline points="684,290 330,290" fill="none" stroke="#2F855A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2F855A)"/>
  <text x="710" y="291" class="s">動かさない</text>
</svg>
