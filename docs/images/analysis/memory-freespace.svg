<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">空き領域を持つブロックの移り変わり</title>
  <desc id="d">RUN モードでは DATA が空き領域を持ち、PRO モードで行を打つ間は TEXT が持つことを、3 つの場面の帯で示す図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">空き領域を持つブロックの移り変わり</text>
  <text x="24" y="55" class="sub">32 KB の S1:。ROM 7.2 の実験。帯の幅は比率どおりではない</text>
  <text x="40" y="112" class="b">RUN モード</text>
  <text x="40" y="132" class="s">PRO に切り替えた直後も同じ</text>
  <rect x="230" y="90" width="90" height="52" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="275" y="121" class="m" xml:space="preserve" text-anchor="middle">DATA</text>
  <rect x="320" y="90" width="330" height="52" rx="0" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="485" y="121" class="s" text-anchor="middle">空き領域</text>
  <rect x="650" y="90" width="90" height="52" rx="0" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="695" y="121" class="m" xml:space="preserve" text-anchor="middle">TEXT</text>
  <rect x="740" y="90" width="150" height="52" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="815" y="121" class="m" xml:space="preserve" text-anchor="middle">FUNCKEY, AER</text>
  <polyline points="230,144 230,152 650,152 650,144" fill="none" stroke="#7B8794" stroke-width="1.2"/>
  <text x="440" y="168" class="s" text-anchor="middle">DATA の +11（B8018h から TEXT の先頭まで）= 713Ch</text>
  <text x="40" y="214" class="b">PRO モードで行を打つ</text>
  <text x="40" y="234" class="s">PRO モードの NEW も同じ</text>
  <rect x="230" y="192" width="90" height="52" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="275" y="223" class="m" xml:space="preserve" text-anchor="middle">DATA</text>
  <rect x="320" y="192" width="90" height="52" rx="0" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="365" y="223" class="m" xml:space="preserve" text-anchor="middle">TEXT</text>
  <rect x="410" y="192" width="330" height="52" rx="0" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="575" y="223" class="s" text-anchor="middle">空き領域</text>
  <rect x="740" y="192" width="150" height="52" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="815" y="223" class="m" xml:space="preserve" text-anchor="middle">FUNCKEY, AER</text>
  <polyline points="320,246 320,254 740,254 740,246" fill="none" stroke="#7B8794" stroke-width="1.2"/>
  <text x="530" y="270" class="s" text-anchor="middle">TEXT の +11（B819Ch から FUNCKEY の先頭まで）= 6FEEh</text>
  <text x="40" y="316" class="b">RUN モードに戻す</text>
  <text x="40" y="336" class="s">LOAD のあとも同じ</text>
  <rect x="230" y="294" width="90" height="52" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="275" y="325" class="m" xml:space="preserve" text-anchor="middle">DATA</text>
  <rect x="320" y="294" width="290" height="52" rx="0" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="465" y="325" class="s" text-anchor="middle">空き領域</text>
  <rect x="610" y="294" width="130" height="52" rx="0" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="675" y="325" class="m" xml:space="preserve" text-anchor="middle">TEXT</text>
  <rect x="740" y="294" width="150" height="52" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="815" y="325" class="m" xml:space="preserve" text-anchor="middle">FUNCKEY, AER</text>
  <polyline points="230,348 230,356 610,356 610,348" fill="none" stroke="#7B8794" stroke-width="1.2"/>
  <text x="420" y="372" class="s" text-anchor="middle">DATA の +11 は、TEXT の分だけ短くなる</text>
  <text x="230" y="84" class="ms" xml:space="preserve">B8018h</text>
  <text x="650" y="84" class="ms" xml:space="preserve">BF154h</text>
  <text x="740" y="84" class="ms" xml:space="preserve">BF18Ah</text>
  <text x="230" y="186" class="ms" xml:space="preserve">B8018h</text>
  <text x="320" y="186" class="ms" xml:space="preserve">B819Ch</text>
  <text x="740" y="186" class="ms" xml:space="preserve">BF18Ah</text>
  <text x="230" y="288" class="ms" xml:space="preserve">B8018h</text>
  <text x="740" y="288" class="ms" xml:space="preserve">BF18Ah</text>
  <rect x="40" y="394" width="900" height="56" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="490" y="418" class="b" text-anchor="middle">空き領域を持つブロックは、いつも 1 つだけ</text>
  <text x="490" y="436" class="s" text-anchor="middle">行を打つ間は TEXT が空きを全部持つので、行が増えても後ろのブロックを動かさずに済む</text>
</svg>
