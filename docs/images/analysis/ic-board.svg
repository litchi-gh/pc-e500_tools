  <text x="226" y="365" class="ms" xml:space="preserve" text-anchor="middle">CE5</text>
  <path d="M304 428L304 409" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M416 428L416 409" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="312" y="423" class="ms" xml:space="preserve">φ1 φ2 CL FRM M</text>
