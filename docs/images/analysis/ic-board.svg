  <text x="786" y="423" class="ms" xml:space="preserve">φ1 φ2 CL FRM M</text>
  <path d="M834 472L834 499" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="840" y="490" class="ms" xml:space="preserve">X1〜X64</text>
  <path d="M940 372 L950 372 L950 525 L942 525" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="936" y="490" class="ms" xml:space="preserve" text-anchor="end">Y1〜Y64</text>
  <rect x="24" y="586" width="932" height="34" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="36" y="607" class="s" xml:space="preserve" style="fill:#1F2933">HD61203 のタイミング信号が 2 個の HD61202 へ入り、表示の歩調を合わせます。HD61202 1 個に 512 バイトの表示 RAM があります。</text>
</svg>
