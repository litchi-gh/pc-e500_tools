<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 636" width="980" height="636" role="img" aria-labelledby="t d">
  <title id="t">基板の IC とつながり</title>
  <desc id="d">PC-E500 と、PC-E500S、PC-E650、PC-U6000 の共通基板について、CPU、ROM、RAM、LCD の IC のつながりを並べた図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C0392B"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="635" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">基板の IC とつながり</text>
  <text x="24" y="55" class="sub" xml:space="preserve">IC 番号は基板の表記。矢印はチップセレクトとバス</text>
  <rect x="24" y="74" width="458" height="500" rx="12" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.2"/>
  <text x="40" y="100" class="b" xml:space="preserve">PC-E500</text>
  <rect x="40" y="230" width="120" height="200" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="100" y="318" class="b" xml:space="preserve" text-anchor="middle">CPU  IC1</text>
  <text x="100" y="335" class="s" xml:space="preserve" text-anchor="middle">SC62015B01</text>
  <text x="100" y="352" class="s" xml:space="preserve" text-anchor="middle">100 ピン</text>
  <rect x="184" y="120" width="14" height="430" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2"/>
  <text x="191" y="112" class="s" xml:space="preserve" text-anchor="middle">バス</text>
