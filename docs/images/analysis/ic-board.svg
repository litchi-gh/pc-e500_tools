  <text x="514" y="100" class="b" xml:space="preserve">PC-E500S / PC-E650 / PC-U6000</text>
  <rect x="514" y="230" width="120" height="200" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="574" y="318" class="b" xml:space="preserve" text-anchor="middle">CPU  IC1</text>
  <text x="574" y="335" class="s" xml:space="preserve" text-anchor="middle">SC62015C01</text>
  <text x="574" y="352" class="s" xml:space="preserve" text-anchor="middle">100 ピン</text>
  <rect x="658" y="120" width="14" height="430" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2"/>
  <text x="665" y="112" class="s" xml:space="preserve" text-anchor="middle">バス</text>
  <path d="M634 330L657 330" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="728" y="120" width="212" height="72" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="834" y="144" class="b" xml:space="preserve" text-anchor="middle">ROM  IC2  LH534HF□</text>
  <text x="834" y="161" class="s" xml:space="preserve" text-anchor="middle">4 Mbit（512 K × 8）</text>
  <text x="834" y="178" class="s" xml:space="preserve" text-anchor="middle">32 ピン</text>
  <rect x="728" y="208" width="212" height="46" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="834" y="227.5" class="b" xml:space="preserve" text-anchor="middle">RAM  IC3  32 KB</text>
  <text x="834" y="244.5" class="s" xml:space="preserve" text-anchor="middle">AT256BF12L</text>
  <rect x="728" y="262" width="212" height="46" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="834" y="281" class="b" xml:space="preserve" text-anchor="middle">RAM  IC11  32 KB</text>
  <text x="834" y="299" class="s" xml:space="preserve" text-anchor="middle">E650、U6000 だけ</text>
  <rect x="728" y="336" width="100" height="72" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="778" y="360" class="b" xml:space="preserve" text-anchor="middle">IC5</text>
  <text x="778" y="377" class="s" xml:space="preserve" text-anchor="middle">HD61202</text>
  <text x="778" y="394" class="s" xml:space="preserve" text-anchor="middle">カラム</text>
  <rect x="840" y="336" width="100" height="72" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="890" y="360" class="b" xml:space="preserve" text-anchor="middle">IC6</text>
  <text x="890" y="377" class="s" xml:space="preserve" text-anchor="middle">HD61202</text>
  <text x="890" y="394" class="s" xml:space="preserve" text-anchor="middle">カラム</text>
  <rect x="728" y="428" width="212" height="44" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="834" y="455" class="b" xml:space="preserve" text-anchor="middle">IC4  HD61203  コモン</text>
  <rect x="728" y="500" width="212" height="50" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2"/>
  <text x="834" y="530" class="b" xml:space="preserve" text-anchor="middle">液晶  LF7766Q（FSTN）</text>
  <path d="M672 156L727 156" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="700" y="149" class="ms" xml:space="preserve" text-anchor="middle">CE2, CE3</text>
  <path d="M672 231L727 231" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="700" y="224" class="ms" xml:space="preserve" text-anchor="middle">CE0</text>
  <path d="M672 372L727 372" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="700" y="365" class="ms" xml:space="preserve" text-anchor="middle">CE5</text>
  <path d="M672 285L727 285" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
