  <rect x="254" y="120" width="212" height="72" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="360" y="144" class="b" xml:space="preserve" text-anchor="middle">ROM  IC2  LH5320X□</text>
  <text x="360" y="161" class="s" xml:space="preserve" text-anchor="middle">2 Mbit（256 KB）</text>
  <text x="360" y="178" class="s" xml:space="preserve" text-anchor="middle">44 ピン QFP</text>
  <rect x="254" y="222" width="212" height="60" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="360" y="248.5" class="b" xml:space="preserve" text-anchor="middle">RAM  IC3  32 KB</text>
  <text x="360" y="265.5" class="s" xml:space="preserve" text-anchor="middle">HM62256LFP-12SLT</text>
  <rect x="254" y="336" width="100" height="72" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="304" y="360" class="b" xml:space="preserve" text-anchor="middle">IC5</text>
