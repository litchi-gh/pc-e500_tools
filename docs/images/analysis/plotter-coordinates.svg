  <text x="296" y="390" class="s" text-anchor="middle">3</text>
  <text x="100" y="188" class="s" text-anchor="end">3</text>
  <polyline points="358,370 358,84.8" fill="none" stroke="#E3E8EE" stroke-width="1"/>
  <polyline points="110,122 444.8,122" fill="none" stroke="#E3E8EE" stroke-width="1"/>
  <text x="358" y="390" class="s" text-anchor="middle">4</text>
  <text x="100" y="126" class="s" text-anchor="end">4</text>
  <polyline points="420,370 420,84.8" fill="none" stroke="#E3E8EE" stroke-width="1"/>
