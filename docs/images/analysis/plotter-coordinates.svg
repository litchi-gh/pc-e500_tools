  <text x="132" y="114" class="ms" xml:space="preserve">(1,4)</text>
  <text x="520" y="92" class="b">送るコマンド（それぞれのあとに CR NUL）</text>
  <rect x="520" y="108" width="170" height="38" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="605" y="131.68" class="m" xml:space="preserve" text-anchor="middle">M1,2</text>
