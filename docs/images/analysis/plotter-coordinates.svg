  <text x="706" y="182" class="s">線の種類 2</text>
  <rect x="520" y="208" width="170" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="605" y="231.68" class="m" xml:space="preserve" text-anchor="middle">ESC 3</text>
  <text x="706" y="232" class="s">色 3（赤）</text>
  <rect x="520" y="258" width="170" height="38" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="605" y="281.68" class="m" xml:space="preserve" text-anchor="middle">D3,2,3,4,1,4,1,2</text>
  <text x="706" y="282" class="s">ペンを下げて 4 辺を描く（実線）</text>
  <rect x="520" y="308" width="170" height="38" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="605" y="331.68" class="m" xml:space="preserve" text-anchor="middle">M3,4</text>
  <text x="706" y="332" class="s">ペンを上げて対角の点へ（点線）</text>
  <text x="520" y="384" class="s">最初の M は、それまでのペンの位置から動く（図では原点から）。</text>
</svg>
