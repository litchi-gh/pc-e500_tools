  <circle cx="296" cy="246" r="4" fill="#C0392B" stroke="none"/>
  <text x="306" y="266" class="ms" xml:space="preserve">(3,2)</text>
  <circle cx="296" cy="122" r="4" fill="#C0392B" stroke="none"/>
  <text x="306" y="116" class="ms" xml:space="preserve">(3,4)</text>
