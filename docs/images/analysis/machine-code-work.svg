  <text x="775" y="284.54" class="b" text-anchor="middle">IOCS 作業域</text>
  <text x="775" y="301.82" class="s" text-anchor="middle">BE9B4h から</text>
  <polyline points="230,281 288,281" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="460,288 688,288" fill="none" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2F6DB5)"/>
  <text x="574" y="282" class="s" text-anchor="middle">1000h だけ下へ</text>
  <rect x="130" y="316" width="100" height="34" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="180" y="337.68" class="m" xml:space="preserve" text-anchor="middle">BFD1Ah</text>
  <polyline points="230,333 288,333" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <text x="296" y="338" class="s">BFC00h（大きさ 0）</text>
  <rect x="690" y="316" width="170" height="66" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="775" y="345.54" class="b" text-anchor="middle">機械語エリア</text>
  <text x="775" y="362.82" class="s" text-anchor="middle">BEC00h〜BFBFFh</text>
  <polyline points="230,346 560,362 688,362" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aC0392B)"/>
  <text x="574" y="354" class="s"></text>
  <rect x="290" y="366" width="170" height="40" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="375" y="390.32" class="s" text-anchor="middle">システム領域 BFC00h〜</text>
  <rect x="690" y="390" width="170" height="40" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="775" y="414.32" class="s" text-anchor="middle">システム領域 BFC00h〜</text>
  <text x="24" y="450" class="s">予約のポインタ（BFCE4h〜BFD0Bh、BFD11h、BFD14h）は省いた。</text>
</svg>
