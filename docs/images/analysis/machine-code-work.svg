  <text x="574" y="178" class="s" text-anchor="middle">1000h だけ下へ</text>
  <rect x="130" y="212" width="100" height="34" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="180" y="233.68" class="m" xml:space="preserve" text-anchor="middle">BFD0Eh</text>
  <rect x="290" y="212" width="170" height="48" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="375" y="232.54" class="b" text-anchor="middle">BASIC 作業域</text>
  <text x="375" y="249.82" class="s" text-anchor="middle">BF858h から</text>
  <rect x="690" y="212" width="170" height="48" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="775" y="232.54" class="b" text-anchor="middle">BASIC 作業域</text>
  <text x="775" y="249.82" class="s" text-anchor="middle">BE858h から</text>
  <polyline points="230,229 288,229" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="460,236 688,236" fill="none" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2F6DB5)"/>
  <text x="574" y="230" class="s" text-anchor="middle">1000h だけ下へ</text>
  <rect x="130" y="264" width="100" height="34" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="180" y="285.68" class="m" xml:space="preserve" text-anchor="middle">BFD17h</text>
