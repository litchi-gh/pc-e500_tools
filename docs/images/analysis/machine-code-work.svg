  <polyline points="460,132 688,132" fill="none" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2F6DB5)"/>
  <text x="574" y="126" class="s" text-anchor="middle">1000h だけ下へ</text>
  <rect x="130" y="160" width="100" height="34" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="180" y="181.68" class="m" xml:space="preserve" text-anchor="middle">BFCE1h</text>
