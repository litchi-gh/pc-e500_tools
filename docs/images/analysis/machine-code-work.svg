<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">ポインタ表と、1000h バイト確保したときの移動</title>
  <desc id="d">BFCDEh からのポインタ表が指す U スタック、S スタック、BASIC 作業域、IOCS 作業域、機械語エリアが、確保によって 1000h だけ下へ移動することを示す図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a2F6DB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="aC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">ポインタ表と、1000h バイト確保したときの移動</text>
  <text x="24" y="55" class="sub">ポインタの値は ROM 3.2 の例。各領域は、そのポインタの値から次のポインタの値まで（高さは実際と異なる）</text>
  <text x="180" y="92" class="b" text-anchor="middle">ポインタ</text>
  <text x="370" y="92" class="b" text-anchor="middle">確保前</text>
  <text x="770" y="92" class="b" text-anchor="middle">確保後（1000h）</text>
  <rect x="130" y="108" width="100" height="34" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="180" y="129.68" class="m" xml:space="preserve" text-anchor="middle">BFCDEh</text>
  <rect x="290" y="108" width="170" height="48" rx="2" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="375" y="128.54" class="b" text-anchor="middle">U スタック</text>
  <text x="375" y="145.82" class="s" text-anchor="middle">BF21Bh から</text>
  <rect x="690" y="108" width="170" height="48" rx="2" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="775" y="128.54" class="b" text-anchor="middle">U スタック</text>
  <text x="775" y="145.82" class="s" text-anchor="middle">BE21Bh から</text>
