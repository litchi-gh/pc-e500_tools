<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">画面の座標と、1 行のドットの並び</title>
  <desc id="d">文字の座標と点の座標の対応、行 0 から 3 と y の範囲、55h と 56h のバッファのバイト番号と画面の x の対応を示す図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a2F6DB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="a6B4FBB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4FBB"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">画面の座標と、1 行のドットの並び</text>
  <text x="24" y="55" class="sub">文字は 40 桁 × 4 行、点は 240 × 32。55h と 56h の 240 バイトは右半分が逆順</text>
  <rect x="130" y="100" width="792" height="128" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="118" y="121" class="s" text-anchor="end">行 0（y = 0〜7）</text>
  <polyline points="130,132 922,132" fill="none" stroke="#9AA5B1" stroke-width="1"/>
  <text x="118" y="153" class="s" text-anchor="end">行 1（y = 8〜15）</text>
  <polyline points="130,164 922,164" fill="none" stroke="#9AA5B1" stroke-width="1"/>
  <text x="118" y="185" class="s" text-anchor="end">行 2（y = 16〜23）</text>
  <polyline points="130,196 922,196" fill="none" stroke="#9AA5B1" stroke-width="1"/>
  <text x="118" y="217" class="s" text-anchor="end">行 3（y = 24〜31）</text>
  <polyline points="130,95 130,228" fill="none" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="134" y="92" class="ms" xml:space="preserve">桁 0（x=0）</text>
  <polyline points="328,95 328,228" fill="none" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="332" y="92" class="ms" xml:space="preserve">桁 10（x=60）</text>
  <polyline points="526,95 526,228" fill="none" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="530" y="92" class="ms" xml:space="preserve">桁 20（x=120）</text>
  <polyline points="724,95 724,228" fill="none" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="728" y="92" class="ms" xml:space="preserve">桁 30（x=180）</text>
  <polyline points="922,95 922,228" fill="none" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="130" y="100" width="19.8" height="32" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="156" y="121" class="s">1 文字は 6 × 8 ドット</text>
  <text x="24" y="268" class="b">55h、56h で読み書きする 240 バイト</text>
  <rect x="130" y="286" width="396" height="44" rx="2" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="328" y="304.54" class="b" text-anchor="middle">バイト 0〜119</text>
  <text x="328" y="321.82" class="s" text-anchor="middle">x = 0〜119</text>
  <rect x="526" y="286" width="396" height="44" rx="2" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="724" y="304.54" class="b" text-anchor="middle">バイト 120〜239</text>
  <text x="724" y="321.82" class="s" text-anchor="middle">x = 239〜120（120 バイト目が右端）</text>
  <polyline points="140,346 516,346" fill="none" stroke="#2F6DB5" stroke-width="2" marker-end="url(#a2F6DB5)"/>
  <polyline points="912,346 536,346" fill="none" stroke="#6B4FBB" stroke-width="2" marker-end="url(#a6B4FBB)"/>
  <text x="328" y="366" class="s" text-anchor="middle">バッファの順に左から右へ</text>
  <text x="724" y="366" class="s" text-anchor="middle">バッファの順に右から左へ</text>
  <text x="24" y="406" class="b">1 バイト = 縦 8 ドット</text>
  <rect x="220" y="386" width="58" height="30" rx="3" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="249" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 0</text>
  <rect x="282" y="386" width="58" height="30" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="311" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 1</text>
  <rect x="344" y="386" width="58" height="30" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="373" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 2</text>
  <rect x="406" y="386" width="58" height="30" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="435" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 3</text>
  <rect x="468" y="386" width="58" height="30" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="497" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 4</text>
  <rect x="530" y="386" width="58" height="30" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="559" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 5</text>
  <rect x="592" y="386" width="58" height="30" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="621" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 6</text>
  <rect x="654" y="386" width="58" height="30" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="683" y="404.96" class="ms" xml:space="preserve" text-anchor="middle">bit 7</text>
  <text x="724" y="406" class="s">ビット 0 が上、ビット 7 が下</text>
</svg>
