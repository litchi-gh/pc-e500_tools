<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" width="980" height="270" role="img" aria-labelledby="t d">
  <title id="t">G: のブロックの終わりと、使っている最後のアドレス</title>
  <desc id="d">C0000h から DFFFFh までを横に並べ、管理情報、G: のブロック、IOCS ヘッダ、第 2 のドット群の場所を示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="269" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">G: のブロックの終わりと、使っている最後のアドレス</text>
  <text x="24" y="55" class="sub">形式 A。ブロックは 128 KB ちょうどではなく、C0018h〜DF817h の 1F800h バイト</text>
  <rect x="24" y="86" width="100" height="66" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="74" y="115.5" class="b" text-anchor="middle">管理情報</text>
  <text x="74" y="132.5" class="s" text-anchor="middle">24 バイト</text>
  <rect x="124" y="86" width="430" height="66" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="339" y="115.5" class="b" text-anchor="middle">G: のブロック（RAMFILE）</text>
  <text x="339" y="132.5" class="s" text-anchor="middle">クラスタ 2〜1926 を使っている</text>
  <rect x="554" y="86" width="118" height="66" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1"/>
  <text x="613" y="107" class="b" text-anchor="middle">空きの</text>
  <text x="613" y="124" class="s" text-anchor="middle">クラスタ</text>
  <text x="613" y="141" class="s" text-anchor="middle">1927〜1935</text>
  <rect x="672" y="86" width="40" height="66" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="692" y="124" class="b" text-anchor="middle">FFh</text>
  <rect x="712" y="86" width="110" height="66" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="767" y="115.5" class="b" text-anchor="middle">IOCS</text>
  <text x="767" y="132.5" class="s" text-anchor="middle">ヘッダ</text>
  <rect x="822" y="86" width="40" height="66" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="842" y="124" class="b" text-anchor="middle">…</text>
  <rect x="862" y="86" width="94" height="66" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="909" y="115.5" class="b" text-anchor="middle">第 2 の</text>
  <text x="909" y="132.5" class="s" text-anchor="middle">ドット群</text>
  <polyline points="24,152 24,164" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="26" y="176" class="ms" xml:space="preserve">C0000h</text>
  <polyline points="124,152 124,164" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="126" y="176" class="ms" xml:space="preserve">C0018h</text>
  <polyline points="554,152 554,164" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="556" y="176" class="ms" xml:space="preserve">DF5D8h</text>
  <polyline points="672,152 672,164" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="674" y="176" class="ms" xml:space="preserve">DF818h</text>
  <polyline points="712,152 712,184" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="730" y="196" class="ms" xml:space="preserve">DF820h</text>
  <polyline points="862,152 862,164" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="864" y="176" class="ms" xml:space="preserve">DFD00h</text>
  <text x="24" y="226" class="s">DF818h の FFh は、メモリブロックの並びがここで終わるという印</text>
  <text x="24" y="246" class="s">7.5 と 8.5 は、ほかに 1920〜1923 の 4 クラスタも空いている</text>
</svg>
