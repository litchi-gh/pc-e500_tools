  <line x1="500" y1="150" x2="558" y2="173" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="740" y1="173" x2="788" y2="173" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="870" y1="201" x2="870" y2="228" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="435" y1="240" x2="435" y2="172" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="475" y1="172" x2="558" y2="270" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="650" y1="306" x2="650" y2="333" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="330" y1="363" x2="368" y2="363" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="500" y1="363" x2="558" y2="363" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
