  <text x="24" y="34" class="h" xml:space="preserve">キーワードから処理エントリまで</text>
  <text x="24" y="55" class="sub" xml:space="preserve">例: 文の PRINT と、関数の ASC（ROM 8.5）</text>
  <rect x="30" y="80" width="150" height="60" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="105" y="105" class="mb" text-anchor="middle" xml:space="preserve">PRINT</text>
  <text x="105" y="126" class="s" text-anchor="middle" xml:space="preserve">辞書 F55F9h</text>
