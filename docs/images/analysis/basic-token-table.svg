<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">キーワードから処理エントリまで</title>
  <desc id="d">キーワード PRINT が辞書で token 60h になり、処理レコード表の F5149h の 3 バイトを分解してエントリ FB979h に着くまでの図。</desc>
