  <text x="490" y="308" class="b" text-anchor="middle">+12 の 18 00 00 は「先頭から 18h」。初めはブロックがないので、そこに終わりの FFh がある</text>
  <text x="490" y="326" class="s" text-anchor="middle">INIT で RAMFILE を作ったり、MEM$="S2" で DATA と TEXT が移ったりすると、この場所からブロックが並ぶ</text>
