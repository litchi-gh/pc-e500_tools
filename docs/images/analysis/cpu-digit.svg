  <text x="520" y="100" class="b">実行前</text>
  <text x="520" y="170">20h → 22h の向き。6 は捨てられ、C には残らない</text>
  <text x="520" y="240">22h → 20h の向き。1 は捨てられ、C には残らない</text>
  <text x="40" y="296" class="s">黄色が空いた桁。(1Fh) や (23h) に何があっても 0。Z は 3 バイトが全部 0 のとき 1、C は変わらない</text>
