  <rect x="256" y="220" width="44" height="40" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="278" y="246" class="m" xml:space="preserve" text-anchor="middle">4</text>
  <rect x="300" y="220" width="44" height="40" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
