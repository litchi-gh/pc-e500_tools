  <rect x="124.955" y="144" width="12.8125" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="0.6"/>
  <rect x="137.767" y="144" width="323.516" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.6"/>
  <rect x="461.283" y="144" width="478.717" height="44" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="0.6"/>
  <text x="520" y="107" class="s" text-anchor="middle">データ　C1498h〜DF5D7h（64 バイト × 1,925）</text>
  <text x="300" y="171" class="s" text-anchor="middle">データ　C0B18h〜CD517h（256 バイト × 201）</text>
  <text x="690" y="171" class="s" text-anchor="middle">GRAPH の機械語など</text>
  <text x="120" y="206" class="ms" xml:space="preserve">C0000h</text>
  <text x="940" y="206" class="ms" xml:space="preserve" text-anchor="end">DFFFFh</text>
