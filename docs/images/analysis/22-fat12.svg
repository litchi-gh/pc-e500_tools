<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">12 ビット FAT の読み方</title>
  <desc id="d">3 バイトを 6 つの 4 ビットに分け、クラスタ 20 と 21 の次の番号がどの 4 ビットからできるかを線で示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">12 ビット FAT の読み方</text>
  <text x="24" y="55" class="sub">3 バイトに 2 つの項目。例は 7.5 の C0076h からの 3 バイト（クラスタ 20 と 21）</text>
  <text x="285" y="92" class="m" xml:space="preserve" text-anchor="middle">C0076h</text>
  <rect x="210" y="102" width="75" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="247" y="130" class="m" xml:space="preserve" text-anchor="middle">1</text>
  <rect x="285" y="102" width="75" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="322" y="130" class="m" xml:space="preserve" text-anchor="middle">5</text>
  <text x="247" y="162" class="s" text-anchor="middle">上の桁</text>
  <text x="322" y="162" class="s" text-anchor="middle">下の桁</text>
  <text x="475" y="92" class="m" xml:space="preserve" text-anchor="middle">C0077h</text>
  <rect x="400" y="102" width="75" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="437" y="130" class="m" xml:space="preserve" text-anchor="middle">6</text>
  <rect x="475" y="102" width="75" height="44" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="512" y="130" class="m" xml:space="preserve" text-anchor="middle">0</text>
  <text x="437" y="162" class="s" text-anchor="middle">上の桁</text>
  <text x="512" y="162" class="s" text-anchor="middle">下の桁</text>
  <text x="665" y="92" class="m" xml:space="preserve" text-anchor="middle">C0078h</text>
  <rect x="590" y="102" width="75" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="627" y="130" class="m" xml:space="preserve" text-anchor="middle">0</text>
  <rect x="665" y="102" width="75" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="702" y="130" class="m" xml:space="preserve" text-anchor="middle">1</text>
  <text x="627" y="162" class="s" text-anchor="middle">上の桁</text>
  <text x="702" y="162" class="s" text-anchor="middle">下の桁</text>
  <rect x="120" y="196" width="330" height="46" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="285" y="224" class="b" text-anchor="middle">クラスタ 20 の次 = 015h = 21</text>
  <rect x="530" y="196" width="330" height="46" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="695" y="224" class="b" text-anchor="middle">クラスタ 21 の次 = 016h = 22</text>
  <polyline points="285,172 285,194" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <polyline points="630,172 670,194" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="40" y="270" class="s">偶数の番号: 1 バイト目の全部と、2 バイト目の下の桁（下の桁が 12 ビットの最上位）</text>
  <text x="40" y="290" class="s">奇数の番号: 2 バイト目の上の桁と、3 バイト目の全部</text>
  <text x="40" y="310" class="s">FF0h はファイルの終わり、000h は空き</text>
</svg>
