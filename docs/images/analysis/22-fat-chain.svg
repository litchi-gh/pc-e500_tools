<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d">
  <title id="t">例: COMN.00$ を読む順番</title>
  <desc id="d">ディレクトリの項目 C0E18h から先頭クラスタ 20 を得て、FAT をたどり、クラスタ 20 から 37、1870、1871 のデータを読む流れを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="399" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">例: COMN.00$ を読む順番</text>
  <text x="24" y="55" class="sub">ディレクトリ → 先頭のクラスタ → FAT をたどる → データ。1,243 バイトは 64 バイトのクラスタ 20 個</text>
  <rect x="40" y="90" width="220" height="70" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="150" y="113" class="b" text-anchor="middle">ディレクトリの項目</text>
  <text x="150" y="130" class="s" text-anchor="middle">C0E18h（0 から数えて 18）</text>
  <text x="150" y="147" class="s" text-anchor="middle">COMN.00$、1,243 バイト</text>
  <polyline points="260,125 330,125" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="295" y="116" class="lbl" text-anchor="middle">先頭は 20</text>
  <rect x="332" y="90" width="608" height="70" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="636" y="121.5" class="b" text-anchor="middle">FAT（C0058h〜）の鎖</text>
  <text x="636" y="138.5" class="m" xml:space="preserve" text-anchor="middle">20 → 21 → 22 → … → 37 → 1870 → 1871 → 終わり</text>
  <polyline points="470,160 300,226" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <polyline points="800,160 770,226" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="40" y="216" class="b">データ域</text>
  <rect x="40" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="68" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="96" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="124" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="152" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="180" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="208" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="236" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="264" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="292" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="320" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="348" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="376" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="404" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="432" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="460" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="488" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <rect x="516" y="230" width="28" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <text x="54" y="257" class="ms" xml:space="preserve" text-anchor="middle">20</text>
  <text x="82" y="257" class="ms" xml:space="preserve" text-anchor="middle">21</text>
  <text x="530" y="257" class="ms" xml:space="preserve" text-anchor="middle">37</text>
  <text x="292" y="257" class="s" text-anchor="middle">…</text>
  <text x="40" y="292" class="ms" xml:space="preserve">C1918h</text>
  <text x="544" y="292" class="ms" xml:space="preserve" text-anchor="end">C1D97h</text>
  <text x="292" y="292" class="s" text-anchor="middle">18 クラスタ = 1,152 バイト</text>
  <rect x="574" y="230" width="130" height="44" rx="0" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="639" y="257" class="s" text-anchor="middle">ほかのファイル</text>
  <rect x="734" y="230" width="60" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <text x="764" y="257" class="ms" xml:space="preserve" text-anchor="middle">1870</text>
  <rect x="794" y="230" width="60" height="44" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="0.8"/>
  <text x="824" y="257" class="ms" xml:space="preserve" text-anchor="middle">1871</text>
  <text x="734" y="292" class="ms" xml:space="preserve">DE798h</text>
  <text x="854" y="292" class="ms" xml:space="preserve" text-anchor="end">DE817h</text>
  <text x="794" y="310" class="s" text-anchor="middle">2 クラスタ</text>
  <text x="40" y="336" class="m" xml:space="preserve">クラスタ番号 = 2 +（アドレス − C1498h）÷ 64</text>
  <text x="40" y="360" class="m" xml:space="preserve">2 +（C1918h − C1498h）÷ 64 = 20　　2 +（DE798h − C1498h）÷ 64 = 1870</text>
  <text x="40" y="384" class="s">最後のクラスタは 1,243 − 19 × 64 = 27 バイトだけが中身</text>
</svg>
