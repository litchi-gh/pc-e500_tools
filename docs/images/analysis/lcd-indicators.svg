  <text x="490" y="359" class="b" text-anchor="middle">ROM は作業域の 4 バイトを、そのまま 4 つのページの Y=63 へ書く（ROM 7.2 の F30BAh）</text>
  <text x="490" y="377" class="s" text-anchor="middle">対応は BFC97h → ページ 6、BFC98h → ページ 0、BFC99h → ページ 4、BFC9Ah → ページ 5</text>
  <text x="490" y="395" class="s" text-anchor="middle">例：CAPS を点けるのは、ページ 4 の bit3（値 08h）</text>
