<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="t d">
  <title id="t">FOR ... NEXT の繰り返し</title>
  <desc id="d">FOR と NEXT で囲んだ文を、変数の値を変えながら繰り返す様子と、2 重の繰り返しの順序を示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="419" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">FOR ... NEXT の繰り返し</text>
  <text x="24" y="55" class="sub" xml:space="preserve">左: 変数 I が 5、10、15、20、25 と変わる　右: ネストすると、内側が先に全部回る</text>
  <rect x="70" y="80" width="300" height="136" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <rect x="76" y="90" width="288" height="26" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="88" y="108" class="m" xml:space="preserve">10 FOR I=5 TO 25 STEP 5</text>
  <rect x="76" y="120" width="288" height="26" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="88" y="138" class="m" xml:space="preserve">20 PRINT I</text>
  <rect x="76" y="150" width="288" height="26" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="88" y="168" class="m" xml:space="preserve">30 NEXT I</text>
  <text x="88" y="198" class="m" xml:space="preserve">40 END</text>
  <path d="M68,163 C20,163 20,133 66,133" fill="none" stroke="#2F6DB5" stroke-width="2" marker-end="url(#ab)"/>
  <text x="70" y="250" xml:space="preserve">増分 STEP 5 を足して、終了値 25 まで繰り返す</text>
  <rect x="70" y="264" width="44" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="92" y="285" class="mb" text-anchor="middle" xml:space="preserve">5</text>
  <path d="M115,280 L129,280" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="130" y="264" width="44" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="152" y="285" class="mb" text-anchor="middle" xml:space="preserve">10</text>
  <path d="M175,280 L189,280" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="190" y="264" width="44" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="212" y="285" class="mb" text-anchor="middle" xml:space="preserve">15</text>
  <path d="M235,280 L249,280" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="250" y="264" width="44" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="272" y="285" class="mb" text-anchor="middle" xml:space="preserve">20</text>
  <path d="M295,280 L309,280" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="310" y="264" width="44" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="332" y="285" class="mb" text-anchor="middle" xml:space="preserve">25</text>
  <text x="70" y="320" class="s" xml:space="preserve">変数 I の値</text>
  <path d="M372,280 L388,280" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="70" y="356" class="s" xml:space="preserve">STEP を省くと増分は 1</text>
  <text x="70" y="378" class="s" style="fill:#C0392B;" xml:space="preserve">ループの中で CLEAR、DIM、ERASE を使わない</text>
  <text x="70" y="398" class="s" style="fill:#C0392B;" xml:space="preserve">ループの途中から外へ飛び出さない</text>
  <rect x="520" y="80" width="300" height="166" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <rect x="526" y="90" width="288" height="26" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="538" y="108" class="m" xml:space="preserve">10 FOR I=1 TO 2</text>
  <rect x="526" y="120" width="288" height="26" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="538" y="138" class="m" xml:space="preserve">20 FOR J=1 TO 3</text>
  <text x="538" y="168" class="m" xml:space="preserve">30 PRINT I;J</text>
  <rect x="526" y="180" width="288" height="26" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="538" y="198" class="m" xml:space="preserve">40 NEXT J</text>
  <rect x="526" y="210" width="288" height="26" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="538" y="228" class="m" xml:space="preserve">50 NEXT I</text>
  <path d="M822,193 C860,193 860,163 824,163" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M822,223 C910,223 910,133 824,133" fill="none" stroke="#2F6DB5" stroke-width="2" marker-end="url(#ab)"/>
  <text x="854" y="199" class="s" style="fill:#2F855A;" xml:space="preserve">内側</text>
  <text x="896" y="227" class="s" style="fill:#2F6DB5;" xml:space="preserve">外側</text>
  <text x="520" y="284" class="b" xml:space="preserve">実行される順</text>
  <rect x="520" y="296" width="60" height="32" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="550" y="317" class="m" text-anchor="middle" xml:space="preserve">1,1</text>
  <rect x="584" y="296" width="60" height="32" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="614" y="317" class="m" text-anchor="middle" xml:space="preserve">1,2</text>
  <rect x="648" y="296" width="60" height="32" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="678" y="317" class="m" text-anchor="middle" xml:space="preserve">1,3</text>
  <rect x="712" y="296" width="60" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="742" y="317" class="m" text-anchor="middle" xml:space="preserve">2,1</text>
  <rect x="776" y="296" width="60" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="806" y="317" class="m" text-anchor="middle" xml:space="preserve">2,2</text>
  <rect x="840" y="296" width="60" height="32" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="870" y="317" class="m" text-anchor="middle" xml:space="preserve">2,3</text>
  <text x="520" y="350" class="s" xml:space="preserve">（I,J の組）</text>
  <text x="520" y="378" class="s" xml:space="preserve">ネストは最大 6 段。NEXT は内側の変数から書く</text>
</svg>
