<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d">
  <title id="t">11 ピンのコネクタと CPU のつながり</title>
  <desc id="d">11 本のピンについて、公式の信号名、CPU の端子、向き、以前の機種の呼び名を並べた図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="559" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" text-anchor="start" xml:space="preserve">11 ピンのコネクタと CPU のつながり</text>
  <text x="24" y="56" class="s" text-anchor="start" xml:space="preserve">信号名と CPU の端子は 2 冊のサービスマニュアルの回路図。向きは本体から見たもの</text>
  <text x="40" y="92" class="b" text-anchor="start" xml:space="preserve">ピン</text>
  <text x="100" y="92" class="b" text-anchor="start" xml:space="preserve">信号名</text>
  <text x="230" y="92" class="b" text-anchor="start" xml:space="preserve">CPU の端子</text>
  <text x="390" y="92" class="b" text-anchor="start" xml:space="preserve">向き</text>
  <text x="520" y="92" class="b" text-anchor="start" xml:space="preserve">読み返し</text>
  <text x="700" y="92" class="b" text-anchor="start" xml:space="preserve">以前の機種の呼び名</text>
  <rect x="30" y="104" width="920" height="34" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="40" y="126" class="m" text-anchor="start" xml:space="preserve">1</text>
  <text x="100" y="126" class="m" text-anchor="start" xml:space="preserve">MT2</text>
  <text x="230" y="126" class="m" text-anchor="start" xml:space="preserve">Q2（ブザー）</text>
  <text x="390" y="126" class="" text-anchor="start" xml:space="preserve">§6.0.2</text>
  <text x="520" y="126" class="" text-anchor="start" xml:space="preserve"></text>
  <text x="700" y="126" class="" text-anchor="start" xml:space="preserve">MTout2</text>
  <rect x="30" y="142" width="920" height="34" rx="4" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="40" y="164" class="m" text-anchor="start" xml:space="preserve">2</text>
  <text x="100" y="164" class="m" text-anchor="start" xml:space="preserve">VCC</text>
  <text x="230" y="164" class="m" text-anchor="start" xml:space="preserve">VCC</text>
  <text x="390" y="164" class="" text-anchor="start" xml:space="preserve">電源 +</text>
  <text x="520" y="164" class="" text-anchor="start" xml:space="preserve"></text>
  <text x="700" y="164" class="" text-anchor="start" xml:space="preserve">GND（+6V）</text>
  <rect x="30" y="180" width="920" height="34" rx="4" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="40" y="202" class="m" text-anchor="start" xml:space="preserve">3</text>
  <text x="100" y="202" class="m" text-anchor="start" xml:space="preserve">GND</text>
  <text x="230" y="202" class="m" text-anchor="start" xml:space="preserve">GND</text>
  <text x="390" y="202" class="" text-anchor="start" xml:space="preserve">電源 −</text>
  <text x="520" y="202" class="" text-anchor="start" xml:space="preserve"></text>
  <text x="700" y="202" class="" text-anchor="start" xml:space="preserve">VGG（0V）</text>
  <rect x="30" y="218" width="920" height="34" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="40" y="240" class="m" text-anchor="start" xml:space="preserve">4</text>
  <text x="100" y="240" class="m" text-anchor="start" xml:space="preserve">BUSY</text>
  <text x="230" y="240" class="m" text-anchor="start" xml:space="preserve">E6</text>
  <text x="390" y="240" class="" text-anchor="start" xml:space="preserve">出力</text>
  <text x="520" y="240" class="" text-anchor="start" xml:space="preserve"></text>
  <text x="700" y="240" class="" text-anchor="start" xml:space="preserve">FO1、Busy</text>
  <rect x="30" y="256" width="920" height="34" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="40" y="278" class="m" text-anchor="start" xml:space="preserve">5</text>
  <text x="100" y="278" class="m" text-anchor="start" xml:space="preserve">DOUT</text>
  <text x="230" y="278" class="m" text-anchor="start" xml:space="preserve">E10</text>
  <text x="390" y="278" class="" text-anchor="start" xml:space="preserve">出力（入力も）</text>
  <text x="520" y="278" class="" text-anchor="start" xml:space="preserve">E14（ACK が High のとき）</text>
  <text x="700" y="278" class="" text-anchor="start" xml:space="preserve">FO2、Din</text>
  <rect x="30" y="294" width="920" height="34" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="40" y="316" class="m" text-anchor="start" xml:space="preserve">6</text>
  <text x="100" y="316" class="m" text-anchor="start" xml:space="preserve">XIN</text>
  <text x="230" y="316" class="m" text-anchor="start" xml:space="preserve">CI</text>
  <text x="390" y="316" class="" text-anchor="start" xml:space="preserve">入力</text>
  <text x="520" y="316" class="" text-anchor="start" xml:space="preserve"></text>
  <text x="700" y="316" class="" text-anchor="start" xml:space="preserve">MTin</text>
  <rect x="30" y="332" width="920" height="34" rx="4" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="40" y="354" class="m" text-anchor="start" xml:space="preserve">7</text>
  <text x="100" y="354" class="m" text-anchor="start" xml:space="preserve">XOUT</text>
  <text x="230" y="354" class="m" text-anchor="start" xml:space="preserve">CO</text>
  <text x="390" y="354" class="" text-anchor="start" xml:space="preserve">出力</text>
  <text x="520" y="354" class="" text-anchor="start" xml:space="preserve"></text>
  <text x="700" y="354" class="" text-anchor="start" xml:space="preserve">MTout1</text>
  <rect x="30" y="370" width="920" height="34" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="40" y="392" class="m" text-anchor="start" xml:space="preserve">8</text>
  <text x="100" y="392" class="m" text-anchor="start" xml:space="preserve">DIN</text>
  <text x="230" y="392" class="m" text-anchor="start" xml:space="preserve">E11</text>
  <text x="390" y="392" class="" text-anchor="start" xml:space="preserve">入力（出力も）</text>
  <text x="520" y="392" class="" text-anchor="start" xml:space="preserve">E15（いつでも）</text>
  <text x="700" y="392" class="" text-anchor="start" xml:space="preserve">IB8、Dout</text>
  <rect x="30" y="408" width="920" height="34" rx="4" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="40" y="430" class="m" text-anchor="start" xml:space="preserve">9</text>
  <text x="100" y="430" class="m" text-anchor="start" xml:space="preserve">ACK</text>
  <text x="230" y="430" class="m" text-anchor="start" xml:space="preserve">E7</text>
  <text x="390" y="430" class="" text-anchor="start" xml:space="preserve">入力</text>
  <text x="520" y="430" class="" text-anchor="start" xml:space="preserve"></text>
  <text x="700" y="430" class="" text-anchor="start" xml:space="preserve">IB7</text>
  <rect x="30" y="446" width="920" height="34" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="40" y="468" class="m" text-anchor="start" xml:space="preserve">10</text>
  <text x="100" y="468" class="m" text-anchor="start" xml:space="preserve">IO2</text>
  <text x="230" y="468" class="m" text-anchor="start" xml:space="preserve">E9</text>
  <text x="390" y="468" class="" text-anchor="start" xml:space="preserve">入出力</text>
  <text x="520" y="468" class="" text-anchor="start" xml:space="preserve">E13（ACK が High のとき）</text>
  <text x="700" y="468" class="" text-anchor="start" xml:space="preserve">IB6、SEL2</text>
  <rect x="30" y="484" width="920" height="34" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1"/>
  <text x="40" y="506" class="m" text-anchor="start" xml:space="preserve">11</text>
  <text x="100" y="506" class="m" text-anchor="start" xml:space="preserve">IO1</text>
  <text x="230" y="506" class="m" text-anchor="start" xml:space="preserve">E8</text>
  <text x="390" y="506" class="" text-anchor="start" xml:space="preserve">入出力</text>
  <text x="520" y="506" class="" text-anchor="start" xml:space="preserve">E12（ACK が High のとき）</text>
  <text x="700" y="506" class="" text-anchor="start" xml:space="preserve">IB5、SEL1</text>
  <text x="30" y="538" class="s" text-anchor="start" xml:space="preserve">青：出力　緑：入力　紫：両方向　赤：電源　黄：ブザーのトランジスタへ</text>
</svg>
