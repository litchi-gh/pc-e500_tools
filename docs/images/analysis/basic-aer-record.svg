  <text x="40" y="276" class="b" xml:space="preserve">長さの 9Ch = 1Ch + 80h。80h は「最後の式」の印、1Ch = 28 バイトが長さです。</text>
  <text x="40" y="302" xml:space="preserve">28 = 名前の長さから式の終わりまで（04 〜 1D 00 00 20 00 00 00 00）の 28 バイト</text>
  <text x="40" y="328" xml:space="preserve">式は BASIC と同じ中間コードです。FE 95 が SIN、1D のあとの 7 バイトが数値 2 です。</text>
