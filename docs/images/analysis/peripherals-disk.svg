  <text x="448" y="117" class="b">1 セクタ = 512 バイト</text>
  <rect x="448" y="150" width="490" height="46" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="464" y="178" class="b">1 トラック</text>
  <text x="620" y="178">8 セクタ × 512 = 4096 バイト</text>
  <rect x="448" y="206" width="490" height="46" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="464" y="234" class="b">1 面</text>
  <text x="620" y="234">16 トラック × 4096 = 65536 バイト（64 KB）</text>
  <rect x="448" y="262" width="490" height="46" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="464" y="290" class="b">両面</text>
  <text x="620" y="290">65536 × 2 = 131072 バイト（128 KB）</text>
  <rect x="448" y="318" width="490" height="46" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="464" y="346" class="b">使える容量（片面）</text>
  <text x="620" y="346">62464 バイト = 122 セクタ</text>
  <text x="448" y="392" class="s">1 面は 128 セクタ。122 セクタとの差は 6 セクタ（計算）。</text>
