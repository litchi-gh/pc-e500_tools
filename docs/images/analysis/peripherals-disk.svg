<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="t d">
  <title id="t">CE-140F のディスクの構成</title>
  <desc id="d">同心円の 16 トラックと 8 つのセクタ、1 セクタ 512 バイト、1 面 64 KB、使える容量 62464 バイトの計算。</desc>
