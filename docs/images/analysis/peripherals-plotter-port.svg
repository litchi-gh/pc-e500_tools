<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">CE-515P のシリアルの端子と、本体の 15 ピン</title>
  <desc id="d">CE-515P の 4 本の端子と、PC-E500 の 15 ピンのうち関係する信号を左右に並べた図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">CE-515P のシリアルの端子と、本体の 15 ピン</text>
  <text x="24" y="55" class="sub">ケーブル CE-516L の配線は確かめられていないので、線は描いていない</text>
  <rect x="40" y="80" width="380" height="220" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="60" y="106" class="b">PC-E500 の 15 ピン（関係する信号）</text>
  <rect x="60" y="122" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="82" y="143.68" class="m" xml:space="preserve" text-anchor="middle">2</text>
  <text x="116" y="144" class="b">SD（TXD）</text>
  <text x="230" y="144" class="s">出力：送信データ</text>
  <rect x="60" y="165" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="82" y="186.68" class="m" xml:space="preserve" text-anchor="middle">5</text>
  <text x="116" y="187" class="b">CS（CTS）</text>
  <text x="230" y="187" class="s">入力：送信可</text>
  <rect x="60" y="208" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="82" y="229.68" class="m" xml:space="preserve" text-anchor="middle">7</text>
  <text x="116" y="230" class="b">SG</text>
  <text x="230" y="230" class="s">信号用接地</text>
  <rect x="60" y="251" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="82" y="272.68" class="m" xml:space="preserve" text-anchor="middle">14</text>
  <text x="116" y="273" class="b">ER（DTR）</text>
  <text x="230" y="273" class="s">出力：OPEN 中に High</text>
  <rect x="560" y="80" width="380" height="220" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="580" y="106" class="b">CE-515P のシリアル</text>
  <rect x="580" y="122" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="602" y="143.68" class="m" xml:space="preserve" text-anchor="middle">1</text>
  <text x="636" y="144" class="b">+12V</text>
  <text x="760" y="144" class="s"></text>
  <rect x="580" y="165" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="602" y="186.68" class="m" xml:space="preserve" text-anchor="middle">2</text>
  <text x="636" y="187" class="b">BUSY</text>
  <text x="760" y="187" class="s">出力</text>
  <rect x="580" y="208" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="602" y="229.68" class="m" xml:space="preserve" text-anchor="middle">3</text>
  <text x="636" y="230" class="b">SIGNAL GND</text>
  <text x="760" y="230" class="s"></text>
  <rect x="580" y="251" width="44" height="34" rx="6" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="602" y="272.68" class="m" xml:space="preserve" text-anchor="middle">4</text>
  <text x="636" y="273" class="b">DATA</text>
  <text x="760" y="273" class="s">入力</text>
  <rect x="440" y="150" width="100" height="64" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="490" y="178.54" class="b" text-anchor="middle">CE-516L</text>
  <text x="490" y="195.82" class="s" text-anchor="middle">ケーブル</text>
  <text x="490" y="240" class="s" text-anchor="middle">1200 bps</text>
  <text x="490" y="258" class="s" text-anchor="middle">N,8,1</text>
</svg>
