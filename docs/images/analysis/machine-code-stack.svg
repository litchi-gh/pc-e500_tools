<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 366" width="980" height="366" role="img" aria-labelledby="t d">
  <title id="t">CALL で積まれるリターンアドレスと、RETF、RET の違い</title>
  <desc id="d">S スタックに積まれた 4E 9F 0F の 3 バイトを、RETF は 3 バイト取り出し、RET は 2 バイトだけ取り出すので 1 バイト残ることを示す図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs></defs>
  <rect x="0.5" y="0.5" width="979" height="365" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">CALL で積まれるリターンアドレスと、RETF、RET の違い</text>
  <text x="24" y="55" class="sub">アドレスは ROM 8.5、64 KB の例（S = BE84Dh）。リターンアドレス F9F4Eh は下位のバイトから 3 バイト</text>
  <text x="144" y="92" class="b" text-anchor="middle">呼ばれた直後</text>
  <text x="28" y="134" class="ms" xml:space="preserve">[S]</text>
  <rect x="86" y="108" width="110" height="40" rx="2" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="141" y="132.68" class="m" xml:space="preserve" text-anchor="middle">4E</text>
  <text x="204" y="133" class="s">← S</text>
  <text x="28" y="178" class="ms" xml:space="preserve">[S+1]</text>
  <rect x="86" y="152" width="110" height="40" rx="2" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="141" y="176.68" class="m" xml:space="preserve" text-anchor="middle">9F</text>
  <text x="28" y="222" class="ms" xml:space="preserve">[S+2]</text>
  <rect x="86" y="196" width="110" height="40" rx="2" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="141" y="220.68" class="m" xml:space="preserve" text-anchor="middle">0F</text>
  <text x="28" y="266" class="ms" xml:space="preserve">[S+3]</text>
  <rect x="86" y="240" width="110" height="40" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="141" y="264.68" class="m" xml:space="preserve" text-anchor="middle">…</text>
  <text x="204" y="265" class="s">ROM の分</text>
  <text x="144" y="316" class="b" text-anchor="middle" style="fill:#52606D">S はリターンアドレスを指す</text>
  <text x="144" y="338" class="s" text-anchor="middle">積み降ろしは対にする</text>
  <text x="470" y="92" class="b" text-anchor="middle">RETF で戻る</text>
  <text x="354" y="134" class="ms" xml:space="preserve"></text>
  <rect x="412" y="108" width="110" height="40" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="467" y="132.68" class="m" xml:space="preserve" text-anchor="middle">4E</text>
  <text x="530" y="133" class="s">取り出す</text>
  <text x="354" y="178" class="ms" xml:space="preserve"></text>
  <rect x="412" y="152" width="110" height="40" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="467" y="176.68" class="m" xml:space="preserve" text-anchor="middle">9F</text>
  <text x="530" y="177" class="s">取り出す</text>
  <text x="354" y="222" class="ms" xml:space="preserve"></text>
  <rect x="412" y="196" width="110" height="40" rx="2" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="467" y="220.68" class="m" xml:space="preserve" text-anchor="middle">0F</text>
  <text x="530" y="221" class="s">取り出す</text>
  <text x="354" y="266" class="ms" xml:space="preserve">[S]</text>
  <rect x="412" y="240" width="110" height="40" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="467" y="264.68" class="m" xml:space="preserve" text-anchor="middle">…</text>
  <text x="530" y="265" class="s">← S</text>
  <text x="470" y="316" class="b" text-anchor="middle" style="fill:#2F855A">F9F4Eh へ戻る</text>
  <text x="470" y="338" class="s" text-anchor="middle">S は呼ばれる前と同じ</text>
  <text x="800" y="92" class="b" text-anchor="middle">RET で戻る（誤り）</text>
  <text x="684" y="134" class="ms" xml:space="preserve"></text>
  <rect x="742" y="108" width="110" height="40" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="797" y="132.68" class="m" xml:space="preserve" text-anchor="middle">4E</text>
  <text x="860" y="133" class="s">取り出す</text>
  <text x="684" y="178" class="ms" xml:space="preserve"></text>
  <rect x="742" y="152" width="110" height="40" rx="2" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="797" y="176.68" class="m" xml:space="preserve" text-anchor="middle">9F</text>
  <text x="860" y="177" class="s">取り出す</text>
  <text x="684" y="222" class="ms" xml:space="preserve">[S]</text>
  <rect x="742" y="196" width="110" height="40" rx="2" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="797" y="220.68" class="m" xml:space="preserve" text-anchor="middle">0F</text>
  <text x="860" y="221" class="s">← S（残る）</text>
  <text x="684" y="266" class="ms" xml:space="preserve"></text>
  <rect x="742" y="240" width="110" height="40" rx="2" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="797" y="264.68" class="m" xml:space="preserve" text-anchor="middle">…</text>
  <text x="860" y="265" class="s">ROM の分</text>
  <text x="800" y="316" class="b" text-anchor="middle" style="fill:#C0392B">S が 1 バイトずれる</text>
  <text x="800" y="338" class="s" text-anchor="middle">暴走してメインメニューに落ちる</text>
</svg>
