  <text x="24" y="34" class="h" xml:space="preserve">変数に入っている数値の読み方</text>
  <text x="24" y="55" class="sub" xml:space="preserve">符号 1 バイト、指数 1 バイト、残りが BCD（1 バイトに 10 進 2 桁）。最初の桁のあとに小数点がある</text>
