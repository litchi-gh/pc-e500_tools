<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">CIRCLE (240,-100),100,0,90,450,1,120,0 の計算</title>
  <desc id="d">90 度、210 度、330 度、450 度の点の座標と、R と J で送る差分を、円と三角形の図に書き込んだもの。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="aC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">CIRCLE (240,-100),100,0,90,450,1,120,0 の計算</text>
  <text x="24" y="55" class="sub">中心から見た点を求め、前の点との差を送る（ピッチ 120 度なので三角形になる）</text>
  <circle cx="220" cy="270" r="150" fill="none" stroke="#B8C2CC" stroke-dasharray="4 4"/>
  <polyline points="220,270 220,126" fill="none" stroke="#52606D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a52606D)"/>
  <polyline points="220,120 89.5,345" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#aC0392B)"/>
  <polyline points="89.5,345 350.5,345" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#aC0392B)"/>
  <polyline points="350.5,345 220,120" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#aC0392B)"/>
  <circle cx="220" cy="270" r="4" fill="#C0392B" stroke="none"/>
  <text x="230" y="288" class="s">中心 (240,-100)</text>
  <circle cx="220" cy="120" r="4" fill="#2F6DB5" stroke="none"/>
  <text x="230" y="112" class="s">90 度 (0,100)</text>
  <circle cx="89.5" cy="345" r="4" fill="#2F6DB5" stroke="none"/>
  <text x="25.5" y="369" class="s">210 度 (-87,-50)</text>
  <circle cx="350.5" cy="345" r="4" fill="#2F6DB5" stroke="none"/>
  <text x="320.5" y="369" class="s">330 度 (87,-50)</text>
  <text x="460" y="96" class="b">角度</text>
  <text x="556" y="96" class="b">点（中心から）</text>
  <text x="800" y="96" class="b"></text>
  <text x="690" y="96" class="b">送るもの</text>
  <rect x="452" y="108" width="504" height="42" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="466" y="135"></text>
  <text x="560" y="135" class="m" xml:space="preserve">(0,0)</text>
  <text x="690" y="135" class="m" xml:space="preserve">M240,-100</text>
  <text x="850" y="135" class="s">中心へ移動</text>
  <rect x="452" y="158" width="504" height="42" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="466" y="185">90 度</text>
  <text x="560" y="185" class="m" xml:space="preserve">(0,100)</text>
  <text x="690" y="185" class="m" xml:space="preserve">R0,100</text>
  <text x="850" y="185" class="s">始点へ移動</text>
  <rect x="452" y="208" width="504" height="42" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="466" y="235">210 度</text>
  <text x="560" y="235" class="m" xml:space="preserve">(-87,-50)</text>
  <text x="690" y="235" class="m" xml:space="preserve">J -87,-150</text>
  <text x="850" y="235" class="s">線を引く</text>
  <rect x="452" y="258" width="504" height="42" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="466" y="285">330 度</text>
  <text x="560" y="285" class="m" xml:space="preserve">(87,-50)</text>
  <text x="690" y="285" class="m" xml:space="preserve">J 174,0</text>
  <text x="850" y="285" class="s">線を引く</text>
  <rect x="452" y="308" width="504" height="42" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="466" y="335">450 度</text>
  <text x="560" y="335" class="m" xml:space="preserve">(0,100)</text>
  <text x="690" y="335" class="m" xml:space="preserve">J -87,150</text>
  <text x="850" y="335" class="s">線を引く</text>
  <rect x="452" y="358" width="504" height="42" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="466" y="385"></text>
  <text x="560" y="385" class="m" xml:space="preserve">(0,0)</text>
  <text x="690" y="385" class="m" xml:space="preserve">M240,-100</text>
  <text x="850" y="385" class="s">中心へ戻る</text>
  <text x="452" y="430" class="s">J の 3 つは 1 行にまとめて J-87,-150,174,0,-87,150 になる。</text>
</svg>
