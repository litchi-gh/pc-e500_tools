<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-labelledby="t d">
  <title id="t">ON ERROR GOTO と RESUME</title>
  <desc id="d">エラーが起きると ON ERROR GOTO で決めた行へ飛び、RESUME の 3 つの形でそれぞれ違う場所へ戻ることを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 700; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="439" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">ON ERROR GOTO と RESUME</text>
  <text x="24" y="55" class="sub" xml:space="preserve">30 行でエラーが起きた場合。RESUME の書き方で、戻る場所が 3 通りに変わる</text>
  <rect x="60" y="84" width="330" height="166" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <rect x="66" y="94" width="318" height="26" rx="4" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="78" y="112" class="m" xml:space="preserve">10 ON ERROR GOTO 100</text>
  <text x="78" y="142" class="m" xml:space="preserve">20 INPUT X</text>
  <rect x="66" y="154" width="318" height="26" rx="4" fill="#FDECEA" stroke="#C0392B" stroke-width="1"/>
  <text x="78" y="172" class="m" xml:space="preserve">30 Y=1/X</text>
  <text x="78" y="202" class="m" xml:space="preserve">40 PRINT Y</text>
  <text x="78" y="232" class="m" xml:space="preserve">50 END</text>
  <rect x="60" y="290" width="330" height="76" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <rect x="66" y="300" width="318" height="26" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="78" y="318" class="m" xml:space="preserve">100 PRINT ERN;ERL</text>
  <rect x="66" y="330" width="318" height="26" rx="4" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="78" y="348" class="m" xml:space="preserve">110 RESUME ...</text>
  <path d="M58,167 C14,167 14,313 56,313" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/>
  <text x="84" y="272" style="fill:#C0392B;" xml:space="preserve">エラー: ERN に番号、ERL に行 30 が入る</text>
  <text x="60" y="400" class="s" xml:space="preserve">ON ERROR GOTO 0 で設定を解除</text>
  <text x="60" y="420" class="s" xml:space="preserve">エラー処理の中でさらにエラーが起きると停止</text>
  <rect x="560" y="250" width="370" height="42" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="574" y="276" class="mb" xml:space="preserve">RESUME</text>
  <text x="700" y="276" style="font-size:13px;" xml:space="preserve">エラーを起こした文をもう一度</text>
  <path d="M560,271 L440,271 L440,167 L394,167" fill="none" stroke="#2F6DB5" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="560" y="306" width="370" height="42" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="574" y="332" class="mb" xml:space="preserve">RESUME NEXT</text>
  <text x="700" y="332" style="font-size:13px;" xml:space="preserve">エラーを起こした文の次から</text>
  <path d="M560,327 L476,327 L476,197 L394,197" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="560" y="362" width="370" height="42" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="574" y="388" class="mb" xml:space="preserve">RESUME 20</text>
  <text x="700" y="388" style="font-size:13px;" xml:space="preserve">指定した行（またはラベル）から</text>
  <path d="M560,383 L512,383 L512,137 L394,137" fill="none" stroke="#B7791F" stroke-width="2" marker-end="url(#a)"/>
  <path d="M392,343 L520,343" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="410" y="337" class="lbl" xml:space="preserve">3 つの形</text>
</svg>
