<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-labelledby="t d">
  <title id="t">電池の監視</title>
  <desc id="d">電圧を分ける抵抗と検出 IC、E3 の開閉で 2 つの電圧を見分ける仕組みの図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="439" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" text-anchor="start" xml:space="preserve">電池の監視</text>
  <text x="24" y="56" class="s" text-anchor="start" xml:space="preserve">R11 3.9 kΩ、R12 39 kΩ（PC-E500）。R6、R7 が同じ値（PC-E500S）</text>
  <rect x="40" y="90" width="120" height="40" rx="8" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.3"/>
  <text x="100.0" y="115.0" class="b" text-anchor="middle" xml:space="preserve">VCC</text>
  <line x1="100" y1="130" x2="100" y2="150" stroke="#52606D" stroke-width="1.6"/>
  <rect x="60" y="150" width="80" height="40" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="100.0" y="175.0" class="s" text-anchor="middle" xml:space="preserve">3.9 kΩ</text>
  <line x1="100" y1="190" x2="100" y2="215" stroke="#52606D" stroke-width="1.6"/>
  <line x1="100" y1="215" x2="220" y2="215" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="240" width="80" height="40" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.3"/>
  <text x="100.0" y="265.0" class="s" text-anchor="middle" xml:space="preserve">39 kΩ</text>
  <line x1="100" y1="215" x2="100" y2="240" stroke="#52606D" stroke-width="1.6"/>
  <line x1="100" y1="280" x2="100" y2="310" stroke="#52606D" stroke-width="1.6"/>
  <rect x="40" y="310" width="120" height="44" rx="8" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.3"/>
  <text x="100.0" y="327.5" class="b" text-anchor="middle" xml:space="preserve">CPU E3</text>
  <text x="100.0" y="346.5" class="s" text-anchor="middle" xml:space="preserve">Low か、離す</text>
  <rect x="220" y="190" width="130" height="50" rx="8" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.3"/>
  <text x="285.0" y="210.5" class="b" text-anchor="middle" xml:space="preserve">検出 IC</text>
  <text x="285.0" y="229.5" class="s" text-anchor="middle" xml:space="preserve">約 4 V で切り替わる</text>
  <line x1="350" y1="215" x2="420" y2="215" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="420" y="190" width="120" height="50" rx="8" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.3"/>
  <text x="480.0" y="220.0" class="b" text-anchor="middle" xml:space="preserve">CPU IRQ</text>
  <line x1="480" y1="240" x2="480" y2="290" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="400" y="290" width="160" height="60" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="1.3"/>
  <text x="480.0" y="315.5" class="b" text-anchor="middle" xml:space="preserve">ON、RESET の線</text>
  <text x="480.0" y="334.5" class="s" text-anchor="middle" xml:space="preserve">IRQ が Low なら止める</text>
  <text x="600" y="100" class="b" text-anchor="start" xml:space="preserve">E3 を Low にしたとき（BATT を調べる）</text>
  <text x="600" y="124" class="m" text-anchor="start" xml:space="preserve">IC の電圧 = VCC × 39 ÷ 42.9 = VCC × 0.909</text>
  <text x="600" y="148" class="" text-anchor="start" xml:space="preserve">VCC が 4.2〜4.6 V を切ると IRQ が Low</text>
  <text x="600" y="196" class="b" text-anchor="start" xml:space="preserve">E3 を離したとき（止めるかを調べる）</text>
  <text x="600" y="220" class="m" text-anchor="start" xml:space="preserve">IC の電圧 = VCC</text>
  <text x="600" y="244" class="" text-anchor="start" xml:space="preserve">VCC が 3.8〜4.2 V を切ると IRQ が Low</text>
  <line x1="600" y1="400" x2="940" y2="400" stroke="#7B8794" stroke-width="1.2"/>
  <path d="M 610 290 L 930 392" fill="none" stroke="#2F6DB5" stroke-width="2.2"/>
  <line x1="600" y1="318" x2="700" y2="318" stroke="#B7791F" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="706" y="315" class="s" text-anchor="start" xml:space="preserve">BATT が点く 4.2〜4.6 V</text>
  <line x1="600" y1="350" x2="800" y2="350" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="806" y="347" class="s" text-anchor="start" xml:space="preserve">止まる 3.8〜4.2 V</text>
  <text x="600" y="284" class="s" text-anchor="start" xml:space="preserve">電圧</text>
  <text x="940" y="418" class="s" text-anchor="end" xml:space="preserve">時間</text>
</svg>
