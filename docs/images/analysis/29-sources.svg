<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">PC-E500S の値を、3 つの資料で比べる</title>
  <desc id="d">PC-E500S の重さ、消費電力、大きさ、ROM、年を、操作説明書、サービスマニュアル、百科事典で比べた図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .xs { font-size: 11px; fill: #52606D; }
    .r { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #B7791F; font-weight: 700; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lcd { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 700; fill: #24351D; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7B8794"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">PC-E500S の値を、3 つの資料で比べる</text>
  <text x="24" y="56" class="sub">緑は一致。黄は食い違いがあり、右端の値を採る</text>
  <text x="32" y="88" class="b">項目</text>
  <text x="178" y="88" class="b">操作説明書 p.337〜338</text>
  <text x="378" y="88" class="b">サービスマニュアル p.1</text>
  <text x="578" y="88" class="b">百科事典</text>
  <text x="768" y="88" class="b">採る値</text>
  <rect x="24" y="102" width="932" height="30" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="32" y="122" class="s">重さ</text>
  <text x="178" y="122" class="s">340 g（電池、カバー込み）</text>
  <text x="378" y="122" class="s">340 g（電池込み）</text>
  <text x="578" y="122" class="s">340 g</text>
  <text x="768" y="122" class="s">340 g</text>
  <rect x="24" y="138" width="932" height="30" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="32" y="158" class="s">消費電力</text>
  <text x="178" y="158" class="s">0.09 W</text>
  <text x="378" y="158" class="s">0.09 W</text>
  <text x="578" y="158" class="s">0.09 W</text>
  <text x="768" y="158" class="s">0.09 W</text>
  <rect x="24" y="174" width="932" height="30" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="32" y="194" class="s">大きさ</text>
  <text x="178" y="194" class="s">220 × 104.5 × 19 mm</text>
  <text x="378" y="194" class="s">220 × 104.5 × 19 mm</text>
  <text x="578" y="194" class="s"></text>
  <text x="768" y="194" class="s">左の値</text>
  <rect x="24" y="210" width="932" height="30" rx="5" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="32" y="230" class="s">内蔵 RAM</text>
  <text x="178" y="230" class="s">32 KB</text>
  <text x="378" y="230" class="s">32 KB</text>
  <text x="578" y="230" class="s">32 KB</text>
  <text x="768" y="230" class="s">32 KB</text>
  <rect x="24" y="246" width="932" height="30" rx="5" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="32" y="266" class="s">ROM</text>
  <text x="178" y="266" class="s">256 KB</text>
  <text x="378" y="266" class="s">512 KB</text>
  <text x="578" y="266" class="s"></text>
  <text x="768" y="266" class="s">部品 512、見える 384 KB</text>
  <rect x="24" y="282" width="932" height="30" rx="5" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.2"/>
  <text x="32" y="302" class="s">年</text>
  <text x="178" y="302" class="s"></text>
  <text x="378" y="302" class="s">1993 年 5 月印刷</text>
  <text x="578" y="302" class="s">1995 年</text>
  <text x="768" y="302" class="s">1993 年には存在</text>
</svg>
