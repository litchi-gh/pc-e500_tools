<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="t d">
  <title id="t">2 個の RAM を選ぶ回路</title>
  <desc id="d">CE0 と R26 を通った A15 が IC12 に入り、Y0 が IC11、Y1 が IC3 の CS1 へ行く回路と、アドレスの対応の図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .mb { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C0392B"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="429" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h" xml:space="preserve">2 個の RAM を選ぶ回路</text>
  <text x="24" y="55" class="sub" xml:space="preserve">IC12 TC3W01F が A15 と CE0 から、どちらの RAM を動かすかを決める</text>
  <rect x="24" y="96" width="110" height="190" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.2"/>
  <text x="79" y="196" class="b" xml:space="preserve" text-anchor="middle">CPU</text>
  <rect x="340" y="110" width="160" height="160" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.2"/>
  <text x="420" y="178" class="b" xml:space="preserve" text-anchor="middle">IC12</text>
  <text x="420" y="195" class="s" xml:space="preserve" text-anchor="middle">TC3W01F</text>
  <text x="420" y="212" class="s" xml:space="preserve" text-anchor="middle">デコード</text>
  <path d="M134 140L338 140" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="146" y="132" class="m" xml:space="preserve">A15</text>
  <rect x="200" y="128" width="66" height="24" rx="2" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.2"/>
  <text x="233" y="145" class="ms" xml:space="preserve" text-anchor="middle">R26 0 Ω</text>
  <path d="M134 240L338 240" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="146" y="232" class="m" xml:space="preserve">CE0</text>
  <rect x="640" y="90" width="316" height="80" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="798" y="126.5" class="b" xml:space="preserve" text-anchor="middle">IC11  32 KB</text>
  <text x="798" y="143.5" class="s" xml:space="preserve" text-anchor="middle">B0000h〜B7FFFh（A15 = 0）</text>
  <rect x="640" y="210" width="316" height="80" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.2"/>
  <text x="798" y="246.5" class="b" xml:space="preserve" text-anchor="middle">IC3  32 KB</text>
  <text x="798" y="263.5" class="s" xml:space="preserve" text-anchor="middle">B8000h〜BFFFFh（A15 = 1）</text>
  <path d="M500 150L638 130" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="520" y="132" class="ms" xml:space="preserve">Y0 → CS1</text>
  <path d="M500 230L638 250" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="520" y="224" class="ms" xml:space="preserve">Y1 → CS1</text>
  <text x="24" y="330" class="b" xml:space="preserve">機種の違いは部品で作る</text>
  <text x="40" y="356" class="b" xml:space="preserve">部品</text>
  <text x="260" y="356" class="b" xml:space="preserve">E500S（32 KB）</text>
  <text x="460" y="356" class="b" xml:space="preserve">E650、U6000（64 KB）</text>
  <text x="40" y="380" xml:space="preserve">R25（0 Ω）</text>
  <text x="260" y="380" xml:space="preserve">あり</text>
  <text x="460" y="380" xml:space="preserve">なし</text>
  <text x="40" y="404" xml:space="preserve">R26（0 Ω）、IC11</text>
  <text x="260" y="404" xml:space="preserve">なし</text>
  <text x="460" y="404" xml:space="preserve">あり</text>
  <text x="700" y="404" class="s" xml:space="preserve">アドレスの分かれ方は推定です。</text>
</svg>
