  <text x="625" y="184" text-anchor="middle">ページ 2</text>
  <text x="554" y="184" class="ms" xml:space="preserve" text-anchor="end">16〜23</text>
  <rect x="560" y="194" width="130" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="625" y="214" text-anchor="middle">ページ 3</text>
  <text x="554" y="214" class="ms" xml:space="preserve" text-anchor="end">24〜31</text>
  <rect x="560" y="224" width="130" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="625" y="244" text-anchor="middle">ページ 4</text>
  <text x="554" y="244" class="ms" xml:space="preserve" text-anchor="end">32〜39</text>
  <rect x="560" y="254" width="130" height="30" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="625" y="274" text-anchor="middle">ページ 5</text>
  <text x="554" y="274" class="ms" xml:space="preserve" text-anchor="end">40〜47</text>
  <rect x="560" y="284" width="130" height="30" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="625" y="304" text-anchor="middle">ページ 6</text>
  <text x="554" y="304" class="ms" xml:space="preserve" text-anchor="end">48〜55</text>
  <rect x="560" y="314" width="130" height="30" rx="0" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="625" y="334" text-anchor="middle">ページ 7</text>
  <text x="554" y="334" class="ms" xml:space="preserve" text-anchor="end">56〜63</text>
  <text x="730" y="90" class="b">画面の左半分</text>
  <rect x="730" y="104" width="200" height="120" rx="0" fill="#FFFFFF" stroke="#7B8794" stroke-width="1.5"/>
  <rect x="730" y="104" width="200" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="830" y="124" text-anchor="middle">ページ 1（ライン 8〜15）</text>
  <rect x="730" y="134" width="200" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="830" y="154" text-anchor="middle">ページ 2（ライン 16〜23）</text>
  <rect x="730" y="164" width="200" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="830" y="184" text-anchor="middle">ページ 3（ライン 24〜31）</text>
  <rect x="730" y="194" width="200" height="30" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="830" y="214" text-anchor="middle">ページ 4（ライン 32〜39）</text>
  <polyline points="692,194 729,164" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a52606D)"/>
  <text x="250" y="252" class="m" xml:space="preserve">命令 C0h（L = 0）</text>
  <text x="250" y="272" class="s">画面の一番上が RAM のライン 0</text>
  <text x="730" y="252" class="m" xml:space="preserve">命令 C8h（L = 8）</text>
  <text x="730" y="272" class="s">画面の一番上が RAM のライン 8</text>
  <text x="730" y="290" class="s">0〜31 の絵が 8 ドット上へ動いて見える</text>
  <text x="40" y="376">RAM の中身は書き換えない。1 ずつ変えれば 1 ドット単位で動く。同じ RAM の点が、画面では別の y に出ることに注意</text>
</svg>
