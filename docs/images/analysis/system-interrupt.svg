  <polyline points="194,376 212,376 212,131 230,131" fill="none" stroke="#2F6DB5" stroke-width="1.5" marker-end="url(#a2F6DB5)"/>
  <polyline points="212,376 212,481 230,481" fill="none" stroke="#2F6DB5" stroke-width="1.5" marker-end="url(#a2F6DB5)"/>
  <text x="24" y="540" class="s">RAM のベクタ（黄）は書き換えられる。どの要因にも当たらないときは、戻り先の 1 バイトが FEh（IR 命令）ならソフトウェア割り込みとして扱う。</text>
</svg>
