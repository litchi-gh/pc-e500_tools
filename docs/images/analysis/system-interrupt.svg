  <text x="384" y="236.04" text-anchor="middle">シリアル送信（ビット 4）</text>
  <rect x="514" y="212" width="100" height="38" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="564" y="235.68" class="m" xml:space="preserve" text-anchor="middle">BFCD2h</text>
  <rect x="646" y="212" width="100" height="38" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="696" y="235.68" class="m" xml:space="preserve" text-anchor="middle">F20C3h</text>
  <text x="790" y="236">未使用</text>
  <polyline points="484,231 512,231" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="614,231 644,231" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <rect x="232" y="262" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="249" y="286.04" class="b" text-anchor="middle">4</text>
  <rect x="284" y="262" width="200" height="38" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="384" y="286.04" text-anchor="middle">ON キー（ビット 3）</text>
  <rect x="514" y="262" width="100" height="38" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="564" y="285.68" class="m" xml:space="preserve" text-anchor="middle">BFCCFh</text>
  <rect x="646" y="262" width="100" height="38" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="696" y="285.68" class="m" xml:space="preserve" text-anchor="middle">F20BAh</text>
  <text x="790" y="286">未使用</text>
  <polyline points="484,281 512,281" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="614,281 644,281" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <rect x="232" y="312" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="249" y="336.04" class="b" text-anchor="middle">5</text>
  <rect x="284" y="312" width="200" height="38" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
  <text x="384" y="336.04" text-anchor="middle">キー（ビット 2）</text>
  <rect x="514" y="312" width="100" height="38" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="564" y="335.68" class="m" xml:space="preserve" text-anchor="middle">BFCCCh</text>
  <rect x="646" y="312" width="100" height="38" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="696" y="335.68" class="m" xml:space="preserve" text-anchor="middle">F20B1h</text>
  <text x="790" y="336">未使用</text>
  <polyline points="484,331 512,331" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="614,331 644,331" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <rect x="232" y="362" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="249" y="386.04" class="b" text-anchor="middle">6</text>
  <rect x="284" y="362" width="200" height="38" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="384" y="386.04" text-anchor="middle">遅いタイマ（ビット 1）</text>
  <rect x="514" y="362" width="100" height="38" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="564" y="385.68" class="m" xml:space="preserve" text-anchor="middle">BFCC9h</text>
  <rect x="646" y="362" width="100" height="38" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="696" y="385.68" class="m" xml:space="preserve" text-anchor="middle">F215Ch</text>
  <text x="790" y="386">カーソルの点滅など</text>
  <polyline points="484,381 512,381" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="614,381 644,381" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <rect x="232" y="412" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="249" y="436.04" class="b" text-anchor="middle">7</text>
  <rect x="284" y="412" width="200" height="38" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="384" y="436.04" text-anchor="middle">速いタイマ（ビット 0）</text>
  <rect x="514" y="412" width="100" height="38" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="564" y="435.68" class="m" xml:space="preserve" text-anchor="middle">BFCC6h</text>
  <rect x="646" y="412" width="100" height="38" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="696" y="435.68" class="m" xml:space="preserve" text-anchor="middle">F20C4h</text>
  <text x="790" y="436">キースキャン</text>
  <polyline points="484,431 512,431" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="614,431 644,431" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <rect x="232" y="462" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="249" y="486.04" class="b" text-anchor="middle">8</text>
  <rect x="284" y="462" width="200" height="38" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1.5"/>
