  <polyline points="614,131 644,131" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <rect x="232" y="162" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="249" y="186.04" class="b" text-anchor="middle">2</text>
  <rect x="284" y="162" width="200" height="38" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="384" y="186.04" text-anchor="middle">外部（ビット 6）</text>
  <rect x="514" y="162" width="100" height="38" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="564" y="185.68" class="m" xml:space="preserve" text-anchor="middle">BFCD8h</text>
  <rect x="646" y="162" width="100" height="38" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="696" y="185.68" class="m" xml:space="preserve" text-anchor="middle">F20DFh</text>
  <text x="790" y="186">電池の検出</text>
  <polyline points="484,181 512,181" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="614,181 644,181" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <rect x="232" y="212" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
