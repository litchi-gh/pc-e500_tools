<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d">
  <title id="t">割り込みの要因が処理に届くまで</title>
  <desc id="d">ISR の 8 ビットの要因、CPU のベクタ FFFFAh、ROM のエントリ F2005h、優先順位、RAM のベクタ BFCC6h からの並びを示す図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <defs><marker id="a2F6DB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="a52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="559" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">割り込みの要因が処理に届くまで</text>
  <text x="24" y="55" class="sub">CPU のベクタは 1 つだけ。ROM のエントリが要因を調べ、RAM のベクタへ飛ぶ（アドレスは ROM 3.2）</text>
  <rect x="24" y="90" width="170" height="92" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="109" y="124.04" class="b" text-anchor="middle">要因が起きる</text>
  <text x="109" y="141.32" class="s" text-anchor="middle">ISR（FCh）のビット = 1</text>
  <text x="109" y="158.32" class="s" text-anchor="middle">IMR（FBh）で許可</text>
  <rect x="24" y="220" width="170" height="70" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="109" y="251.54" class="b" text-anchor="middle">CPU</text>
  <text x="109" y="268.82" class="s" text-anchor="middle">ベクタ FFFFAh を読む</text>
  <rect x="24" y="330" width="170" height="92" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="109" y="364.04" class="b" text-anchor="middle">ROM のエントリ</text>
  <text x="109" y="381.32" class="s" text-anchor="middle">F2005h（3.2）</text>
  <text x="109" y="398.32" class="s" text-anchor="middle">上から順に調べる</text>
  <polyline points="109,182 109,218" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <polyline points="109,290 109,328" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#a52606D)"/>
  <text x="240" y="98" class="b">優先</text>
  <text x="290" y="98" class="b">要因（ISR のビット）</text>
  <text x="520" y="98" class="b">RAM のベクタ</text>
  <text x="652" y="98" class="b">ジャンプ先（3.2）</text>
  <text x="790" y="98" class="b">用途（公式）</text>
  <rect x="232" y="112" width="34" height="38" rx="6" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="249" y="136.04" class="b" text-anchor="middle">1</text>
  <rect x="284" y="112" width="200" height="38" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.5"/>
  <text x="384" y="136.04" text-anchor="middle">シリアル受信（ビット 5）</text>
  <rect x="514" y="112" width="100" height="38" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1.5"/>
  <text x="564" y="135.68" class="m" xml:space="preserve" text-anchor="middle">BFCD5h</text>
  <rect x="646" y="112" width="100" height="38" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="696" y="135.68" class="m" xml:space="preserve" text-anchor="middle">F614Ch</text>
  <text x="790" y="136">受信</text>
