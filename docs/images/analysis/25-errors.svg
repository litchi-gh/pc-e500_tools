<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="t d">
  <title id="t">エラー番号とメッセージの表</title>
  <desc id="d">ROM の中のエラー番号から 0Ah を引いた数だけ文字列を飛ばすとメッセージが決まり、ERN の値はメッセージの番号に 9 を足したものになることを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="299" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">エラー番号とメッセージの表</text>
  <text x="24" y="55" class="sub">表は 00h で区切った文字列を 1 番から並べたもの。番号のない所は空の文字列</text>
  <rect x="24" y="84" width="206" height="80" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="127" y="120.5" class="b" text-anchor="middle">処理が返す番号</text>
  <text x="127" y="137.5" class="s" text-anchor="middle">5Ah = 90</text>
  <polyline points="230,124 260,124" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="262" y="84" width="206" height="80" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="365" y="112" class="b" text-anchor="middle">表を引く</text>
  <text x="365" y="129" class="s" text-anchor="middle">90 − 0Ah = 80</text>
  <text x="365" y="146" class="s" text-anchor="middle">文字列を 80 個飛ばす</text>
  <polyline points="468,124 498,124" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="500" y="84" width="206" height="80" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="603" y="112" class="b" text-anchor="middle">表の中の番号</text>
  <text x="603" y="129" class="s" text-anchor="middle">81 番</text>
  <text x="603" y="146" class="s" text-anchor="middle">Type mismatch</text>
  <polyline points="706,124 736,124" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="738" y="84" width="206" height="80" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="841" y="112" class="b" text-anchor="middle">BASIC から見える番号</text>
  <text x="841" y="129" class="s" text-anchor="middle">ERN = 90</text>
  <text x="841" y="146" class="s" text-anchor="middle">（81 + 9）</text>
  <rect x="24" y="190" width="932" height="84" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="44" y="216">1 番 Syntax error → ERN 10　　12 番 Division by Zero → ERN 21　　90 番 Low battery → ERN 99</text>
  <text x="44" y="242" class="s">改訂 7 までは 1〜90 番のうち 44 個に文言があり、改訂 8 では 51 個（52〜55、57、59、60 番が増えた）</text>
  <text x="44" y="262" class="s">表の大きさは、改訂 7 まで 806 バイト、改訂 8 で 1,007 バイト</text>
</svg>
