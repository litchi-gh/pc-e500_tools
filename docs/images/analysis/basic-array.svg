  <text x="822.4" y="474" class="m" text-anchor="middle" xml:space="preserve">29h</text>
  <rect x="822.4" y="400" width="110" height="54" rx="0" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="877.4" y="432" class="s" text-anchor="middle" xml:space="preserve">T$ の基準</text>
  <rect x="24" y="510" width="932" height="106" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="40" y="536" class="b" xml:space="preserve">位置の計算</text>
  <text x="40" y="560" xml:space="preserve">R$(1) の位置 = 基準 00h + R$(0) の 14 文字 = 0Eh　　R$(2) の位置 = 0Eh + 10 = 18h</text>
  <text x="40" y="584" xml:space="preserve">次に作った DIM T$(3) の基準 = 18h + 17 = 29h（R$ の文字列の合計 41 バイト）</text>
  <text x="40" y="606" class="s" xml:space="preserve">記録の長さ = 4 + 名前 1 + 1 + 2 × 次元数 1 + 3 + 3 × 要素 3 = 20 = 14h</text>
