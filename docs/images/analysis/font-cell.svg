  <text x="24" y="34" class="h" xml:space="preserve">1 文字 6 バイトの読み方</text>
  <text x="24" y="55" class="sub" xml:space="preserve">例: 文字コード 41h「A」。アドレス 30186h からの 6 バイト 7C 12 11 12 7C 00</text>
