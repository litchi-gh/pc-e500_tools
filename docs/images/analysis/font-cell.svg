  <text x="168" y="108" class="m" text-anchor="middle" xml:space="preserve">7C</text>
  <text x="168" y="84" class="ms" text-anchor="middle" xml:space="preserve">+0</text>
  <rect x="186" y="90" width="36" height="26" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="204" y="108" class="m" text-anchor="middle" xml:space="preserve">12</text>
  <text x="204" y="84" class="ms" text-anchor="middle" xml:space="preserve">+1</text>
  <rect x="222" y="90" width="36" height="26" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="240" y="108" class="m" text-anchor="middle" xml:space="preserve">11</text>
  <text x="240" y="84" class="ms" text-anchor="middle" xml:space="preserve">+2</text>
  <rect x="258" y="90" width="36" height="26" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="276" y="108" class="m" text-anchor="middle" xml:space="preserve">12</text>
  <text x="276" y="84" class="ms" text-anchor="middle" xml:space="preserve">+3</text>
  <rect x="294" y="90" width="36" height="26" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="312" y="108" class="m" text-anchor="middle" xml:space="preserve">7C</text>
  <text x="312" y="84" class="ms" text-anchor="middle" xml:space="preserve">+4</text>
  <rect x="330" y="90" width="36" height="26" rx="0" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="348" y="108" class="m" text-anchor="middle" xml:space="preserve">00</text>
  <text x="348" y="84" class="ms" text-anchor="middle" xml:space="preserve">+5</text>
  <text x="138" y="143" class="m" text-anchor="end" xml:space="preserve">bit 0</text>
  <text x="378" y="143" class="m" xml:space="preserve">01h</text>
  <text x="138" y="179" class="m" text-anchor="end" xml:space="preserve">bit 1</text>
  <text x="378" y="179" class="m" xml:space="preserve">02h</text>
  <text x="138" y="215" class="m" text-anchor="end" xml:space="preserve">bit 2</text>
  <text x="378" y="215" class="m" xml:space="preserve">04h</text>
  <text x="138" y="251" class="m" text-anchor="end" xml:space="preserve">bit 3</text>
  <text x="378" y="251" class="m" xml:space="preserve">08h</text>
  <text x="138" y="287" class="m" text-anchor="end" xml:space="preserve">bit 4</text>
  <text x="378" y="287" class="m" xml:space="preserve">10h</text>
  <text x="138" y="323" class="m" text-anchor="end" xml:space="preserve">bit 5</text>
  <text x="378" y="323" class="m" xml:space="preserve">20h</text>
  <text x="138" y="359" class="m" text-anchor="end" xml:space="preserve">bit 6</text>
  <text x="378" y="359" class="m" xml:space="preserve">40h</text>
  <text x="138" y="395" class="m" text-anchor="end" xml:space="preserve">bit 7</text>
  <text x="378" y="395" class="m" xml:space="preserve">80h</text>
  <text x="138" y="108" class="s" text-anchor="end" xml:space="preserve">バイト</text>
  <text x="258" y="432" class="s" text-anchor="middle" xml:space="preserve">1 バイト = 縦 8 ドットの 1 列</text>
  <text x="470" y="110" class="b" xml:space="preserve">バイト +0 = 7Ch を 2 進数で書くと</text>
  <rect x="470" y="124" width="44" height="34" rx="0" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1"/>
  <text x="492" y="146" class="mb" text-anchor="middle" xml:space="preserve">0</text>
  <text x="492" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 7</text>
  <rect x="514" y="124" width="44" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="536" y="146" class="mb" text-anchor="middle" xml:space="preserve">1</text>
  <text x="536" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 6</text>
  <rect x="558" y="124" width="44" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="580" y="146" class="mb" text-anchor="middle" xml:space="preserve">1</text>
  <text x="580" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 5</text>
  <rect x="602" y="124" width="44" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="624" y="146" class="mb" text-anchor="middle" xml:space="preserve">1</text>
  <text x="624" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 4</text>
  <rect x="646" y="124" width="44" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="668" y="146" class="mb" text-anchor="middle" xml:space="preserve">1</text>
  <text x="668" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 3</text>
  <rect x="690" y="124" width="44" height="34" rx="0" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="712" y="146" class="mb" text-anchor="middle" xml:space="preserve">1</text>
  <text x="712" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 2</text>
  <rect x="734" y="124" width="44" height="34" rx="0" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1"/>
  <text x="756" y="146" class="mb" text-anchor="middle" xml:space="preserve">0</text>
  <text x="756" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 1</text>
  <rect x="778" y="124" width="44" height="34" rx="0" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1"/>
  <text x="800" y="146" class="mb" text-anchor="middle" xml:space="preserve">0</text>
  <text x="800" y="176" class="ms" text-anchor="middle" xml:space="preserve">bit 0</text>
  <text x="470" y="206" xml:space="preserve">立っているのは bit 2、3、4、5、6 の 5 個。</text>
  <text x="470" y="228" xml:space="preserve">上から 3 番目〜7 番目のドットが黒になり、A の左の縦棒になります。</text>
  <rect x="470" y="256" width="470" height="120" rx="8" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="486" y="282" class="b" xml:space="preserve">足し算で確かめる</text>
  <text x="486" y="306" class="m" xml:space="preserve">bit 2 〜 bit 6 = 04h + 08h + 10h + 20h + 40h = 7Ch</text>
  <text x="486" y="336" xml:space="preserve">最後のバイト +5 = 00h は空の列で、</text>
  <text x="486" y="358" xml:space="preserve">となりの文字との 1 ドットのすき間になります。</text>
</svg>
