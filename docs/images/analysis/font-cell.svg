<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">1 文字 6 バイトの読み方</title>
  <desc id="d">文字 A（41h）の 6 バイトを縦の列として並べ、ビット 0 を上、ビット 7 を下にして 6×8 ドットの字形にする図。</desc>
