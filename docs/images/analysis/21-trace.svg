<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
  <title id="t">アドレスを 1 つ知れば、処理をさかのぼれる</title>
  <desc id="d">ROM の中の文字列を探し、アドレスに換算し、そのアドレスを 3 バイトで書いた命令を探す流れを示した図。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; fill: #1F2933; }
    .b { font-weight: 700; }
    .h { font-weight: 700; font-size: 18px; }
    .sub { font-size: 13px; fill: #52606D; }
    .s { font-size: 12px; fill: #52606D; }
    .m { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ms { font-family: "Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; font-size: 11px; }
    .lbl { font-size: 12px; fill: #52606D; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs>
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#FFFFFF" stroke="#D9E0E8"/>
  <text x="24" y="34" class="h">アドレスを 1 つ知れば、処理をさかのぼれる</text>
  <text x="24" y="55" class="sub">例: 7.2 の「Syntax error」の文字から、エラーの表を引く処理までたどる</text>
  <rect x="24" y="86" width="206" height="96" rx="6" fill="#FFF5DF" stroke="#B7791F" stroke-width="1"/>
  <text x="127" y="122" class="b" text-anchor="middle">1. 文字を探す</text>
  <text x="127" y="139" class="s" text-anchor="middle">Syntax error</text>
  <text x="127" y="156" class="s" text-anchor="middle">ファイルの位置 29681h</text>
  <polyline points="230,134 260,134" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="262" y="86" width="206" height="96" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="365" y="122" class="b" text-anchor="middle">2. アドレスに換算</text>
  <text x="365" y="139" class="s" text-anchor="middle">29681h + C0000h</text>
  <text x="365" y="156" class="s" text-anchor="middle">= E9681h</text>
  <polyline points="468,134 498,134" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="500" y="86" width="206" height="96" rx="6" fill="#E8F1FC" stroke="#2F6DB5" stroke-width="1"/>
  <text x="603" y="122" class="b" text-anchor="middle">3. 命令の形にする</text>
  <text x="603" y="139" class="s" text-anchor="middle">下位が先の 3 バイト</text>
  <text x="603" y="156" class="s" text-anchor="middle">81 96 0E</text>
  <polyline points="706,134 736,134" fill="none" stroke="#7B8794" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="738" y="86" width="206" height="96" rx="6" fill="#E6F6EC" stroke="#2F855A" stroke-width="1"/>
  <text x="841" y="122" class="b" text-anchor="middle">4. 使う命令を探す</text>
  <text x="841" y="139" class="s" text-anchor="middle">F443Ah</text>
  <text x="841" y="156" class="s" text-anchor="middle">MV X,E9681h</text>
  <rect x="24" y="206" width="932" height="100" rx="6" fill="#F3F5F8" stroke="#7B8794" stroke-width="1"/>
  <text x="44" y="232" class="b">F443Ah の前後を読むと</text>
  <text x="44" y="256" class="m" xml:space="preserve">F443E  MV  (BP+00),A    … A に内部のエラー番号</text>
  <text x="44" y="276" class="m" xml:space="preserve">F4440  SUB (BP+00),0Ah  … 0Ah を引いた数だけ文字列を読み飛ばす</text>
  <text x="44" y="296" class="s">→ 内部の番号 5Ah は 5Ah − 0Ah = 80 個を飛ばした 81 番目の Type mismatch</text>
</svg>
